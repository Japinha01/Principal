let idioma = (navigator.language || 'pt').slice(0,2);
if(!T[idioma]) idioma = 'en';

function aplicarTextos(){
  const t = T[idioma];
  document.documentElement.lang = idioma;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t] || ''; });
  document.getElementById('recursos').innerHTML = t.r.map(([titulo, texto]) =>
    `<div class="cartao"><h3>${titulo}</h3><p>${texto}</p></div>`).join('');
  document.getElementById('idiomas').innerHTML = ['pt','en','es','ru','ja','ko'].map(l =>
    `<button data-idioma="${l}" aria-pressed="${l===idioma}">${({pt:'Português', en:'English', es:'Español', ru:'Русский', ja:'日本語', ko:'한국어'})[l]}</button>`).join('');
  atualizarBeta();
}
document.getElementById('idiomas').addEventListener('click', ev => {
  const b = ev.target.closest('[data-idioma]');
  if(b){ idioma = b.dataset.idioma; aplicarTextos(); }
});

  for(const j of BETA.janelas){
    const de = new Date(j.de).getTime(), ate = new Date(j.ate).getTime();
    if(agora >= de && agora <= ate) return {aberta:true, fim:ate};
    if(agora < de) return {aberta:false, inicio:de};
  }
  return {aberta:false, acabou:true};
}
function tempoTexto(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), sg = s%60;
  const p = n => String(n).padStart(2,'0');
  return (d ? d + 'd ' : '') + p(h) + ':' + p(m) + ':' + p(sg);
}
function atualizarBeta(){
  const t = T[idioma], caixa = document.getElementById('caixaBeta');
  const texto = document.getElementById('betaTexto'), relogio = document.getElementById('relogio');
  const botao = document.getElementById('btnJogar');
  if(!BETA.ativo){
    caixa.classList.add('aberto'); texto.textContent = t.beta_livre; relogio.textContent = '';
    botao.removeAttribute('aria-disabled'); return;
  }
  const j = janelaAtual();
  if(j.aberta){
    caixa.classList.add('aberto');
    texto.textContent = t.beta_aberto;
    relogio.textContent = tempoTexto(j.fim - Date.now());
    botao.style.display = '';
  } else {
    caixa.classList.remove('aberto');
    texto.textContent = j.acabou ? t.beta_encerrado : t.beta_fechado;
    relogio.textContent = j.acabou ? '' : tempoTexto(j.inicio - Date.now());
    botao.style.display = 'none';
  }
  document.getElementById('caixaCodigo').hidden = !(BETA.ativo && !j.aberta && BETA.codigo);
}
setInterval(atualizarBeta, 1000);

/* ===== lista de espera (Firestore) ===== */
let fb = null;
async function carregarFirebase(){
  if(fb) return fb;
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [app, auth, store] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js'),
  ]);
  const aplicativo = app.initializeApp(FIREBASE);
  const autenticacao = auth.getAuth(aplicativo);
  if(!autenticacao.currentUser) await auth.signInAnonymously(autenticacao);
  fb = {db: store.getFirestore(aplicativo), colecao: store.collection, novoDoc: store.addDoc};
  return fb;
}
document.getElementById('formLista').addEventListener('submit', async ev => {
  ev.preventDefault();
  const t = T[idioma], aviso = document.getElementById('avisoLista');
  const email = document.getElementById('email').value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){ aviso.textContent = t.lista_invalido; return; }
  aviso.textContent = '...';
  try{
    const f = await carregarFirebase();
    await f.novoDoc(f.colecao(f.db, 'wishlist'), {
      email: email.slice(0,120), quando: Date.now(), idioma,
      origem: (location.search || '').slice(0,120) || 'direto',
    });
    aviso.textContent = t.lista_ok;
    ev.target.reset();
  }catch(e){ aviso.textContent = t.lista_erro; }
});

document.getElementById('formCodigo').addEventListener('submit', ev => {
  ev.preventDefault();
  const t = T[idioma], aviso = document.getElementById('avisoCodigo');
  const cod = document.getElementById('codigo').value.trim();
  if(BETA.codigo && cod === BETA.codigo){
    try{ localStorage.setItem('sina_beta_ok', cod); }catch(e){}
    aviso.textContent = t.codigo_ok;
    setTimeout(()=>{ location.href = '/sina/'; }, 700);
  } else aviso.textContent = t.codigo_erro;
});

aplicarTextos();
