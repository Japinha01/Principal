    const m = !ev.repeat && performance.now() - G.levelAt >= 350 && /^(?:Digit|Numpad)([1-5])$/.exec(ev.code);

const joyEl = $('#joy'), joyKnob = joyEl.querySelector('i');

  if(adPlaying) return;
  if(!G || G.mode!=='play' || joy.active) return;
  audioOn();
  joy.active = true; joy.id = ev.pointerId; joy.ox = ev.clientX; joy.oy = ev.clientY; joy.dx = joy.dy = 0;
  joyEl.style.left = ev.clientX+'px'; joyEl.style.top = ev.clientY+'px';
  joyKnob.style.transform = 'none';
  joyEl.hidden = false;
  try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
});
cv.addEventListener('pointermove', ev=>{
  if(!joy.active || ev.pointerId!==joy.id) return;
  let dx = ev.clientX-joy.ox, dy = ev.clientY-joy.oy;
  const d = Math.hypot(dx,dy), max = 44;
  if(d>max){ dx=dx/d*max; dy=dy/d*max; }
  joy.dx = dx/max; joy.dy = dy/max;
  if(d < 6){ joy.dx = joy.dy = 0; }
  joyKnob.style.transform = `translate(${dx}px,${dy}px)`;
});
function joyEnd(){ joy.active=false; joy.dx=joy.dy=0; joyEl.hidden=true; }

const CFG = Object.assign({adsenseClient:'', adsenseTest:false, lojaApi:'', privacidade:'', firebase:null, appleLogin:false, beta:null}, window.SINA_CONFIG || {});

/* ---------- acesso beta por janelas de tempo ---------- */
function janelaBeta(){
  const b = CFG.beta;
  if(!b || !b.ativo) return {liberado:true};
  try{ if(localStorage.getItem('sina_beta_ok') === (b.codigo || '#')) return {liberado:true}; }catch(e){}
  const agora = Date.now();
  for(const j of (b.janelas || [])){
    const de = new Date(j.de).getTime(), ate = new Date(j.ate).getTime();
    if(agora >= de && agora <= ate) return {liberado:true, fim:ate};
    if(agora < de) return {liberado:false, inicio:de};
  }
  return {liberado:false, acabou:true};
}
function tempoBeta(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const d = Math.floor(s/86400);
  const resto = fmtTime(s % 86400);
  return d ? tr('beta_dias', {d}) + ' ' + resto : resto;
}
function renderBeta(){
  const j = janelaBeta();
  if(j.liberado){ if(!$('#beta').hidden) goMenu(); return; }
  const quando = j.acabou ? '' : tempoBeta(j.inicio - Date.now());
  $('#betaConteudo').innerHTML = `
    <p class="desc">${j.acabou ? tr('beta_espera') : tr('beta_sub', {t:quando})}</p>
    ${j.acabou ? '' : `<p class="relogio-beta">${quando}</p>`}
    ${CFG.beta && CFG.beta.codigo ? `<div class="opt"><label for="betaCodigo">${tr('beta_codigo')}</label>
      <div class="restaurar"><input id="betaCodigo" autocomplete="off"><button class="btn peq" id="betaEntrar">${tr('beta_entrar')}</button></div></div>` : ''}
    ${CFG.beta && CFG.beta.pagina ? `<div class="acoes"><a class="btn primario" href="${CFG.beta.pagina}">${tr('beta_lista')}</a></div>` : ''}
    <p id="betaMsg" role="status"></p>`;
  showOnly('beta');
}
function verificarBeta(){
  if(janelaBeta().liberado) return true;
  renderBeta();
  if(!window.__betaTimer) window.__betaTimer = setInterval(()=>{ if(!$('#beta').hidden) renderBeta(); }, 1000);
  return false;
}

function adsOn(){ return Portal.kind !== 'local'; }

function initAdsense(){
  if(!CFG.adsenseClient) return false;
  try{
    window.adsbygoogle = window.adsbygoogle || [];
    window.adBreak = window.adConfig = function(o){ window.adsbygoogle.push(o); };
    const s = document.createElement('script');
    s.async = true; s.crossOrigin = 'anonymous';
    s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + encodeURIComponent(CFG.adsenseClient);
    s.setAttribute('data-ad-client', CFG.adsenseClient);
    s.setAttribute('data-ad-frequency-hint', '120s');
    if(CFG.adsenseTest) s.setAttribute('data-adbreak-test', 'on');
    document.head.appendChild(s);
    window.adConfig({preloadAdBreaks:'on', sound: muted ? 'off' : 'on'});
    return true;
  }catch(e){ return false; }
}

/* ---------- presente diário e bênção inicial ---------- */
function hoje(){ const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dailyState(){
  if(!SAVE.daily || SAVE.daily.dia !== hoje()) SAVE.daily = {dia:hoje(), gratis:false, anuncio:false};
  return SAVE.daily;
}
function renderDaily(){
  const d = dailyState(), b = $('#btnDaily');
  if(!d.gratis){ b.textContent = tr('daily_free', {n:40}); b.disabled = false; b.dataset.modo = 'gratis'; }
  else if(adsOn() && !d.anuncio){ b.textContent = tr('daily_ad', {n:80}); b.disabled = false; b.dataset.modo = 'anuncio'; }
  else { b.textContent = tr('daily_done'); b.disabled = true; b.dataset.modo = ''; }
  aplicarIconesMenu();
  $('#btnBencao').hidden = !adsOn();
  $('#btnLoja').hidden = !CFG.lojaApi;
  $('#selo').hidden = !SAVE.premium;
}
function ganharAlmas(n){
  SAVE.almas += n; persist();
  toast(tr('daily_got', {n})); sfx.coin();
  $('#menuAlmas').innerHTML = tr('menu_souls', {n:SAVE.almas}) + (SAVE.best.time>0 ? tr('menu_record', {t:fmtTime(SAVE.best.time), k:fmtN(SAVE.best.kills)}) : '');
}
$('#btnDaily').onclick = ()=>{
  audioOn();
  const d = dailyState(), modo = $('#btnDaily').dataset.modo;
  if(modo==='gratis'){ d.gratis = true; ganharAlmas(40); renderDaily(); }
  else if(modo==='anuncio'){
    Portal.rewarded(()=>{ d.anuncio = true; ganharAlmas(80); renderDaily(); }, ()=>toast(tr('ad_fail')), 'presente_diario');
  }
};
$('#btnBencao').onclick = ()=>{
  audioOn();
  Portal.rewarded(()=>{ startRun(); G.chestQ.push(2); }, ()=>toast(tr('ad_fail')), 'bencao_inicial');
};

/* ---------- troca de cartas e bolsa do mercador por anúncio ---------- */
$('#btnRerollAd').onclick = ()=>{
  if(!G || G.mode!=='level') return;
  Portal.rewarded(()=>{ G.adReroll = true; P.freeRerolls += 1; reroll(); }, ()=>toast(tr('ad_fail')), 'trocar_cartas');
};

  const b = $('#btnRerollAd');
  b.hidden = !(adsOn() && P.freeRerolls === 0 && !G.adReroll);
}

/* ---------- aparências ---------- */
function renderSkins(){
  let h = '';
  const sel = SAVE.skin || '';
  const base = SPR_CHAR[SAVE.char] || SPR_CHAR.andarilho;
  h += `<div class="linha"><div class="skin-info"><span class="pxr" style="--c:${base[0]};--r:${base[1]}"></span><div class="nome">${tr('skin_default')}</div></div>
    <button class="btn peq" data-skin="" ${sel===''?'disabled':''}>${sel===''?tr('equipped'):tr('equip')}</button></div>`;
  for(const id in SKINS){
    const k = SKINS[id], tem = SAVE.skins[id] || (k.premium && SAVE.premium);
    let btn;
    if(sel===id) btn = `<button class="btn peq" disabled>${tr('equipped')}</button>`;
    else if(tem) btn = `<button class="btn peq" data-skin="${id}">${tr('equip')}</button>`;
    else if(k.premium) btn = `<button class="btn peq" disabled>${tr('skin_premium')}</button>`;
    else btn = `<button class="btn peq" data-buyskin="${id}" ${SAVE.almas<k.preco?'disabled':''}>${tr('buy_souls', {p:k.preco})}</button>`;
    h += `<div class="linha"><div class="skin-info"><span class="pxr" style="--c:${k.c[0]};--r:${k.c[1]}"></span><div class="nome">${skinNome(id)}${k.premium?' <span class="tag-apoio">✦</span>':''}</div></div>${btn}</div>`;
  }
  $('#listaSkins').innerHTML = h;
}
$('#listaSkins').addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b || b.disabled) return;
  if(b.dataset.skin !== undefined){ SAVE.skin = b.dataset.skin; }
  else if(b.dataset.buyskin){
    const id = b.dataset.buyskin, k = SKINS[id];
    if(SAVE.almas < k.preco) return;
    SAVE.almas -= k.preco; SAVE.skins[id] = true; SAVE.skin = id; sfx.level();
  } else return;
  persist(); renderReli();
});

/* ---------- Tesouro (Mercado Pago) ---------- */
function apiUrl(p){ return CFG.lojaApi.replace(/\/$/, '') + p; }
function lojaMsg(t){ $('#lojaMsg').textContent = t; }
function renderLoja(){
  let h = `<p class="sub">${tr('store_sub')}</p><div class="loja">`;
  for(const p of PACOTES){
    const comprado = p.premium && SAVE.premium;
    h += `<div class="item pacote ${p.premium?'r3':p.melhor?'r2':'r1'}">
      <div class="topo"><span>${p.melhor?tr('best_value'):''}</span><span class="rar">${p.premium?'✦':''}</span></div>
      <div class="pacote-ico">${iconHtml(p.icon)}</div>
      <div class="nome">${tr('pack_'+p.id)}</div>
      <p>${tr(p.premium ? 'pack_apoiador_desc' : 'pack_almas_desc', {n:p.almas.toLocaleString({pt:'pt-BR',en:'en-US',es:'es-ES',ru:'ru-RU',ja:'ja-JP',ko:'ko-KR'}[LANG]||'pt-BR')})}</p>
      <button class="btn peq ${p.premium?'primario':''}" data-pack="${p.id}" ${comprado?'disabled':''}>${comprado?tr('owned'):tr('buy_money', {p:p.preco})}</button>
    </div>`;
  }
  h += `</div>
    <h3>${tr('restore_title')}</h3>
    <p class="desc">${tr('restore_desc')}</p>
    <div class="restaurar"><input id="restId" inputmode="numeric" autocomplete="off" placeholder="${tr('restore_ph')}"><button class="btn peq" id="restBtn">${tr('restore_btn')}</button></div>
    <p id="lojaMsg" role="status"></p>`;
  $('#lojaConteudo').innerHTML = h;
}
$('#loja').addEventListener('click', async ev=>{
  const b = ev.target.closest('button'); if(!b || b.disabled) return;
  if(b.dataset.pack){
    lojaMsg(tr('store_wait'));
    try{
      const r = await fetch(apiUrl('/sina-pagamento'), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({pacote:b.dataset.pack})});
      const d = await r.json();
      if(!r.ok || !d.url) throw new Error('sem url');
      location.href = d.url;
    }catch(e){ lojaMsg(tr('store_err')); }
  } else if(b.id==='restBtn'){
    const id = ($('#restId').value||'').replace(/\D/g,'');
    if(!id) return;
    const ok = await confirmarPagamento(id, true);
    if(ok) renderLoja();
  } else if(b.id==='lojaVoltar') goMenu();
});
async function confirmarPagamento(id, restaurando){
  try{
    const r = await fetch(apiUrl('/sina-confirmar?id=' + encodeURIComponent(id)));
    const d = await r.json();
    if(!d.ok){
      const pend = d.status==='pending' || d.status==='in_process';
      const msg = tr(pend ? 'pay_pending' : restaurando ? 'restore_err' : 'pay_fail');
      restaurando ? lojaMsg(msg) : toast(msg);
      return false;
    }
    return aplicarPacote(d.pacote, String(id), restaurando);
  }catch(e){
    restaurando ? lojaMsg(tr('restore_err')) : toast(tr('pay_fail'));
    return false;
  }
}
function aplicarPacote(pid, id, restaurando){
  const p = PACOTES.find(x=>x.id===pid);
  if(!p) return false;
  if(SAVE.compras[id]){ const m = tr('pay_dup'); restaurando ? lojaMsg(m) : toast(m); return false; }
  SAVE.compras[id] = pid;
  SAVE.almas += p.almas;
  if(p.premium) SAVE.premium = true;
  persist();
  const m = tr('pay_ok', {n:tr('pack_'+pid)});
  restaurando ? lojaMsg(m) : toast(m);
  sfx.evo();
  goMenuSeAberto();
  return true;
}
function goMenuSeAberto(){ if(!G || G.mode==='menu') { if(!$('#menu').hidden) goMenu(); } }
async function verificarRetornoPagamento(){
  if(!CFG.lojaApi) return;
  let q;
  try{ q = new URLSearchParams(location.search); }catch(e){ return; }
  const st = q.get('pagamento');
  if(!st) return;
  const id = q.get('payment_id') || q.get('collection_id');
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
  if(st === 'falhou'){ toast(tr('pay_fail')); return; }
  if(!id || id === 'null'){ if(st === 'pendente') toast(tr('pay_pending')); return; }
  await confirmarPagamento(id, false);
}
$('#btnLoja').onclick = ()=>{ audioOn(); renderLoja(); showOnly('loja'); };

function usarHabilidade(){
  if(!G || G.mode!=='play' || G.skillCd > 0) return;
  const c = G.char, L = G.lvl;
  const [hw, hh] = viewHalf();
  const naTela = e => !e.dead && Math.abs(e.x-P.x) < hw && Math.abs(e.y-P.y) < hh;
  switch(c){
    case 'andarilho':{
      const d = Math.round(wstat('faca', Math.max(3, (G.weapons.find(w=>w.id==='faca')||{lvl:3}).lvl), false).dmg * 1.5);
      for(let i=0;i<24;i++){
        const a = i/24*Math.PI*2;
        G.proj.push({kind:'faca', tag:'lamina', x:P.x, y:P.y, vx:Math.cos(a)*600, vy:Math.sin(a)*600, r:5, dmg:d, pierce:4, life:Math.min(1.2, alcanceVis()/600), hit:new Set()});
      }
      break;
    }
    case 'piromante':
      explode(P.x, P.y, 230*P.area, 45 + L*5, 'fogo', {kb:320});
      anim('fogo', P.x, P.y, 420, {forte:true});
      break;
    case 'bruxa':
      for(const e of G.enemies) if(naTela(e)){ e.frozen = Math.max(e.frozen, (e.boss ? 1 : 2.5) * (J.zeroabsoluto ? 2 : 1)); e.slow = Math.max(e.slow, 4); }
      anim('brilho', 0, 0, 380, {segue:true, forte:true});
      break;
    case 'carrasco':{
      const rad = 290*P.area;
      query(P.x, P.y, rad+45, e=>{ if(Math.hypot(e.x-P.x,e.y-P.y) < rad+e.r) hit(e, 60 + L*6, 'sangue', {kb:420}); });
      G.fx.push({kind:'slash', x:P.x, y:P.y, r:rad, life:0.4, max:0.4, a0:0, evo:true});
      heal(P.maxHp*0.1);
      break;
    }
    case 'tempestade':
      for(let i=0;i<10;i++){ const k = i; G.queue.push({t:k*0.07, fn:()=>{ const t = randomEnemyNear(520); if(t) strike(t, 30 + L*4, 3); }}); }
      break;
    case 'alquimista':
      addZone(P.x, P.y, 170, 6, 12 + L*2, 'veneno');
      break;
    case 'errante':
      for(const g of G.pick) g.pull = 900;
      query(P.x, P.y, 345, e=>{
        const a = Math.atan2(e.y-P.y, e.x-P.x);
        if(!e.boss){ e.kx += Math.cos(a)*900; e.ky += Math.sin(a)*900; }
        hit(e, 15 + L*2, 'lamina', {});
      });
      G.fx.push({kind:'ring', x:P.x, y:P.y, r:300, life:0.45, max:0.45, cor:'#cfd6e0'});
      break;
    case 'astrologa':{
      const alvos = G.enemies.filter(naTela).sort((a,b)=>Math.hypot(a.x-P.x,a.y-P.y)-Math.hypot(b.x-P.x,b.y-P.y)).slice(0,8);
      alvos.forEach((e,i)=> G.queue.push({t:i*0.08, fn:()=>meteor(e.x, e.y, 70 + L*8, 75*P.area)}));
      break;
    }
  }
  G.skillCd = CLASSES[c].cd * (1 - Math.min(0.4, P.cdr*0.5)) * (1 - 0.1*(P.tree ? P.tree.mestre : 0));
  G.shake = Math.max(G.shake, 10);
  sfx.evo();
  gpVibrar(160, 0.6);
}
function renderSkillBtn(){
  const b = $('#btnSkill');
  if(!G || !CLASSES[G.char]){ b.hidden = true; return; }
  b.hidden = false;
  const max = (G.skillMax || CLASSES[G.char].cd) * (1 - 0.1*(P.tree ? P.tree.mestre : 0));
  const k = Math.max(0, Math.min(1, G.skillCd / max));
  b.style.setProperty('--cd', k.toFixed(3));
  b.classList.toggle('pronto', G.skillCd <= 0);
  if(b.dataset.cls !== G.char + LANG){
    b.dataset.cls = G.char + LANG;
    b.innerHTML = `${iconHtml(CLASSES[G.char].icon)}<span class="sk-nome">${clsTxt(G.char,2)}</span><kbd>F</kbd>`;
    b.title = clsTxt(G.char,3);
  }
}

/* ---------- controle (gamepad) ---------- */
// botões no padrão Xbox: 0 A, 1 B, 2 X, 3 Y, 4 LB, 5 RB, 6 LT, 7 RT, 8 Back, 9 Start, 12-15 direcional
const GP = {ativo:false, mx:0, my:0, prev:[], rep:0, idx:null};
function gpLista(){ try{ return navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean) : []; }catch(e){ return []; } }
addEventListener('gamepadconnected', ev=>{ GP.idx = ev.gamepad.index; toast(tr('gp_on')); });
addEventListener('gamepaddisconnected', ()=>{ GP.idx = null; GP.ativo = false; GP.mx = GP.my = 0; toast(tr('gp_off')); });
addEventListener('mousemove', ()=>{ if(GP.ativo){ GP.ativo = false; document.body.classList.remove('gp'); } });

function gpVibrar(ms, forca){
  try{
    const p = gpLista()[0];
    if(p && p.vibrationActuator && p.vibrationActuator.playEffect)
      p.vibrationActuator.playEffect('dual-rumble', {duration:ms, strongMagnitude:forca, weakMagnitude:forca*0.6});
  }catch(e){}
}
function gpTelaAtual(){
  for(const id of SCREENS){ const el = $('#'+id); if(!el.hidden) return el; }
  return null;
}
function gpFocaveis(tela){
  return Array.from(tela.querySelectorAll('button, input')).filter(el => !el.disabled && el.offsetParent !== null && !el.closest('[hidden]'));
}
function gpFocar(el){
  document.querySelectorAll('.gp-foco').forEach(x=>x.classList.remove('gp-foco'));
  if(!el) return;
  el.classList.add('gp-foco');
  try{ el.focus({preventScroll:true}); }catch(e){}
  el.scrollIntoView({block:'nearest', inline:'nearest'});
}
function gpNavegar(dx, dy){
  const tela = gpTelaAtual(); if(!tela) return;
  const lista = gpFocaveis(tela); if(!lista.length) return;
  let atual = document.activeElement;
  if(!lista.includes(atual)){
    gpFocar(lista.find(b=>b.classList.contains('primario')) || lista[0]);
    return;
  }
  if(atual.type === 'range' && dx){
    atual.value = Math.min(1, Math.max(0, +atual.value + dx*0.05));
    atual.dispatchEvent(new Event('input', {bubbles:true}));
    atual.dispatchEvent(new Event('change', {bubbles:true}));
    return;
  }
  const r0 = atual.getBoundingClientRect(), cx = r0.left + r0.width/2, cy = r0.top + r0.height/2;
  let melhor = null, melhorD = Infinity;
  for(const el of lista){
    if(el === atual) continue;
    const r = el.getBoundingClientRect(), ex = r.left + r.width/2, ey = r.top + r.height/2;
    const vx = ex - cx, vy = ey - cy;
    const along = vx*dx + vy*dy;
    if(along <= 4) continue;
    const across = Math.abs(vx*dy) + Math.abs(vy*dx);
    const d = along + across*2.2;
    if(d < melhorD){ melhorD = d; melhor = el; }
  }
  if(melhor){ gpFocar(melhor); tone(760,0.03,'sine',0.015,1,0); }
  else if(dy) tela.scrollBy({top: dy*240, behavior:'smooth'});
}
function gpVoltar(){
  if(!G && $('#menu').hidden === false) return;
  const tela = gpTelaAtual(); if(!tela) return;
  const id = tela.id;
  if(id==='pause'){ unpause(); return; }
  const mapa = {reli:'#reliVoltar', grim:'#grimVoltar', opts:'#optVoltar', loja:'#lojaVoltar', arsenal:'#arsVoltar', notas:'#notasVoltar', conta:'#contaVoltar'};
  if(mapa[id]) $(mapa[id]).click();
}
function pollGamepad(dt){
  const p = GP.idx !== null ? gpLista().find(g=>g.index===GP.idx) : gpLista()[0];
  if(!p){ GP.mx = GP.my = 0; return; }
  const b = p.buttons.map(x => x && (x.pressed || x.value > 0.5));
  const apertou = i => b[i] && !GP.prev[i];
  const M = gpMapa();
  const acao = nome => apertou(M[nome]);
  if(gpBind){
    const novo = b.some((v,i) => v && !GP.prev[i]);
    GP.prev = b;
    if(novo) gpCapturarBotao(b);
    return;
  }
  let ax = p.axes[0] || 0, ay = p.axes[1] || 0;
  if(b[14]) ax = -1; if(b[15]) ax = 1; if(b[12]) ay = -1; if(b[13]) ay = 1;
  const mag = Math.hypot(ax, ay);
  const rx = p.axes[2] || 0, ry = p.axes[3] || 0;
  const usando = mag > 0.25 || Math.hypot(rx, ry) > 0.3 || b.some(Boolean);
  if(usando && !GP.ativo){ GP.ativo = true; document.body.classList.add('gp'); if(G && G.tut) tutShow(); }
  const jogando = G && G.mode === 'play' && !adPlaying;
  if(jogando){
    if(mag > 0.2){ const k = Math.min(1, (mag-0.2)/0.75)/mag; GP.mx = ax*k; GP.my = ay*k; }
    else { GP.mx = GP.my = 0; }
    if(G.rapido){
      if(apertou(14)) escolherRapido(0);
      if(apertou(12)) escolherRapido(1);
      if(apertou(15)) escolherRapido(2);
    }
    if(acao('esquiva')) dash();
    if(acao('habilidade')) usarHabilidade();
    if(acao('taro1')) useTarot(0);
    if(acao('taro2')) useTarot(1);
    if(acao('pausa') || apertou(8)) pause();
  } else {
    GP.mx = GP.my = 0;
    const tela = gpTelaAtual();
    // analógico direito rola a tela
    if(tela && Math.abs(ry) > 0.2) tela.scrollBy(0, ry * 900 * dt);
    GP.rep -= dt;
    const dir = mag > 0.5 ? (Math.abs(ax) > Math.abs(ay) ? [Math.sign(ax),0] : [0,Math.sign(ay)]) : null;
    if(dir){
      if(GP.rep <= 0){ gpNavegar(dir[0], dir[1]); GP.rep = GP.navFirst ? 0.14 : 0.32; GP.navFirst = true; }
    } else { GP.rep = 0; GP.navFirst = false; }
    if(acao('abaAnt')) gpTrocarAba(-1);
    if(acao('abaProx')) gpTrocarAba(1);
    if(acao('confirmar')){
      const el = document.activeElement;
      if(tela && el && tela.contains(el) && (el.tagName === 'BUTTON' || el.tagName === 'INPUT')){ audioOn(); el.click(); }
      else gpNavegar(0, 1);
    }
    if(acao('voltar')) gpVoltar();
    if(acao('pausa') && G && G.mode === 'pause') unpause();
    if(acao('trocar') && G && G.mode === 'level') reroll();
  }
  GP.prev = b;
}
// ao abrir uma tela, já deixa um botão selecionado para quem joga no controle
function gpAoMostrarTela(){
  if(!GP.ativo) return;
  setTimeout(()=>{
    const tela = gpTelaAtual(); if(!tela) return;
    const lista = gpFocaveis(tela);
    const alvo = tela.querySelector('.card:not([disabled])') || lista.find(b=>b.classList.contains('primario')) || lista[0];
    if(alvo) gpFocar(alvo);
  }, 60);
}

/* ---------- aplicativo: instalação pelo navegador (PWA) e versão de computador ---------- */
const DESKTOP = !!(window.sinaDesktop);
let promptInstalar = null;
addEventListener('beforeinstallprompt', ev=>{ ev.preventDefault(); promptInstalar = ev; atualizarBotoesApp(); });
addEventListener('appinstalled', ()=>{ promptInstalar = null; atualizarBotoesApp(); });
function registrarSW(){
  if(DESKTOP || window.SINA_BUILD === 'portal') return;
  try{
    // ?limpar=1 remove instalações antigas que possam estar servindo uma versão velha
    if(new URLSearchParams(location.search).get('limpar') === '1'){
      if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
      if(window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
      toast('Cache limpo. Recarregue a página.');
      return;
    }
    const seguro = location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname);
    if(!('serviceWorker' in navigator) || !seguro || !document.querySelector('link[rel="manifest"]')) return;
    // usa caminho absoluto quando o site informa a pasta, para funcionar com ou sem a barra final
    const baseMeta = document.querySelector('meta[name="sina-base"]');
    const base = baseMeta ? baseMeta.content : './';
    navigator.serviceWorker.register(base + 'sw.js', {scope: base, updateViaCache:'none'})
      .then(reg => { try{ reg.update(); }catch(e){} })
      .catch(()=>{});
  }catch(e){}
}
const ehIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const jaInstalado = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
function atualizarBotoesApp(){
  // no iPhone o navegador nunca oferece a instalação sozinho: mostramos o passo a passo
  const podeIOS = ehIOS() && !jaInstalado() && !DESKTOP && location.protocol.startsWith('http');
  $('#btnInstalar').hidden = !(promptInstalar || podeIOS);
  $('#btnSair').hidden = !DESKTOP;
}
$('#btnInstalar').onclick = async ()=>{
  if(!promptInstalar){ toast(tr('install_ios')); return; }
  promptInstalar.prompt();
  try{ await promptInstalar.userChoice; }catch(e){}
  promptInstalar = null; atualizarBotoesApp();
};
$('#btnSair').onclick = ()=>{ try{ window.sinaDesktop.sair(); }catch(e){} };
function conquistaSteam(id){
  if(!DESKTOP || !window.sinaDesktop.conquista) return;
  try{ window.sinaDesktop.conquista('ACH_' + String(id).toUpperCase()); }catch(e){}
}
function alternarTelaCheia(){
  if(DESKTOP){ try{ window.sinaDesktop.telaCheia(!SAVE.opt.telaCheia); }catch(e){} SAVE.opt.telaCheia = !SAVE.opt.telaCheia; persist(); return; }
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }catch(e){}
}

function pxm(c){ return `<span class="pxm" style="--c:${c[0]};--r:${c[1]}"></span>`; }

function renderGrim(){
  document.querySelectorAll('#grim .abas button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.aba===abaGrim));
  let h = '';
  const verb = (cor, conteudo, oculto) => `<div class="verbete ${oculto?'oculto':''}" style="--c:${cor}">${conteudo}</div>`;
  switch(abaGrim){
    case 'missoes':{
      const feitas = MISSIONS.filter(m=>SAVE.missions[m.id]).length;
      h += `<p class="desc">${tr('miss_count', {a:feitas, b:MISSIONS.length})}</p>`;
      for(const m of MISSIONS){
        const ok = SAVE.missions[m.id];
        h += `<div class="missao ${ok?'feita':''}"><span class="ok">${ok?'✓':''}</span><span class="nome">${m.nome}</span><span class="rec">${tr('souls_plus', {n:m.r})}</span></div>`;
      }
      break;
    }
    case 'bestiario':{
      const ids = Object.keys(ETYPES);
      const vistos = ids.filter(id=>SAVE.seen['m:'+id]).length;
      h += `<p class="desc">${tr('best_intro', {a:vistos, b:ids.length})}</p><div class="grade">`;
      for(const id of ids){
        const T = ETYPES[id], v = SAVE.seen['m:'+id], chefe = T.from > 1e8;
        if(!v){ h += verb('#4a3d5e', `<div class="gl-topo">${pxm(ETYPE_ICON[id])}<div class="nome">???</div></div><div class="desc">${tr('unseen')}</div>`, true); continue; }
        h += verb(chefe ? '#c93b56' : '#7d9a6c', `<div class="gl-topo">${pxm(ETYPE_ICON[id])}<div><div class="nome">${T.nome}</div>
          <div class="desc">${chefe ? tr('boss_label') : tr('appears_at', {t:fmtTime(T.from)})}</div></div></div>
          <div class="desc">${loc(BEST_TXT[id])}</div>
          <div class="gl-stats"><span>${tr('st_hp')} ${T.hp}</span><span>${tr('st_spd')} ${T.spd}</span><span>${tr('st_dmg')} ${T.dmg}</span></div>
          <div class="desc">${tr('killed', {n:fmtN((SAVE.abates||{})[id]||0)})}</div>`);
      }
      h += '</div>';
      break;
    }
    case 'armas':{
      h += '<div class="grade">';
      for(const id in WEAPONS){
        const W_ = WEAPONS[id], T = TAGS[W_.tag], vista = SAVE.seen['w:'+id], evo = SAVE.seen['e:'+id];
        if(!vista){ h += verb(T.cor, `<div class="gl-topo">${iconHtml(ICON_W[id], 'apagado')}<div class="nome">???</div></div><div class="desc">${tr('not_found')}</div>`, true); continue; }
        const a = wstat(id,1,false), b = wstat(id,WMAX,false);
        const linhas = [];
        if(a.dmg !== undefined) linhas.push(`${tr('st_dmg')} ${Math.round(a.dmg)} → ${Math.round(b.dmg)}`);
        if(a.cd !== undefined) linhas.push(`${tr('st_cd')} ${dec(a.cd,2)} s → ${dec(b.cd,2)} s`);
        if(a.n !== undefined) linhas.push(`${tr('st_n')} ${a.n} → ${b.n}`);
        h += verb(T.cor, `<div class="gl-topo">${iconHtml(ICON_W[id])}<div><div class="nome">${W_.nome}</div><div class="desc" style="color:${T.cor}">${T.ico} ${T.nome}</div></div></div>
          <div class="desc">${W_.desc}</div>
          <div class="gl-stats"><b>${tr('lvl_range', {l:WMAX})}</b>${linhas.map(x=>`<span>${x}</span>`).join('')}</div>
          <div class="evo">${evo ? tr('evo_recipe', {e:W_.evo.nome, l:WMAX, j:JOKERS[W_.evo.joker].nome}) : tr('evo_unknown')}</div>`);
      }
      h += `</div><p class="desc" style="margin-top:.8rem">${tr('grim_tip')}</p>`;
      break;
    }
    case 'coringas':{
      const ids = Object.keys(JOKERS);
      const vistos = ids.filter(id=>SAVE.seen['j:'+id]).length;
      const livres = ids.filter(cartaLiberada).length;
      h += `<p class="desc">${tr('jokers_found', {a:vistos, b:ids.length})} · ${tr('cartas_desc', {a:livres, b:ids.length})}</p>
        <div class="acoes" style="margin:.2rem 0 .6rem">${livres < ids.length
          ? `<button class="btn peq" id="descobrirCarta" ${SAVE.almas<CARTA_PRECO?'disabled':''}>${tr('carta_comprar', {p:CARTA_PRECO})}</button>`
          : `<span class="desc">${tr('cartas_todas')}</span>`}</div><div class="grade">`;
      for(const id of ids){
        const j = JOKERS[id], v = SAVE.seen['j:'+id], T = j.tag ? TAGS[j.tag] : null;
        const cor = ['#b3a78f','#5fa8e8','#b46be0','#f2b544'][j.rar];
        if(!v){ h += verb(cor, `<div class="gl-topo">${iconHtml(jokerIcon(id), 'apagado')}<div><div class="nome">???</div><div class="desc">${RAR[j.rar].n}</div></div></div>`, true); continue; }
        const extra = [RAR[j.rar].n];
        if(!cartaLiberada(id)) extra.push(`<b style="color:#c93b56">${tr('carta_trancada')}</b>`);
        if(T) extra.push(`<span style="color:${T.cor}">${T.ico} ${T.nome}</span>`);
        if(j.classe) extra.push(`${tr('class_card')}: ${CHARS[j.classe].nome}`);
        h += verb(cor, `<div class="gl-topo">${iconHtml(jokerIcon(id))}<div><div class="nome">${j.nome}</div><div class="desc">${extra.join(' · ')}</div></div></div><div class="desc">${j.d}</div>`);
      }
      h += '</div>';
      break;
    }
    case 'elementos':{
      h += `<p class="desc">${tr('elem_intro')}</p><div class="grade">`;
      for(const tg in TAGS){
        const T = TAGS[tg];
        const armas = Object.keys(WEAPONS).filter(id=>WEAPONS[id].tag===tg);
        const cartas = Object.keys(JOKERS).filter(id=>JOKERS[id].tag===tg);
        const vistas = cartas.filter(id=>SAVE.seen['j:'+id]).length;
        const b1 = tg==='sorte' ? tr('syn_luck1') : tr('syn_dmg1');
        const b2 = tg==='sorte' ? tr('syn_luck2') : tr('syn_dmg2');
        h += verb(T.cor, `<div class="gl-topo"><span class="gl-ico" style="color:${T.cor}">${T.ico}</span><div class="nome">${T.nome}</div></div>
          <div class="desc">${tr('weapons_of')}: ${armas.length ? armas.map(id=>SAVE.seen['w:'+id] ? WEAPONS[id].nome : '???').join(', ') : '—'}</div>
          <div class="desc">${tr('jokers_of', {a:vistas, b:cartas.length})}</div>
          <div class="gl-stats"><span>${tr('syn_l1')}: <b>${b1}</b></span><span>${tr('syn_l2')}: <b>${b2}</b></span></div>`);
      }
      h += '</div>';
      break;
    }
    case 'efeitos':{
      h += '<div class="grade">';
      for(const ef of EFEITOS){
        const [nome, d] = loc(ef.t);
        h += verb(ef.cor, `<div class="gl-topo">${iconHtml(ef.icon)}<div class="nome">${nome}</div></div><div class="desc">${d}</div>`);
      }
      h += '</div>';
      break;
    }
    case 'classes':{
      h += '<div class="grade">';
      for(const id in CHARS){
        const c = CHARS[id], tem = SAVE.chars[id], cc = SPR_CHAR[id];
        h += verb(tem ? '#f2b544' : '#4a3d5e', `<div class="gl-topo"><span class="pxr" style="--c:${cc[0]};--r:${cc[1]}"></span><div><div class="nome">${c.nome}</div><div class="desc">${tem ? c.desc : tr('locked')}</div></div></div>
          <div class="desc cls"><b>${tr('class_passive')}: ${clsTxt(id,0)}.</b> ${clsTxt(id,1)}</div>
          <div class="desc cls"><b>${tr('class_active')}: ${clsTxt(id,2)}.</b> ${clsTxt(id,3)}</div>`, !tem);
      }
      h += '</div>';
      break;
    }
    case 'taros':{
      h += '<div class="grade">';
      for(const id in TAROTS){
        const t = TAROTS[id], v = SAVE.seen['t:'+id];
        h += verb('#9a6ac0', `<div class="gl-topo">${iconHtml(ICON_TAROT, v?'':'apagado')}<div class="nome">${v ? t.ico+' '+t.nome : '???'}</div></div><div class="desc">${v ? t.d : tr('unseen')}</div>`, !v);
      }
      h += '</div>';
      break;
    }
    case 'diario':
      h += diarioHtml();
      break;
    case 'guia':
      h += guiaHtml();
      break;
    case 'reforcos': case 'equip':
      h += grimExtra(abaGrim);
      break;
    default:{
      if(!SAVE.runs.length) h += `<p class="desc">${tr('no_runs')}</p>`;
      else {
        h += `<div class="tabela-wrap"><table class="rank"><thead><tr><th>#</th><th>${tr('th_time')}</th><th>${tr('th_kills')}</th><th>${tr('th_lvl')}</th><th>${tr('th_char')}</th><th>${tr('th_curse')}</th><th></th></tr></thead><tbody>`;
        SAVE.runs.forEach((r,i)=>{
          h += `<tr><td>${i+1}</td><td>${fmtTime(r.t)}</td><td>${fmtN(r.k)}</td><td>${r.l}</td><td>${CHARS[r.c]?CHARS[r.c].nome:'?'}</td><td>${r.m||'-'}</td><td>${r.w?tr('victory'):''}</td></tr>`;
        });
        h += '</tbody></table></div>';
      }
    }
  }
  $('#grimConteudo').innerHTML = h;
}

const pick = arr => arr[(Math.random()*arr.length)|0];
function rolarAfixo(k, rar){
  const a = AFX[k];
  return {k, v: Math.max(1, Math.round(rnd(a.min, a.max) * RAR_MULT[rar]))};
}
function gerarItem(rar, tipo){
  tipo = tipo || pick(EQ_TIPOS);
  const n = [1,2,3,3,4][rar];
  const principal = PRINCIPAL[tipo] || ('e_' + pick(ELEM_TAGS));
  const afx = [rolarAfixo(principal, rar)];
  const pool = Object.keys(AFX).filter(k => k !== principal && !(k.startsWith('e_') && principal.startsWith('e_')));
  while(afx.length < n){
    const k = pick(pool);
    if(afx.some(a => a.k === k || (a.k.startsWith('e_') && k.startsWith('e_')))) continue;
    afx.push(rolarAfixo(k, rar));
  }
  const it = {uid: Date.now().toString(36) + Math.random().toString(36).slice(2,7), tipo, rar, afx, ico: pick(EQ_ICONES[tipo])};
  if(rar >= 3){
    const unicos = Object.keys(UNICOS).filter(u => UNICOS[u].tipo === tipo);
    it.unico = pick(unicos);
    it.ico = UNICOS[it.unico].ico;
  }
  return it;
}
function rolarRaridadeItem(min){
  const bonus = (G ? G.round*2 : 0) + (P ? effLuck()*0.3 : 0);
  const w = [60, 28 + bonus*0.6, 9 + bonus*0.3, 2.5 + bonus*0.12];
  for(let i=0;i<min;i++) w[i] = 0;
  let r = Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<4;i++){ r -= w[i]; if(r<=0) return i; }
  return 3;
}
const rarNome = r => r === 4 ? tr('rar4') : RAR[r].n;
function nomeItem(it){ return it.unico ? loc(UNICO_TXT[it.unico])[0] : tr('eq_' + it.tipo); }
function textoAfixo(a){
  const v = a.k === 'regen' ? dec(a.v/10, 1) : a.v;
  if(a.k.startsWith('e_')){
    const T = TAGS[AFX[a.k].tag];
    return tr('a_elem', {v, t: (LANG==='pt'||LANG==='es') ? T.nome.toLowerCase() : T.nome});
  }
  return tr('a_' + a.k, {v});
}
function itemPorUid(uid){ return SAVE.bau.find(i => i.uid === uid); }
function equipados(){ return EQ_SLOTS.map(sl => SAVE.equip[sl] && itemPorUid(SAVE.equip[sl])).filter(Boolean); }
function slotDoItem(uid){ return EQ_SLOTS.find(sl => SAVE.equip[sl] === uid); }

/* aplica os equipamentos no personagem no início da partida */
function aplicarEquipamento(p){
  p.elem = {}; p.setc = {}; p.uniq = new Set();
  for(const it of equipados()){
    const elems = new Set();
    for(const a of it.afx){
      const v = a.v;
      switch(a.k){
        case 'dano': p.dmg += v/100; break;
        case 'vida': p.maxHp += v; break;
        case 'armad': p.armor += v; break;
        case 'crit': p.crit += v/100; break;
        case 'recarga': p.cdr = Math.min(0.6, p.cdr + v/100); break;
        case 'area': p.area += v/100; break;
        case 'veloc': p.speed *= 1 + v/100; break;
        case 'ima': p.magnet *= 1 + v/100; break;
        case 'sorte': p.luck += v; break;
        case 'xp': p.xpMult += v/100; break;
        case 'regen': p.regen += v/10; break;
        case 'almas': p.soulMult += v/100; break;
        default:
          if(a.k.startsWith('e_')){ const tg = AFX[a.k].tag; p.elem[tg] = (p.elem[tg]||0) + v/100; elems.add(tg); }
      }
    }
    for(const tg of elems) p.setc[tg] = (p.setc[tg]||0) + 1;
    if(it.unico) p.uniq.add(it.unico);
  }
  for(const tg in p.setc) if(p.setc[tg] >= 2) p.elem[tg] = (p.elem[tg]||0) + 0.15;
}

/* itens durante a partida */
function soltarItem(x, y, min){
  const it = gerarItem(rolarRaridadeItem(min||0));
  G.pick.push({kind:'item', x, y, it});
}
function coletarItem(it){
  G.loot.push(it);
  if(it.unico) SAVE.seen['u:'+it.unico] = true;
  toast(`<span style="color:${RAR_COR[it.rar]}">${tr('loot_new', {n:nomeItem(it)})}</span>`);
  tone(880, 0.25, 'triangle', 0.05, 1.5, 0.4);
  if(it.rar >= 2) anim('brilho', 0, 0, 90, {segue:true, forte:true});
}
function guardarLoot(){
  if(!G || !G.loot || !G.loot.length) return [];
  const novos = G.loot.splice(0);
  SAVE.bau.push(...novos);
  let vendidos = 0, almas = 0;
  while(SAVE.bau.length > BAU_MAX){
    const idx = SAVE.bau.findIndex(i => !i.lock && !slotDoItem(i.uid));
    if(idx < 0) break;
    const [it] = SAVE.bau.splice(idx, 1);
    vendidos++; almas += VENDA[it.rar];
  }
  if(vendidos){ SAVE.almas += almas; toast(tr('bau_full', {n:vendidos, a:almas})); }
  persist();
  return novos;
}
function drawItemPickup(g, t){
  const cor = RAR_COR[g.it.rar];
  glow(g.x, g.y, 22 + g.it.rar*4, 0.25 + g.it.rar*0.06, cor);
  if(g.it.rar >= 2){
    ctx.strokeStyle = cor; ctx.globalAlpha = 0.5 + 0.3*Math.sin(t*6); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(g.x, g.y-10); ctx.lineTo(g.x, g.y-60); ctx.stroke(); ctx.globalAlpha = 1;
  }
  const ic = g.it.unico ? UNICOS[g.it.unico].ico : g.it.ico;
  spr('items', ic[0], ic[1], g.x, g.y + Math.sin(t*4)*2, 34);
}

  if(!sets.length) h += `<span class="desc">${tr('eq_no_sets')}</span>`;
  for(const tg of sets){
    const T = TAGS[tg], nm = (LANG==='pt'||LANG==='es') ? T.nome.toLowerCase() : T.nome;
    h += `<span class="syn" style="--c:${T.cor}">${T.ico} ${tr('set_2', {t:nm})}</span>`;
    if(p.setc[tg] >= 4) h += `<span class="syn" style="--c:${T.cor}">${T.ico} ${tr('set_4', {t:nm})}</span>`;
  }
  h += '</div>';
  // detalhes
  h += `<div class="eq-det">${renderDetalhe()}</div>`;
  // síntese
  if(ARS.sintese){
    const esc = ARS.escolhidos.map(itemPorUid).filter(Boolean);
    const rar = esc.length ? esc[0].rar : null;
    const custo = rar !== null && rar < 4 ? SINTESE_CUSTO[rar] : 0;
    const pode = esc.length === 3 && S.almas >= custo;
    h += `<div class="eq-sint"><h3>${tr('eq_synth_title')}</h3><p class="desc">${tr('eq_synth_desc')}</p>
      <p>${tr('eq_synth_pick', {a:esc.length})}</p>
      <div class="acoes"><button class="btn peq primario" id="sintFazer" ${pode?'':'disabled'}>${tr('eq_synth_btn', {n:custo})}</button>
      <button class="btn peq" id="sintCancelar">${tr('eq_cancel')}</button></div></div>`;
  }
  // baú
  const filtros = ['todos', ...EQ_TIPOS];
  h += `<h3>${tr('eq_bau', {a:S.bau.length, b:BAU_MAX})}</h3>
    <div class="abas eq-filtros">${filtros.map(f=>`<button data-filtro="${f}" aria-pressed="${ARS.filtro===f}">${f==='todos'?tr('eq_all'):tr('eq_'+f)}</button>`).join('')}</div>`;
  const lista = S.bau.filter(it => ARS.filtro==='todos' || it.tipo===ARS.filtro).sort((a,b)=>b.rar-a.rar || a.tipo.localeCompare(b.tipo));
  if(!S.bau.length) h += `<p class="desc">${tr('eq_bau_empty')}</p>`;
  h += '<div class="eq-grade">';
  for(const it of lista){
    const eq = slotDoItem(it.uid), esc = ARS.escolhidos.includes(it.uid);
    const bloqueado = ARS.sintese && (eq || it.lock || it.rar >= 4);
    h += `<button class="eq-item ${ARS.sel===it.uid?'ativo':''} ${esc?'escolhido':''}" data-uid="${it.uid}" ${bloqueado?'disabled':''} title="${nomeItem(it)}">
      ${iconeItem(it)}${eq?'<span class="eq-marca">E</span>':''}${it.lock?'<span class="eq-marca cadeado">🔒</span>':''}</button>`;
  }
  h += '</div>';
  $('#arsConteudo').innerHTML = h;
}
function blocoItem(it, titulo){
  let h = `<div class="eq-bloco" style="--rc:${RAR_COR[it.rar]}">${titulo ? `<div class="desc">${titulo}</div>` : ''}
    <div class="gl-topo">${iconeItem(it)}<div><div class="nome">${nomeItem(it)}</div><div class="rar-lbl">${rarNome(it.rar)} · ${tr('eq_'+it.tipo)}</div></div></div><ul>`;
  for(const a of it.afx) h += `<li>${textoAfixo(a)}</li>`;
  h += '</ul>';
  if(it.unico) h += `<p class="eq-unico"><b>${tr('eq_unique')}:</b> ${loc(UNICO_TXT[it.unico])[1]}</p>`;
  return h + '</div>';
}
function renderDetalhe(){
  const it = ARS.sel && itemPorUid(ARS.sel);
  if(!it) return `<p class="desc">${tr('eq_pick_hint')}</p>`;
  const sl = slotDoItem(it.uid);
  let h = '<div class="eq-comp">' + blocoItem(it);
  if(!sl){
    const alvo = it.tipo === 'anel' ? (SAVE.equip.anel1 && itemPorUid(SAVE.equip.anel1)) : (SAVE.equip[it.tipo] && itemPorUid(SAVE.equip[it.tipo]));
    if(alvo) h += blocoItem(alvo, tr('eq_now'));
  }
  h += '</div><div class="acoes">';
  h += sl ? `<button class="btn peq" id="eqTirar">${tr('eq_remove')}</button>` : `<button class="btn peq primario" id="eqPor">${tr('eq_equip')}</button>`;
  h += `<button class="btn peq" id="eqTrancar">${tr(it.lock ? 'eq_unlock' : 'eq_lock')}</button>`;
  h += `<button class="btn peq perigo" id="eqVender" ${it.lock||sl?'disabled':''}>${tr('eq_sell', {n:VENDA[it.rar]})}</button>`;
  if(!ARS.sintese) h += `<button class="btn peq" id="sintAbrir">${tr('eq_synth_open')}</button>`;
  return h + '</div>';
}
function equipar(it){
  if(it.tipo === 'anel'){
    const sl = !SAVE.equip.anel1 ? 'anel1' : !SAVE.equip.anel2 ? 'anel2' : 'anel1';
    SAVE.equip[sl] = it.uid;
  } else SAVE.equip[it.tipo] = it.uid;
}
function sintetizar(){
  const esc = ARS.escolhidos.map(itemPorUid).filter(Boolean);
  if(esc.length !== 3) return;
  const rar = esc[0].rar;
  if(rar >= 4 || esc.some(i => i.rar !== rar) || SAVE.almas < SINTESE_CUSTO[rar]) return;
  SAVE.almas -= SINTESE_CUSTO[rar];
  SAVE.bau = SAVE.bau.filter(i => !ARS.escolhidos.includes(i.uid));
  const novo = gerarItem(rar + 1, esc[0].tipo);
  SAVE.bau.push(novo);
  if(novo.unico) SAVE.seen['u:'+novo.unico] = true;
  ARS.escolhidos = []; ARS.sintese = false; ARS.sel = novo.uid;
  persist();
  toast(`<span style="color:${RAR_COR[novo.rar]}">${tr('eq_synth_ok', {n:nomeItem(novo)})}</span>`);
  sfx.evo();
}
$('#arsenal').addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b || b.disabled) return;
  const d = b.dataset;
  if(b.id === 'arsVoltar'){ ARS.sintese = false; ARS.escolhidos = []; goMenu(); return; }
  if(d.arsaba){ ARS.aba = d.arsaba; renderArsenal(); tip(d.arsaba === 'arvore' ? 'arvore' : 'arsenal'); return; }
  if(d.no){
    const n = arvNo(d.no);
    if(!n || rank(n.id) >= n.max || !noLiberado(n)) return;
    const custo = custoNo(n);
    if(SAVE.almas < custo) return;
    SAVE.almas -= custo;
    SAVE.arvore[n.id] = rank(n.id) + 1;
    audioOn(); n.final ? sfx.evo() : sfx.level();
    persist(); renderArsenal(); return;
  }
  if(b.id === 'arvReset'){
    if(SAVE.almas < TREE_RESET_CUSTO) return;
    const gasto = gastoTotalArvore();
    SAVE.almas += gasto - TREE_RESET_CUSTO;
    SAVE.arvore = {};
    toast(tr('tree_reset_ok', {n:gasto}));
    persist(); renderArsenal(); return;
  }
  if(d.filtro){ ARS.filtro = d.filtro; }
  else if(d.uid && (b.classList.contains('eq-item') || b.classList.contains('eq-slot'))){
    if(ARS.sintese && b.classList.contains('eq-item')){
      const it = itemPorUid(d.uid);
      const i = ARS.escolhidos.indexOf(d.uid);
      if(i >= 0) ARS.escolhidos.splice(i, 1);
      else {
        const primeiro = ARS.escolhidos.length && itemPorUid(ARS.escolhidos[0]);
        if(primeiro && primeiro.rar !== it.rar) ARS.escolhidos = [];
        if(ARS.escolhidos.length < 3) ARS.escolhidos.push(d.uid);
      }
    }
    ARS.sel = d.uid;
  }
  else if(d.slot){ ARS.sel = null; ARS.filtro = slotTipo(d.slot); }
  else if(b.id === 'eqPor'){ const it = itemPorUid(ARS.sel); if(it){ equipar(it); sfx.card(); } }
  else if(b.id === 'eqTirar'){ const sl = slotDoItem(ARS.sel); if(sl) delete SAVE.equip[sl]; }
  else if(b.id === 'eqTrancar'){ const it = itemPorUid(ARS.sel); if(it) it.lock = !it.lock; }
  else if(b.id === 'eqVender'){
    const it = itemPorUid(ARS.sel);
    if(it && !it.lock && !slotDoItem(it.uid)){ SAVE.bau = SAVE.bau.filter(i => i !== it); SAVE.almas += VENDA[it.rar]; ARS.sel = null; sfx.coin(); }
  }
  else if(b.id === 'sintAbrir'){ ARS.sintese = true; ARS.escolhidos = []; }
  else if(b.id === 'sintCancelar'){ ARS.sintese = false; ARS.escolhidos = []; }
  else if(b.id === 'sintFazer'){ sintetizar(); }
  else return;
  persist();
  renderArsenal();
});
$('#btnArsenal').onclick = ()=>{ audioOn(); ARS.sel = null; renderArsenal(); showOnly('arsenal'); tip(ARS.aba === 'arvore' ? 'arvore' : 'arsenal'); };

function iniciarPrologo(){
  audioOn();

  G.jokers = ['dado','pira','condutor','inverno','espelho'];
  J = {dado:true, pira:true, condutor:true, inverno:true, espelho:true};
  recalcSyn();
  G.roundEnd = 1e9; G.nextEvent = 1e9; G.nextAltar = 1e9; G.nextHorde = 18; G.skillCd = 0;
  G.coins = 99;

function prologoUpdate(dt){
  if(!G || !G.prologo || G.mode === 'prologo') return;
  P.hp = Math.max(P.hp, P.maxHp*0.5);
  const T = G.tut;
  if(T && !T.done && T.step === 2 && !G.prolCarta && G.mode === 'play'){ G.prolCarta = true; G.pending = 1; }
  const tutFeito = !T || T.done;
  if(!G.prolCeifador && G.mode === 'play' && ((tutFeito && G.time > 75) || G.time > 150)){
    G.prolCeifador = true;
    const a = Math.random()*Math.PI*2;
    const e = spawnEnemy('ceifador', {boss:true, x:P.x + Math.cos(a)*460, y:P.y + Math.sin(a)*300});
    e.invul = true; e.spd = 150; e.prolog = true; e.atk = 1e9;
    banner(tr('prol_reaper')); sfx.boss(); G.shake = 24; gpVibrar(600, 1);
  }
  if(G.prolCeifador && G.mode === 'play'){
    const c = G.enemies.find(e => e.prolog);
    if(c){
      c.frozen = 0; c.slow = 0; c.kx = c.ky = 0;
      if(Math.hypot(c.x-P.x, c.y-P.y) < c.r + P.r + 6) fimPrologo();
    }
  }
}
function fimPrologo(){
  if(!G || G.mode === 'prologo') return;
  G.mode = 'prologo';
  anim('morte', 0, 0, 260, {segue:true, forte:true});
  G.shake = 30; P.hurt = 1;
  sfx.boss(); tone(90, 1.6, 'sawtooth', 0.08, 0.3, 0.6);
  if(G.tut && !G.tut.done){ G.tut.done = true; tutShow(); }
  setTimeout(()=>{ showOnly('prologo'); }, 1400);
}
function concluirPrologo(){
  const opt = SAVE.opt, tips = SAVE.tips;
  if(prologoSnap){
    const snap = JSON.parse(prologoSnap);
    for(const k of Object.keys(SAVE)) delete SAVE[k];
    Object.assign(SAVE, snap);
  }
  SAVE.opt = opt; SAVE.tips = tips;
  SAVE.opt.prologoFeito = true;
  SAVE.opt.tutorialDone = true;
  persist();
  prologoSnap = null;
  G = null;
  goMenu();
}

const TREE_RESET_CUSTO = 100;
const arvNo = id => ARVORE.find(n => n.id === id);
const rank = id => (SAVE.arvore && SAVE.arvore[id]) || 0;
function custoNo(n){ return n.base * (rank(n.id) + 1); }
function noLiberado(n){
  const doRamo = ARVORE.filter(x => x.ramo === n.ramo);
  const i = doRamo.indexOf(n);
  if(i === 0) return true;
  if(n.final) return rank(doRamo[3].id) > 0;
  return rank(doRamo[i-1].id) > 0;
}
function gastoTotalArvore(){
  let t = 0;
  for(const n of ARVORE) for(let r=0; r<rank(n.id); r++) t += n.base * (r+1);
  return t;
}
function migrarBencaos(){
  if(SAVE.metaMigrada) return;
  let devolver = 0;
  for(const m of META){ const l = SAVE.up[m.id] || 0; for(let i=0;i<l;i++) devolver += m.custo(i); }
  SAVE.metaMigrada = true;
  SAVE.up = {};
  if(devolver > 0){ SAVE.almas += devolver; SAVE.avisoMigracao = devolver; }
  persist();
}
function efeitoNo(p, id){
  switch(id){
    case 'o_forca': p.dmg += 0.04; break;
    case 'o_olho': p.crit += 0.02; break;
    case 'o_golpe': p.critMult += 0.15; break;
    case 'o_pressa': p.cdr = Math.min(0.6, p.cdr + 0.03); break;
    case 'o_multi': p.extraN += 1; break;
    case 'd_vigor': p.maxHp += 10; break;
    case 'd_couraca': p.armor += 1; break;
    case 'd_regen': p.regen += 0.2; break;
    case 'd_fenix': p.revives += 1; break;
    case 'f_ganancia': p.soulMult += 0.10; break;
    case 'f_sorte': p.luck += 8; break;
    case 'f_cobica': p.startCoins += 10; break;
    case 'f_baralho': p.freeRerolls += 1; break;
    case 'f_carta': p.extraCards += 1; break;
    case 'a_sabedoria': p.xpMult += 0.06; break;
    case 'a_ima': p.magnet *= 1.15; break;
    case 'a_pressa': p.speed *= 1.04; break;
  }
}
function flagsArvore(p){
  p.tree = {furia: rank('o_furia')>0, suspiro: rank('d_suspiro')>0, cacador: rank('f_cacador')>0, tarologo: rank('a_tarologo')>0,
            sentido: rank('a_sentido')>0, esquiva: rank('d_esquiva'), mestre: rank('a_mestre')};
}
function aplicarArvore(p){
  for(const n of ARVORE) for(let i=0;i<rank(n.id);i++) efeitoNo(p, n.id);
  flagsArvore(p);
}
// compra feita durante a partida: vale na hora
function aplicarNoNaPartida(id){
  if(!G || !P) return;
  efeitoNo(P, id);
  if(id === 'd_vigor') P.hp += 10;
  if(id === 'f_cobica') G.coins += 10;
  flagsArvore(P);
  G.dirty = true;
}
function arvoreHtml(naPartida){
  let h = `<p class="desc">${tr('tree_desc')}</p><div class="arvore">`;
  for(const rid in RAMOS){
    const R = RAMOS[rid];
    h += `<div class="ramo" style="--rc:${R.cor}"><div class="ramo-topo">${iconHtml(R.ico)}<b>${loc(R.nome)}</b></div>`;
    for(const n of ARVORE.filter(x => x.ramo === rid)){
      const rk = rank(n.id), lib = noLiberado(n), max = rk >= n.max, custo = custoNo(n);
      const [nome, d] = loc(ARV_TXT[n.id]);
      let pips = ''; for(let i=0;i<n.max;i++) pips += `<span class="pip ${i<rk?'on':''}"></span>`;
      const btn = max ? `<button class="btn peq" disabled>${tr('tree_max')}</button>`
        : !lib ? `<button class="btn peq" disabled>${tr('tree_locked')}</button>`
        : `<button class="btn peq ${n.final?'primario':''}" data-no="${n.id}" ${SAVE.almas<custo?'disabled':''}>${tr('tree_buy', {p:custo})}</button>`;
      h += `<div class="no ${n.final?'final':''} ${rk>0?'aprendido':''} ${lib?'':'trancado'}">
        <div class="gl-topo">${iconHtml(n.ico, lib?'':'apagado')}<div><div class="nome">${nome}</div><div class="desc">${d}</div><div class="pips">${pips}</div></div></div>${btn}</div>`;
    }
    h += '</div>';
  }
  h += '</div>';
  const gasto = gastoTotalArvore();
  if(gasto > 0 && !naPartida) h += `<div class="acoes" style="margin-top:.8rem"><button class="btn peq perigo" id="arvReset" ${SAVE.almas<TREE_RESET_CUSTO?'disabled':''}>${tr('tree_reset', {p:TREE_RESET_CUSTO})}</button></div>`;
  return h;
}

function atualizarReliquias(dt){
  if(G.prologo) return;
  G.nextReliq -= dt;
  if(G.nextReliq <= 0){
    G.nextReliq = rnd(32, 48);
    if(G.reliq.length < 3){
      const a = Math.random()*Math.PI*2, d = rnd(420, 950);
      const tipos = Object.keys(RELIQ);
      G.reliq.push({tipo: pick(tipos), x: P.x + Math.cos(a)*d, y: P.y + Math.sin(a)*d, t: 0});
    }
  }
  for(const r of G.reliq){
    r.t += dt;
    if(Math.hypot(P.x - r.x, P.y - r.y) < P.r + 22){ r.pego = true; pegarReliquia(r); }
  }
  G.reliq = G.reliq.filter(r => !r.pego && r.t < 110 && Math.hypot(P.x - r.x, P.y - r.y) < 2600);
  for(const k in G.buffs){ G.buffs[k] -= dt; if(G.buffs[k] <= 0){ delete G.buffs[k]; G.dirty = true; } }
  if(G.buffs.estandarte) heal(3*dt);
}
function pegarReliquia(r){
  const R = RELIQ[r.tipo];
  SAVE.seen['r:' + r.tipo] = true;
  tip('reliq');
  switch(r.tipo){
    case 'furia': case 'estandarte': case 'ampulheta': G.buffs[r.tipo] = R.dur; G.dirty = true; break;
    case 'poco': G.almasBonus += 40; break;
    case 'ima': for(const g of G.pick) if(g.kind==='xp') g.pull = 700; break;
    case 'bau': soltarItem(r.x, r.y, 1); for(let i=0;i<6;i++) G.pick.push({kind:'coin', x:r.x+rnd(-30,30), y:r.y+rnd(-30,30)}); break;
    case 'tomo': G.lvl++; G.pending++; break;
  }
  banner(loc(RELIQ_TXT[r.tipo])[0]);
  anim('brilho', r.x, r.y, 140, {forte:true});
  G.fx.push({kind:'ring', x:r.x, y:r.y, r:120, life:0.5, max:0.5, cor:R.cor});
  sfx.altar();
}
function drawReliquias(t, inView){
  for(const r of G.reliq){
    if(!inView(r.x, r.y, 60)) continue;
    const R = RELIQ[r.tipo];
    const puls = 0.5 + 0.5*Math.sin(t*3 + r.x);
    glow(r.x, r.y, 40 + puls*10, 0.18 + puls*0.1, R.cor);
    ctx.globalAlpha = 0.35 + puls*0.3;
    ctx.strokeStyle = R.cor; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(r.x, r.y + 14, 22, 7, 0, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
    for(let i=0;i<3;i++){
      const a = t*2 + i*2.1 + r.x*0.01;
      ctx.fillStyle = R.cor; ctx.globalAlpha = 0.7;
      ctx.fillRect(r.x + Math.cos(a)*22, r.y - 10 + Math.sin(a*1.3)*14, 2.5, 2.5);
    }
    ctx.globalAlpha = 1;
    ctx.imageSmoothingEnabled = false;
    spr(R.sheet, R.ico[0], R.ico[1], r.x, r.y - 4 + Math.sin(t*2.5 + r.y)*3, 40);
  }
}
function buffMarcas(){
  let mk = '';
  for(const k in G.buffs){
    mk += `<span class="marca buff" style="--c:${RELIQ[k].cor}">${loc(RELIQ_TXT[k])[0]} ${Math.ceil(G.buffs[k])}s</span>`;
  }
  if(G.mapaRevelado) mk += `<span class="marca buff" style="--c:#f2b544">${tr('map_on')}</span>`;
  return mk;
}

/* ---------- abas novas do Grimório ---------- */
function grimExtra(aba){
  let h = '';
  const verb = (cor, conteudo, oculto) => `<div class="verbete ${oculto?'oculto':''}" style="--c:${cor}">${conteudo}</div>`;
  if(aba === 'reforcos'){
    h += `<p class="desc">${tr('rel_intro')}</p><div class="grade">`;
    for(const k in RELIQ){
      const R = RELIQ[k], v = SAVE.seen['r:'+k], [nome, d] = loc(RELIQ_TXT[k]);
      const ic = R.sheet === 'items' ? iconHtml(R.ico, v?'':'apagado') : `<span class="gl-ico" style="color:${R.cor}">◆</span>`;
      h += verb(R.cor, `<div class="gl-topo">${ic}<div class="nome">${v ? nome : '???'}</div></div><div class="desc">${v ? d : tr('unseen')}</div>`, !v);
    }
    h += '</div>';
  } else if(aba === 'equip'){
    h += `<p class="desc">${tr('eq_intro')}</p><h3>${tr('eq_uniques')}</h3><div class="grade">`;
    for(const u in UNICOS){
      const v = SAVE.seen['u:'+u], [nome, d] = loc(UNICO_TXT[u]);
      h += verb('#f2b544', `<div class="gl-topo">${iconHtml(UNICOS[u].ico, v?'':'apagado')}<div><div class="nome">${v ? nome : '???'}</div><div class="desc">${tr('eq_'+UNICOS[u].tipo)}</div></div></div><div class="desc">${v ? d : tr('unseen')}</div>`, !v);
    }
    h += `</div><h3>${tr('eq_affixes')}</h3><div class="grade">`;
    for(const k in AFX){
      const a = AFX[k];
      const faixa = k === 'regen' ? `${dec(a.min/10,1)}–${dec(a.max*RAR_MULT[4]/10,1)}` : `${a.min}–${Math.round(a.max*RAR_MULT[4])}`;
      const txt = k.startsWith('e_')
        ? tr('a_elem', {v:faixa, t:(LANG==='pt'||LANG==='es') ? TAGS[a.tag].nome.toLowerCase() : TAGS[a.tag].nome})
        : tr('a_' + k, {v:faixa});
      h += verb(a.tag ? TAGS[a.tag].cor : '#4a3d5e', `<div class="desc">${txt}</div>`);
    }
    h += `</div><h3>${tr('eq_sets')}</h3><div class="grade">`;
    for(const tg of ELEM_TAGS){
      const T = TAGS[tg], nm = (LANG==='pt'||LANG==='es') ? T.nome.toLowerCase() : T.nome;
      h += verb(T.cor, `<div class="gl-topo"><span class="gl-ico" style="color:${T.cor}">${T.ico}</span><div class="nome">${T.nome}</div></div><div class="desc">${tr('set_2', {t:nm})}</div><div class="desc">${tr('set_4', {t:nm})}</div>`);
    }
    h += '</div>';
  }
  return h;
}

    ru:['Раунды и торговец','Забег состоит из 11 раундов по 2 минуты. В конце каждого вы получаете монеты и проценты, и открывается торговец: джокеры, перековка оружия выше 7-го уровня, Таро, зелья и карта сокровищ. Затем вы выбираете испытание: больше сложности в обмен на награду.'],
    ja:['ラウンドと商人','1プレイは2分×11ラウンド。各ラウンドの終わりにコインと利子が入り、商人が開きます（ジョーカー、レベル7超えの鍛造、タロット、回復薬、宝の地図）。その後、試練を選びます。難易度と引き換えに報酬がもらえます。'],
    ko:['라운드와 상인','한 판은 2분짜리 11라운드입니다. 라운드가 끝날 때마다 코인과 이자를 받고 상인이 열립니다(조커 구매, 7레벨 초과 단조, 타로, 물약, 보물 지도). 이어서 시련을 고릅니다. 난이도를 올리는 대신 보상을 받습니다.']}},
  {id:'perigos', ico:[5,10], t:{
    pt:['Julgamento e ameaça','O jogo mede o quanto você está sofrendo: se estiver dominando, os inimigos ficam mais fortes (a "Ameaça" no canto). E não fique parado: círculos roxos caem onde você está, e o dano ignora armadura.'],
    en:['Judgment and threat','The game measures how much you are suffering: if you are dominating, enemies grow stronger (the "Threat" in the corner). And keep moving: purple circles fall where you stand, and that damage ignores armor.'],
    es:['Juicio y amenaza','El juego mide cuánto estás sufriendo: si dominas, los enemigos se fortalecen (la "Amenaza" en la esquina). Y no te quedes quieto: caen círculos morados donde estás, y ese daño ignora la armadura.'],
    ru:['Суд и угроза','Игра оценивает, насколько вам тяжело: если вы доминируете, враги усиливаются (показатель «Угроза» в углу). И не стойте на месте: туда, где вы стоите, падают фиолетовые круги, а их урон игнорирует броню.'],
    ja:['裁きと脅威','ゲームはあなたがどれだけ苦戦しているかを測ります。圧倒していると敵が強化されます（画面端の「脅威」）。そして立ち止まらないこと。今いる場所に紫の円が落ち、そのダメージは防御を無視します。'],
    ko:['심판과 위협','게임은 당신이 얼마나 고전하는지 측정합니다. 압도하고 있으면 적이 강해집니다(구석의 "위협"). 그리고 멈춰 있지 마세요. 서 있는 자리에 보라색 원이 떨어지며, 그 피해는 방어를 무시합니다.']}},
  {id:'reforcos', ico:[4,3], t:{
    pt:['Reforços e altares','Pelo mapa surgem reforços escondidos, sem seta: vale explorar. Altares aparecem com um círculo: fique dentro por 2 segundos para ativar. O altar do pacto dá um baú, mas deixa os inimigos mais fortes até o fim da partida.'],
    en:['Boosts and altars','Hidden boosts appear around the map with no arrow, so it pays to explore. Altars show a circle: stand inside for 2 seconds to activate. The pact altar gives a chest but makes enemies stronger for the rest of the run.'],
    es:['Refuerzos y altares','Por el mapa aparecen refuerzos ocultos, sin flecha: vale la pena explorar. Los altares muestran un círculo: quédate dentro 2 segundos para activarlo. El altar del pacto da un cofre, pero hace más fuertes a los enemigos por el resto de la partida.'],
    ru:['Усиления и алтари','По карте появляются скрытые усиления без стрелок — исследуйте. У алтарей есть круг: постойте внутри 2 секунды. Алтарь пакта даёт сундук, но усиливает врагов до конца забега.'],
    ja:['強化と祭壇','マップには矢印なしの隠れた強化が現れます。探索する価値あり。祭壇は円で示され、中に2秒いると起動します。契約の祭壇は宝箱をくれますが、以後の敵が強くなります。'],
    ko:['강화와 제단','맵에는 화살표 없는 숨은 강화가 나타나니 탐험할 가치가 있습니다. 제단은 원으로 표시되며 2초간 안에 있으면 활성화됩니다. 계약의 제단은 상자를 주지만 남은 판 동안 적이 강해집니다.']}},
  {id:'equipamento', ico:[0,12], t:{
    pt:['Equipamentos e Arsenal','Elites, chefes e baús deixam equipamentos, que ficam com você entre as partidas. No Arsenal você equipa 7 espaços, compara com o que está usando, vende o que não serve, tranca favoritos e faz síntese: 3 itens da mesma raridade viram 1 melhor. Duas peças do mesmo elemento dão bônus de conjunto.'],
    en:['Equipment and Arsenal','Elites, bosses and chests drop equipment, and it stays with you between runs. In the Arsenal you fill 7 slots, compare with what you wear, sell what you do not need, lock favorites and use synthesis: 3 items of the same rarity become 1 better item. Two pieces of the same element grant a set bonus.'],
    es:['Equipo y Arsenal','Élites, jefes y cofres sueltan equipo, que se queda contigo entre partidas. En el Arsenal llenas 7 espacios, comparas con lo que llevas, vendes lo que no sirve, bloqueas favoritos y usas la síntesis: 3 objetos de la misma rareza se convierten en 1 mejor. Dos piezas del mismo elemento dan bonus de conjunto.'],
    ru:['Снаряжение и Арсенал','Элита, боссы и сундуки роняют снаряжение, и оно остаётся с вами между забегами. В Арсенале вы заполняете 7 слотов, сравниваете с надетым, продаёте ненужное, закрепляете любимое и используете синтез: 3 предмета одной редкости превращаются в 1 лучше. Два предмета одной стихии дают бонус комплекта.'],
    ja:['装備と武器庫','エリート、ボス、宝箱から装備が手に入り、プレイをまたいで残ります。武器庫では7つの部位に装備し、今の装備と比べ、不要なものを売り、お気に入りをロックし、合成（同じレアリティ3つで1つ上位）ができます。同じ属性2部位でセットボーナス。'],
    ko:['장비와 무기고','정예, 보스, 상자에서 장비가 나오며 판이 끝나도 남습니다. 무기고에서 7개 부위에 장착하고, 착용 중인 것과 비교하고, 필요 없는 것은 팔고, 즐겨찾기를 잠그고, 합성(같은 등급 3개 → 상위 1개)을 할 수 있습니다. 같은 속성 2부위면 세트 보너스가 붙습니다.']}},
  {id:'arvore', ico:[2,21], t:{
    pt:['Árvore da Sina','Na aba ao lado dos equipamentos, as almas viram talentos permanentes em 4 ramos: Ofensiva, Defesa, Fortuna e Arcano. Cada talento abre o próximo, e os dois últimos de cada ramo são os mais fortes. Dá para redistribuir tudo quando quiser.'],
    en:['Tree of Fate','In the tab next to your equipment, souls become permanent talents across 4 branches: Offense, Defense, Fortune and Arcane. Each talent unlocks the next, and the last two of each branch are the strongest. You can reset everything whenever you want.'],
    es:['Árbol del Destino','En la pestaña junto al equipo, las almas se convierten en talentos permanentes en 4 ramas: Ofensiva, Defensa, Fortuna y Arcano. Cada talento desbloquea el siguiente y los dos últimos de cada rama son los más fuertes. Puedes redistribuir todo cuando quieras.'],
    ru:['Древо судьбы','На вкладке рядом со снаряжением души превращаются в постоянные таланты в 4 ветвях: Атака, Защита, Удача и Тайное. Каждый талант открывает следующий, а два последних в ветви — самые сильные. Сбросить всё можно в любой момент.'],
    ja:['運命の樹','装備の隣のタブで、魂を永続タレントに変えられます（攻撃・防御・幸運・秘術の4つの枝）。各タレントは次を解放し、枝の最後の2つが最強です。いつでも振り直せます。'],
    ko:['운명의 나무','장비 옆 탭에서 영혼을 영구 특성으로 바꿉니다(공격, 방어, 행운, 비전의 4가지 가지). 각 특성은 다음을 열고, 가지마다 마지막 두 특성이 가장 강력합니다. 언제든 초기화할 수 있습니다.']}},
  {id:'relicario', ico:[0,17], t:{
    pt:['Relicário e classes','No Relicário você desbloqueia personagens com almas e escolhe aparências. Cada classe tem uma arma inicial, uma passiva própria e uma habilidade ativa, e ainda ganha cartas exclusivas dela durante a partida.'],
    en:['Reliquary and classes','In the Reliquary you unlock characters with souls and choose looks. Each class has a starting weapon, its own passive and an active ability, and also gets class-only cards during the run.'],
    es:['Relicario y clases','En el Relicario desbloqueas personajes con almas y eliges aspectos. Cada clase tiene un arma inicial, una pasiva propia y una habilidad activa, y además consigue cartas exclusivas durante la partida.'],
    ru:['Реликварий и классы','В Реликварии вы открываете персонажей за души и выбираете облики. У каждого класса своё стартовое оружие, своя пассивка и активная способность, а во время забега выпадают карты только для него.'],
    ja:['聖遺物庫とクラス','聖遺物庫では魂でキャラクターを解放し、見た目を選べます。各クラスには初期武器、固有のパッシブ、アクティブスキルがあり、プレイ中にはそのクラス専用のカードも出ます。'],
    ko:['성유물함과 직업','성유물함에서 영혼으로 캐릭터를 해금하고 외형을 고릅니다. 각 직업은 시작 무기, 고유 패시브, 액티브 스킬을 가지며, 판 중에 그 직업 전용 카드도 나옵니다.']}},
  {id:'areas', ico:[0,18], t:{
    pt:['Áreas, Santuário e Diário','As 11 rodadas passam por 4 áreas, cada uma com sua regra: o pântano te deixa lento e solta poças de veneno, a catedral é escura e o abismo de gelo faz você deslizar. No fim de cada área vem um chefe reforçado que, ao cair, revela um fragmento da história no Diário e descobre uma carta nova. Depois dele você entra no Santuário: 40 segundos sem inimigos para recolher tudo e escolher uma recompensa.'],
    en:['Areas, Sanctuary and Diary','The 11 rounds cross 4 areas, each with its own rule: the marsh slows you down and spawns poison pools, the cathedral is dark and the frozen abyss makes you slide. Each area ends with a reinforced boss that, once defeated, reveals a piece of the story in the Diary and discovers a new card. After it you enter the Sanctuary: 40 enemy-free seconds to gather everything and choose a reward.'],
    es:['Áreas, Santuario y Diario','Las 11 rondas atraviesan 4 áreas, cada una con su regla: el pantano te ralentiza y suelta charcos de veneno, la catedral es oscura y el abismo helado te hace deslizar. Cada área termina con un jefe reforzado que, al caer, revela un fragmento de la historia en el Diario y descubre una carta nueva. Después entras en el Santuario: 40 segundos sin enemigos para recogerlo todo y elegir una recompensa.'],
    ru:['Области, Святилище и Дневник','11 раундов проходят через 4 области, у каждой своё правило: болото замедляет и оставляет ядовитые лужи, собор погружён во тьму, а ледяная бездна заставляет скользить. Каждая область заканчивается усиленным боссом: победа над ним открывает фрагмент истории в Дневнике и новую карту. Затем начинается Святилище — 40 секунд без врагов, чтобы всё собрать и выбрать награду.'],
    ja:['エリア・聖域・日記','11ラウンドは4つのエリアを通ります。それぞれ独自のルールがあり、沼は移動を遅くして毒だまりを生み、大聖堂は暗く、氷の深淵では滑ります。各エリアの最後には強化ボスがいて、倒すと日記に物語の断片が明かされ、新しいカードが解放されます。その後は聖域へ：敵のいない40秒で集めて、報酬を1つ選びましょう。'],
    ko:['지역, 성역, 일기','11개 라운드는 4개 지역을 지나며, 지역마다 규칙이 다릅니다. 늪은 속도를 늦추고 독웅덩이를 만들며, 대성당은 어둡고, 얼어붙은 심연에서는 미끄러집니다. 각 지역의 끝에는 강화된 보스가 있고, 쓰러뜨리면 일기에 이야기 조각이 드러나고 새 카드가 해금됩니다. 그다음에는 성역으로 들어갑니다: 적 없는 40초 동안 모두 모으고 보상을 하나 고르세요.']}},
  {id:'fim', ico:[1,5], t:{
    pt:['Chegar ao fim','Chefes aparecem nas rodadas 3, 6 e 9, e a rodada não acaba enquanto eles estiverem vivos. Na rodada 11 vem o Ceifador. Ao vencer, você libera a Maldição seguinte, que deixa tudo mais difícil e rende mais almas.'],
    en:['Reaching the end','Bosses show up on rounds 3, 6 and 9, and the round will not end while they live. Round 11 brings the Reaper. Winning unlocks the next Curse, which makes everything harder and pays more souls.'],
    es:['Llegar al final','Los jefes aparecen en las rondas 3, 6 y 9, y la ronda no termina mientras sigan vivos. En la ronda 11 llega el Segador. Al ganar desbloqueas la siguiente Maldición, que lo hace todo más difícil y da más almas.'],
    ru:['Дойти до конца','Боссы появляются в раундах 3, 6 и 9, и раунд не закончится, пока они живы. В 11-м раунде приходит Жнец. Победа открывает следующее Проклятие: сложнее, но душ больше.'],
    ja:['最後まで進む','ボスはラウンド3、6、9に現れ、倒すまでラウンドは終わりません。ラウンド11では死神が来ます。勝つと次の「呪い」が解放され、難易度が上がるかわりに魂が増えます。'],
    ko:['끝까지 가기','보스는 3, 6, 9라운드에 나타나며, 살아 있는 동안 라운드가 끝나지 않습니다. 11라운드에는 사신이 옵니다. 승리하면 다음 저주가 해금되어 더 어려워지는 대신 영혼을 더 많이 줍니다.']}},
];

    ko:['더 어렵게, 그리고 피드백', ['레벨이 훨씬 느리게 오릅니다: 2분에 13이 아니라 6','적이 더 일찍 강해지고, 수도 많아지며, 정예도 더 자주 나옵니다','처음 실행할 때 로그인할지 게스트로 플레이할지 고릅니다','계정과 클라우드 저장은 설정으로 이동했고, 새 피드백 보내기도 설정에 있습니다']]}},
  {v:'1.5.0', tipo:'antiga', t:{

  {v:'1.4.3', tipo:'antiga', t:{
    pt:['App e compartilhamento', ['Ícone próprio na aba do navegador, em vários tamanhos','Instalação como app corrigida: manifesto em formato aceito pelos navegadores e passo a passo para iPhone','Link do jogo volta a mostrar capa, título e descrição ao ser compartilhado']],

function guiaHtml(){
  let h = `<p class="desc">${tr('guia_intro')}</p><div class="grade">`;
  for(const g of GUIA){
    const [titulo, texto] = loc(g.t);
    h += `<div class="verbete" style="--c:#f2b544"><div class="gl-topo">${iconHtml(g.ico)}<div class="nome">${titulo}</div></div><div class="desc">${texto}</div></div>`;
  }
  return h + '</div>';
}
function renderNotas(){
  let h = '';
  let ultimo = '';
  for(const n of NOTAS){
    const [titulo, itens] = loc(n.t);
    const rotulo = n.tipo === 'futuro' ? tr('notas_futuro') : n.tipo === 'atual' ? tr('notas_atual') : '';
    if(n.tipo === 'antiga' && ultimo !== 'antiga') h += `<h3>${tr('notas_antiga')}</h3>`;
    ultimo = n.tipo;
    h += `<div class="nota ${n.tipo}">
      <div class="nota-topo"><b>${n.v ? 'v' + n.v : ''}</b> <span>${rotulo}</span><span class="nota-tit">${titulo}</span></div>
      <ul>${itens.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
  }
  $('#notasConteudo').innerHTML = h;
  SAVE.opt.versaoVista = VERSAO_JOGO;
  persist();
  atualizarBotaoVersao();
}
function atualizarBotaoVersao(){
  const novo = SAVE.opt.versaoVista !== VERSAO_JOGO;
  $('#btnVersao').innerHTML = `v${VERSAO_JOGO} · ${tr('notas_btn')}${novo ? ` <span class="badge">${tr('novidade')}</span>` : ''}`;
}

const TELAS_CICLO = [['reli','#btnReli'], ['arsenal','#btnArsenal'], ['grim','#btnGrim'], ['notas','#btnVersao'], ['opts','#btnOpts']];
function gpTrocarAba(dir){
  const tela = gpTelaAtual(); if(!tela) return;
  const abas = Array.from(tela.querySelectorAll('.abas button'));
  if(abas.length){
    let i = abas.findIndex(b => b.getAttribute('aria-pressed') === 'true');
    if(i < 0) i = 0;
    const alvo = abas[(i + dir + abas.length) % abas.length];
    alvo.click();
    setTimeout(()=>{ if(GP.ativo) gpFocar(alvo); }, 40);
    return;
  }
  const idx = TELAS_CICLO.findIndex(t => t[0] === tela.id);
  if(idx >= 0){
    const [, botao] = TELAS_CICLO[(idx + dir + TELAS_CICLO.length) % TELAS_CICLO.length];
    const b = $(botao);
    if(b && !b.hidden) b.click();
  }
}
function renderControle(){
  const m = gpMapa();
  let h = `<div class="opt"><label>${tr('gp_config')}</label><p class="desc">${tr('gp_scroll')}</p><div class="gp-lista">`;
  for(const a of GP_ORDEM){
    h += `<div class="gp-linha"><span>${tr('gp_a_' + a)}</span>
      <button class="btn peq ${gpBind===a?'primario':''}" data-bind="${a}">${gpBind===a ? tr('gp_press') : gpNomeBotao(m[a])}</button></div>`;
  }
  h += `</div><div class="acoes" style="margin-top:.5rem"><button class="btn peq" id="gpReset">${tr('gp_reset')}</button></div></div>`;
  return h;
}
function gpCapturarBotao(b){
  if(!gpBind) return false;
  const i = b.findIndex(Boolean);
  if(i < 0) return false;
  SAVE.opt.gpMap = Object.assign({}, SAVE.opt.gpMap || {}, {[gpBind]: i});
  gpBind = null;
  persist();
  renderOpts();
  return true;
}

function liberarLore(id){
  if(SAVE.diario[id]) return;
  SAVE.diario[id] = true;
  persist();
  toast(`<b class="ouro">${loc(DIARIO.find(d=>d.id===id).t)[0]}</b>`);
}

/* ---------- desbloqueio de cartas ---------- */
const CARTA_PRECO = 250;
function cartaLiberada(id){
  const j = JOKERS[id];
  return j.rar === 0 || j.classe || !!SAVE.cartas[id];
}
function cartasTrancadas(){ return Object.keys(JOKERS).filter(id => !cartaLiberada(id)); }
function descobrirCarta(silencioso){
  const tr2 = cartasTrancadas();
  if(!tr2.length) return null;
  const id = tr2[(Math.random()*tr2.length)|0];
  SAVE.cartas[id] = true;
  SAVE.seen['j:'+id] = true;
  persist();
  if(!silencioso) toast(tr('carta_nova', {n:JOKERS[id].nome}));
  return id;
}

/* ---------- regras de área ---------- */
function entrarArea(n){
  const a = areaDaRodada(n);
  if(G.area && G.area.id === a.id) return;
  G.area = a;
  G.biome = a.bioma;
  banner(loc(AREA_TXT[a.id])[0]);
  if(!G.prologo) toast(loc(AREA_TXT[a.id])[1]);
  SAVE.seen['area:'+a.id] = true;
}
function regraArea(){ return G.area ? G.area.regra : null; }
function atualizarArea(dt){
  if(!G.area) return;
  if(G.area.regra === 'lama'){
    G.lamaT = (G.lamaT || 0) - dt;
    if(G.lamaT <= 0){
      G.lamaT = 6;
      const a = Math.random()*Math.PI*2, d = rnd(120, 420);
      addZone(P.x + Math.cos(a)*d, P.y + Math.sin(a)*d, 70, 10, 4 + G.round, 'veneno');
    }
  }
}

/* ---------- fase bônus ---------- */
const BONUS_LEN = 40;
function iniciarBonus(){
  G.bonus = true;
  G.bonusT = BONUS_LEN;
  G.enemies.length = 0;
  G.eproj.length = 0;
  G.mode = 'play';
  banner(tr('bonus_titulo'));
  toast(tr('bonus_sub'));
  for(let i=0;i<60;i++){
    const a = Math.random()*Math.PI*2, d = rnd(120, 900);
    G.pick.push({kind: Math.random()<0.65 ? 'coin' : 'xp', x:P.x+Math.cos(a)*d, y:P.y+Math.sin(a)*d, v:12});
  }
  for(let i=0;i<4;i++){
    const a = Math.random()*Math.PI*2, d = rnd(300, 800);
    G.pick.push({kind:'chest', x:P.x+Math.cos(a)*d, y:P.y+Math.sin(a)*d});
  }
  sfx.level();
}
function atualizarBonus(dt){
  if(!G.bonus) return;
  G.bonusT -= dt;
  G.dirty = true;
  if(G.bonusT <= 0){ G.bonus = false; abrirRecompensaBonus(); }
}
const RECOMPENSAS_BONUS = [
  {id:'lend', ico:[6,21]}, {id:'equip', ico:[0,12]}, {id:'ouro', ico:[2,24]}, {id:'receita', ico:[3,21]},
];
function abrirRecompensaBonus(){
  G.mode = 'bonus';
  const opcoes = RECOMPENSAS_BONUS.slice();
  if(!cartasTrancadas().length) opcoes.splice(opcoes.findIndex(o=>o.id==='receita'), 1);
  const tres = [];
  while(tres.length < 3 && opcoes.length) tres.push(opcoes.splice((Math.random()*opcoes.length)|0, 1)[0]);
  G.bonusOpcoes = tres;
  $('#bonusConteudo').innerHTML = tres.map(o=>`
    <button class="card r3" data-bonus="${o.id}">
      <div class="topo"><span>${tr('bonus_fim')}</span><span class="rar">★</span></div>
      <div class="sigilo">${iconHtml(o.ico, 'brilha')}</div>
      <h3>${tr('bonus_' + o.id)}</h3>
      <p>${tr('bonus_' + o.id + '_d')}</p>
    </button>`).join('');
  showOnly('bonus');
  sfx.card();
}
function escolherBonus(id){
  switch(id){
    case 'lend': G.chestQ.push(3); break;
    case 'equip': { const it = gerarItem(2); SAVE.bau.push(it); if(it.unico) SAVE.seen['u:'+it.unico] = true; persist(); toast(tr('loot_new', {n:nomeItem(it)})); break; }
    case 'ouro': G.coins += 80; G.almasBonus += 150; break;
    case 'receita': descobrirCarta(); break;
  }
  G.bonusOpcoes = null;
  resumePlay();
  endRound(false, true);
}
$('#bonus').addEventListener('click', ev=>{
  const b = ev.target.closest('[data-bonus]');
  if(b) escolherBonus(b.dataset.bonus);
});

/* ---------- abas novas do Grimório ---------- */
function diarioHtml(){
  let h = `<p class="desc">${tr('diario_intro')}</p><div class="grade">`;
  for(const d of DIARIO){
    const tem = SAVE.diario[d.id], [titulo, texto] = loc(d.t);
    h += `<div class="verbete ${tem?'':'oculto'}" style="--c:#f2b544">
      <div class="gl-topo">${iconHtml([0,21], tem?'':'apagado')}<div class="nome">${tem ? titulo : '???'}</div></div>
      <div class="desc lore">${tem ? texto : tr('diario_bloq')}</div></div>`;
  }
  return h + '</div>';
}

// carrega o SDK do Firebase só quando o jogo está configurado para isso
async function carregarSDK(){
  if(CONTA.sdk) return CONTA.sdk;
  if(window.SINA_FAKE_FIREBASE){ CONTA.sdk = window.SINA_FAKE_FIREBASE; return CONTA.sdk; }
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [app, auth, store] = await Promise.all([
    import(base + 'firebase-app.js'),
    import(base + 'firebase-auth.js'),
    import(base + 'firebase-firestore.js'),
  ]);
  const aplicativo = app.initializeApp(CFG.firebase);
  CONTA.sdk = {
    auth: auth.getAuth(aplicativo),
    db: store.getFirestore(aplicativo),
    provider: new auth.GoogleAuthProvider(),
    providerApple: new auth.OAuthProvider('apple.com'),
    entrarAnonimo: auth.signInAnonymously,
    vincular: auth.linkWithPopup,
    entrar: auth.signInWithPopup,
    entrarRedirect: auth.signInWithRedirect,
    sair: auth.signOut,
    aoMudar: auth.onAuthStateChanged,
    doc: store.doc,
    ler: store.getDoc,
    gravar: store.setDoc,
    colecao: store.collection,
    novoDoc: store.addDoc,
  };
  return CONTA.sdk;
}

// quanto progresso um save representa, para decidir qual vale mais
function pontuacaoSave(s){
  if(!s) return -1;
  const missoes = Object.keys(s.missions || {}).length;
  const talentos = Object.values(s.arvore || {}).reduce((a,b)=>a+b, 0);
  return missoes*2000 + talentos*300 + (s.bau ? s.bau.length*80 : 0)
       + (s.almas || 0) + Math.round((s.best && s.best.time) || 0) + (s.runs ? s.runs.length*50 : 0);
}
