function aplicarSave(novo){
  for(const k of Object.keys(SAVE)) delete SAVE[k];
  Object.assign(SAVE, novo);
  persist();
  LANG = SAVE.opt.lang || LANG;
  applyStatic();
  goMenu();
}

async function entrarConta(tipo){
  if(!contaLigada() || CONTA.entrando) return;
  CONTA.entrando = true;
  contaMsg(tr('conta_entrando'));
  try{
    const s = await carregarSDK();
    if(tipo === 'guest'){
      await s.entrarAnonimo(s.auth);
    } else {
      const prov = tipo === 'apple' ? s.providerApple : s.provider;
      const atual = s.auth.currentUser;
      // convidado que entra numa conta leva o progresso junto
      if(atual && atual.isAnonymous && s.vincular){
        try{
          await s.vincular(atual, prov);
          contaMsg(tr('conta_vinculado'));
          CONTA.entrando = false; renderConta();
          await forcarEnvio();
          return;
        }catch(e){ /* a conta já existe: entra normalmente e o jogador escolhe qual save manter */ }
      }
      try{ await s.entrar(s.auth, prov); }
      catch(e){ if(s.entrarRedirect) await s.entrarRedirect(s.auth, prov); else throw e; }
    }
  }catch(e){ contaMsg(tr('conta_erro')); }
  CONTA.entrando = false;
  renderConta();
}
async function sairConta(){
  if(!CONTA.sdk) return;
  try{ await CONTA.sdk.sair(CONTA.sdk.auth); }catch(e){}
  CONTA.user = null;
  contaMsg(tr('conta_saiu'));
  renderConta();
}
function refDoSave(){
  const s = CONTA.sdk;
  return s.doc(s.db, 'saves', CONTA.user.uid);
}
async function lerNuvem(){
  const snap = await CONTA.sdk.ler(refDoSave());
  return snap && snap.exists && snap.exists() ? snap.data() : null;
}
async function enviarNuvem(){
  await CONTA.sdk.gravar(refDoSave(), {save: saveLimpo(), quando: Date.now(), versao: VERSAO_JOGO});
  CONTA.ultima = Date.now();
}
function resumoSave(sv){
  return [tr('res_almas', {n:fmtN(sv.almas||0)}),
          tr('res_missoes', {n:Object.keys(sv.missions||{}).length}),
          tr('res_tempo', {t:fmtTime((sv.best && sv.best.time) || 0)}),
          tr('res_itens', {n:(sv.bau||[]).length})];
}
function perguntarConflito(remoto){
  CONTA.conflito = remoto;
  const lado = (titulo, sv, acao, destaque) => `<div class="card ${destaque?'r3':'r1'}">
      <div class="topo"><span>${titulo}</span></div>
      <h3>${tr('res_almas', {n:fmtN(sv.almas||0)})}</h3>
      <ul class="resumo">${resumoSave(sv).slice(1).map(x=>`<li>${x}</li>`).join('')}</ul>
      <button class="btn peq primario" data-conflito="${acao}">${tr('conflito_manter')}</button>
    </div>`;
  $('#conflitoConteudo').innerHTML = `<p class="desc">${tr('conflito_sub')}</p><div class="cards">
    ${lado(tr('conflito_local'), SAVE, 'local', pontuacaoSave(SAVE) >= pontuacaoSave(remoto.save))}
    ${lado(tr('conflito_nuvem'), remoto.save, 'nuvem', pontuacaoSave(remoto.save) > pontuacaoSave(SAVE))}
  </div>`;
  showOnly('conflito');
}
async function resolverConflito(escolha){
  const remoto = CONTA.conflito;
  CONTA.conflito = null;
  if(escolha === 'nuvem' && remoto){ aplicarSave(remoto.save); CONTA.ultima = Date.now(); toast(tr('conta_baixado')); }
  else { await forcarEnvio(); goMenu(); }
}
async function sincronizar(manual){
  if(!CONTA.user || CONTA.ocupado) return;
  CONTA.ocupado = true;
  try{
    const remoto = await lerNuvem();
    const pLocal = pontuacaoSave(SAVE), pNuvem = pontuacaoSave(remoto && remoto.save);
    // os dois lados com progresso de verdade e diferentes: quem decide é o jogador
    if(!manual && !CONTA.jaPerguntou && remoto && pLocal > 400 && pNuvem > 400 && Math.abs(pLocal - pNuvem) > 200){
      CONTA.jaPerguntou = true;
      CONTA.ocupado = false;
      perguntarConflito(remoto);
      return;
    }
    if(remoto && pNuvem > pLocal){
      aplicarSave(remoto.save);
      CONTA.ultima = Date.now();
      contaMsg(tr('conta_nuvem_maior'));
      if(manual) toast(tr('conta_baixado'));
    } else {
      await enviarNuvem();
      contaMsg(remoto ? tr('conta_local_maior') : tr('conta_ok'));
      if(manual) toast(tr('conta_enviado'));
    }
  }catch(e){ contaMsg(tr('conta_erro')); }
  CONTA.ocupado = false;
  renderConta();
}
async function forcarEnvio(){
  if(!CONTA.user || CONTA.ocupado) return;
  CONTA.ocupado = true;
  try{ await enviarNuvem(); toast(tr('conta_enviado')); contaMsg(tr('conta_enviado')); }
  catch(e){ contaMsg(tr('conta_erro')); }
  CONTA.ocupado = false;
  renderConta();
}
async function forcarBaixa(){
  if(!CONTA.user || CONTA.ocupado) return;
  CONTA.ocupado = true;
  try{
    const remoto = await lerNuvem();
    if(remoto && remoto.save){ aplicarSave(remoto.save); CONTA.ultima = Date.now(); toast(tr('conta_baixado')); contaMsg(tr('conta_baixado')); }
    else contaMsg(tr('conta_nunca'));
  }catch(e){ contaMsg(tr('conta_erro')); }
  CONTA.ocupado = false;
  renderConta();
}
// salva na nuvem de tempos em tempos, sem atrapalhar a partida
function agendarEnvio(){
  if(!CONTA.user || CONTA.pendente) return;
  CONTA.pendente = true;
  setTimeout(async ()=>{
    CONTA.pendente = false;
    if(!CONTA.user || (G && G.mode === 'play')) { agendarEnvio(); return; }
    try{ await enviarNuvem(); renderConta(); }catch(e){}
  }, 45000);
}

function contaMsg(t){ CONTA.msg = t; const el = $('#contaMsg'); if(el) el.textContent = t; }
function renderConta(){
  const el = $('#contaConteudo');
  if(!el) return;
  const u = CONTA.user;
  let h = `<p class="desc">${tr('conta_sub')}</p>`;
  if(u){
    const quando = CONTA.ultima ? new Date(CONTA.ultima).toLocaleString() : null;
    const nome = u.isAnonymous ? tr('conta_convidado') : (u.displayName || u.email || '—');
    h += `<p class="almas">${tr('conta_logado', {n:nome})}</p>
      ${u.isAnonymous ? `<p class="desc">${tr('conta_guest_aviso')}</p>
        <div class="acoes"><button class="btn peq primario" id="contaEntrar">${tr('conta_vincular')}</button>
        ${CFG.appleLogin ? `<button class="btn peq" id="contaApple">${tr('conta_apple')}</button>` : ''}</div>` : ''}
      <p class="desc">${quando ? tr('conta_ultima', {t:quando}) : tr('conta_nunca')}</p>
      <div class="acoes">
        <button class="btn peq primario" id="contaSinc">${tr('conta_sinc')}</button>
        <button class="btn peq" id="contaEnviar">${tr('conta_enviar')}</button>
        <button class="btn peq" id="contaBaixar">${tr('conta_baixar')}</button>
        <button class="btn peq perigo" id="contaSair">${tr('conta_sair')}</button>
      </div>
      <p class="desc">${tr('conta_aviso')}</p>`;
  } else {
    h += `<p class="desc">${tr('conta_deslogado')}</p>
      <div class="acoes">
        <button class="btn primario" id="contaEntrar">${tr('conta_entrar')}</button>
        ${CFG.appleLogin ? `<button class="btn" id="contaApple">${tr('conta_apple')}</button>` : ''}
        <button class="btn" id="contaGuest">${tr('conta_guest')}</button>
      </div>
      <p class="desc">${tr('conta_guest_aviso')}</p>`;
  }
  h += `<p id="contaMsg" role="status">${CONTA.msg || ''}</p>`;
  el.innerHTML = h;
  const chip = $('#contaChip');
  if(chip){ chip.hidden = !u; chip.textContent = u ? (u.displayName || u.email || '') : ''; }
}
$('#conta').addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  if(b.id === 'contaEntrar') entrarConta('google');
  else if(b.id === 'contaApple') entrarConta('apple');
  else if(b.id === 'contaGuest') entrarConta('guest');
  else if(b.id === 'contaSair') sairConta();
  else if(b.id === 'contaSinc') sincronizar(true);
  else if(b.id === 'contaEnviar') forcarEnvio();
  else if(b.id === 'contaBaixar') forcarBaixa();
  else if(b.id === 'contaVoltar') goMenu();
});
function abrirConta(){ audioOn(); renderConta(); showOnly('conta'); }
if($('#btnConta')) $('#btnConta').onclick = abrirConta;
function perguntarLoginInicial(){
  if(!contaLigada() || SAVE.opt.contaPerguntou || CONTA.user) return;
  $('#inicioConteudo').innerHTML = `<p class="desc">${tr('inicio_sub')}</p>
    <div class="acoes">
      <button class="btn primario" data-inicio="google">${tr('conta_entrar')}</button>
      ${CFG.appleLogin ? `<button class="btn" data-inicio="apple">${tr('conta_apple')}</button>` : ''}
      <button class="btn" data-inicio="guest">${tr('conta_guest')}</button>
      <button class="btn" data-inicio="depois">${tr('inicio_depois')}</button>
    </div>
    <p class="desc">${tr('conta_guest_aviso')}</p>`;
  showOnly('contaInicio');
}
$('#contaInicio').addEventListener('click', ev=>{
  const b = ev.target.closest('[data-inicio]'); if(!b) return;
  SAVE.opt.contaPerguntou = true; persist();
  const tipo = b.dataset.inicio;
  goMenu();
  if(tipo !== 'depois') entrarConta(tipo);
});
$('#conflito').addEventListener('click', ev=>{
  const b = ev.target.closest('[data-conflito]');
  if(b) resolverConflito(b.dataset.conflito);
});

const FB = {nota:0};
function renderFeedback(){
  const estrelas = [1,2,3,4,5].map(n=>`<button class="estrela ${FB.nota>=n?'on':''}" data-nota="${n}" aria-label="${n}">★</button>`).join('');
  $('#fbConteudo').innerHTML = `<p class="desc">${tr('fb_sub')}</p>
    <div class="opt"><label>${tr('fb_nota')}</label><div class="estrelas">${estrelas}</div></div>
    <div class="opt"><label for="fbTexto">${tr('fb_texto')}</label>
      <textarea id="fbTexto" rows="5" maxlength="1200" placeholder="${tr('fb_ph')}"></textarea></div>
    <div class="opt"><label for="fbContato">${tr('fb_contato')}</label>
      <input id="fbContato" type="email" maxlength="120" autocomplete="email"></div>
    <div class="acoes"><button class="btn primario" id="fbEnviar">${tr('fb_enviar')}</button></div>
    <p id="fbMsg" role="status"></p>`;
}
async function enviarFeedback(){
  const texto = ($('#fbTexto').value || '').trim();
  const contato = ($('#fbContato').value || '').trim();
  if(!texto && !FB.nota){ $('#fbMsg').textContent = tr('fb_vazio'); return; }
  $('#fbMsg').textContent = tr('conta_entrando');
  try{
    const s = await carregarSDK();
    if(!CONTA.user) await s.entrarAnonimo(s.auth);
    const ultima = SAVE.runs && SAVE.runs[0];
    await s.novoDoc(s.colecao(s.db, 'feedback'), {
      nota: FB.nota || null, texto: texto.slice(0, 1200), contato: contato.slice(0, 120),
      versao: VERSAO_JOGO, idioma: LANG, quando: Date.now(),
      uid: (s.auth.currentUser && s.auth.currentUser.uid) || null,
      tela: `${W}x${H}`, toque: touchUI,
      progresso: {almas: SAVE.almas, missoes: Object.keys(SAVE.missions||{}).length, melhor: (SAVE.best&&SAVE.best.time)||0,
                  ultima: ultima ? {t:ultima.t, l:ultima.l, c:ultima.c, m:ultima.m} : null},
    });
    $('#fbMsg').textContent = tr('fb_ok');
    FB.nota = 0;
    setTimeout(()=>{ if(!$('#feedback').hidden) goMenu(); }, 1200);
  }catch(e){ $('#fbMsg').textContent = tr('fb_erro'); }
}
$('#beta').addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  if(b.id === 'betaEntrar'){
    const cod = ($('#betaCodigo').value || '').trim();
    if(CFG.beta && cod && cod === CFG.beta.codigo){
      try{ localStorage.setItem('sina_beta_ok', cod); }catch(e){}
      toast(tr('beta_ok')); goMenu();
    } else $('#betaMsg').textContent = tr('beta_erro');
  }
});
$('#feedback').addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  if(b.dataset.nota){ FB.nota = +b.dataset.nota; const t = $('#fbTexto').value, c = $('#fbContato').value; renderFeedback(); $('#fbTexto').value = t; $('#fbContato').value = c; }
  else if(b.id === 'fbEnviar') enviarFeedback();
  else if(b.id === 'fbVoltar') goMenu();
});
async function iniciarConta(){
  if(!contaLigada()) return;
  if($('#btnConta')) $('#btnConta').hidden = false;
  try{
    const s = await carregarSDK();
    s.aoMudar(s.auth, u => {
      CONTA.user = u || null;
      renderConta();
      if(u) setTimeout(()=>{ sincronizar(false); agendarEnvio(); }, 0);
    });
  }catch(e){ /* sem internet ou configuração errada: o jogo segue normal */ }
}

/* ---------- início ---------- */
LANG = SAVE.opt.lang || detectLang();
if(DESKTOP){ CFG.adsenseClient = ''; CFG.lojaApi = ''; }
localizeAll();
applyStatic();
applyQuality();
Portal.init();
goMenu();
iniciarConta();
if(verificarBeta()) setTimeout(perguntarLoginInicial, 400);
atualizarBotoesApp();
registrarSW();
if(DESKTOP) for(const id in SAVE.missions) if(SAVE.missions[id]) conquistaSteam(id);
migrarBencaos();
for(const it of SAVE.bau) if(it.unico) SAVE.seen['u:'+it.unico] = true;
if(SAVE.avisoMigracao){ const devolvidas = SAVE.avisoMigracao; setTimeout(()=>toast(tr('tree_migr', {n:devolvidas})), 800); delete SAVE.avisoMigracao; persist(); }
verificarRetornoPagamento();
requestAnimationFrame(loop);

</script>
