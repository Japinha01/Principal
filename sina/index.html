<style>
:root{
  --noite:#1c1729; --tinta:#2a2238; --linha:#4a3d5e; --osso:#ecdfc6; --osso2:#b3a78f;
  --vela:#f2b544; --sangue:#c93b56; --gelo:#7fd0ec;
  --titulo:'Pirata One', 'UnifrakturMaguntia', Georgia, serif;
  --texto:'Alegreya Sans', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--noite);color:var(--osso);font-family:var(--texto);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--vela);outline-offset:3px}
.btn{background:var(--tinta);border:1px solid var(--linha);border-radius:6px;padding:.65em 1.4em;font-size:1.1rem;min-width:11rem}
.btn:hover{border-color:var(--vela)}
.btn.primario{background:var(--vela);color:var(--noite);border-color:var(--vela);font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--linha)}
.btn.peq{min-width:0;padding:.45em 1em;font-size:1rem}
.acoes{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.5rem 1rem;background:rgba(22,17,33,.84);overflow-y:auto;z-index:10}
.screen.alto{justify-content:flex-start}
h1.logo{font-family:var(--titulo);font-weight:400;font-size:clamp(6rem,22vw,12rem);line-height:.8;margin:0;letter-spacing:.01em;text-shadow:0 0 40px rgba(242,181,68,.28)}
h2{font-family:var(--titulo);font-weight:400;font-size:clamp(2.4rem,7vw,3.6rem);line-height:1;margin:0;text-align:center}
h3{margin:0}
.sub{font-size:1.25rem;color:var(--osso2);margin:.2rem 0 1rem;text-align:center}
.ajuda{max-width:34rem;text-align:center;color:var(--osso2);line-height:1.45;margin:.6rem 0 0}
.almas{font-size:1.15rem}
.almas b{color:var(--vela)}
#menu{background:radial-gradient(ellipse at 50% 45%, rgba(28,23,41,.25), rgba(22,17,33,.94) 72%)}
.leque{position:relative;width:150px;height:92px;margin-bottom:-.6rem}
.leque span{position:absolute;left:50%;bottom:0;width:54px;height:84px;margin-left:-27px;border-radius:6px;background:#2a2238;border:2px solid var(--vela);box-shadow:inset 0 0 0 4px #2a2238,inset 0 0 0 5px rgba(242,181,68,.4);transform-origin:50% 120%;display:grid;place-items:center;color:var(--vela);font-size:1.3rem}
.leque span:nth-child(1){transform:rotate(-18deg)}
.leque span:nth-child(3){transform:rotate(18deg)}

/* cartas */
#cards{display:flex;gap:1.1rem;flex-wrap:wrap;justify-content:center;perspective:1000px;margin:.6rem 0}
.card{--rc:#b3a78f;--tc:var(--osso);position:relative;width:204px;min-height:306px;background:#241d31;border:2px solid var(--rc);border-radius:12px;padding:14px 14px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;
  box-shadow:inset 0 0 0 5px #241d31,inset 0 0 0 6px color-mix(in srgb,var(--rc) 45%,transparent);
  animation:dar .5s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .15s}
.card:hover,.card:focus-visible{transform:translateY(-10px)}
.card.r1{--rc:#5fa8e8}
.card.r2{--rc:#b46be0}
.card.r3{--rc:#f2b544;box-shadow:inset 0 0 0 5px #241d31,inset 0 0 0 6px rgba(242,181,68,.5),0 0 28px rgba(242,181,68,.35)}
.card .topo{display:flex;justify-content:space-between;width:100%;font-size:.88rem;color:var(--osso2);gap:8px}
.card .rar{color:var(--rc)}
.card .sigilo{font-size:3.4rem;line-height:1;margin:22px 0 12px;color:var(--tc)}
.card .corpo{display:flex;flex-direction:column;flex:1;width:100%}
.card h3{font-family:var(--titulo);font-weight:400;font-size:1.75rem;line-height:1;margin:0 0 .45rem}
.card p{margin:0;font-size:1.02rem;line-height:1.35}
.card .sin{margin-top:auto;padding-top:12px;font-size:.88rem;color:var(--tc)}
.card kbd{position:absolute;right:8px;bottom:6px;font-family:var(--texto);font-size:.75rem;color:var(--osso2)}
@keyframes dar{from{opacity:0;transform:rotateY(85deg) translateY(30px)}to{opacity:1;transform:none}}
@media (hover:none){.card kbd,#levelDica{display:none}}
@media (max-width:680px){
  #cards{flex-direction:column;align-items:center;gap:.7rem}
  .card{width:min(100%,430px);min-height:0;display:grid;grid-template-columns:52px 1fr;column-gap:12px;text-align:left;align-items:start;padding:12px}
  .card .topo{grid-column:2}
  .card .sigilo{grid-column:1;grid-row:1 / span 2;margin:4px 0 0;font-size:2.5rem;text-align:center}
  .card .corpo{grid-column:2}
  .card h3{font-size:1.5rem;margin-top:2px}
  .card .sin{padding-top:6px}
}
@media (prefers-reduced-motion:reduce){.card{animation:none;transition:none}}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#xpbar{position:absolute;top:0;left:0;right:0;height:8px;background:rgba(0,0,0,.5)}
#xpbar i{display:block;height:100%;background:var(--gelo);transform-origin:left;transform:scaleX(0)}
.hudtopo{position:absolute;top:16px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start}
#nivel{font-family:var(--titulo);font-size:1.5rem;line-height:1;margin-bottom:4px}
#hpbar{width:190px;height:16px;background:rgba(0,0,0,.55);border:1px solid var(--linha);border-radius:3px;overflow:hidden;position:relative}
#hpbar i{position:absolute;inset:0;background:var(--sangue);transform-origin:left}
#hpbar span{position:relative;display:block;text-align:center;font-size:.78rem;line-height:15px;font-weight:700}
#timer{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-family:var(--titulo);font-size:2.6rem;line-height:1;text-shadow:0 2px 8px #000}
.hud-dir{display:flex;gap:8px;align-items:center}
.cont{background:rgba(28,23,41,.72);border-radius:6px;padding:4px 9px;font-size:1rem;white-space:nowrap}
.cont b{font-weight:700}
.icone{pointer-events:auto;background:rgba(28,23,41,.8);border:1px solid var(--linha);border-radius:6px;width:38px;height:38px;display:grid;place-items:center;font-size:1rem;padding:0}
#build{position:absolute;left:14px;right:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;gap:5px;align-items:center;padding:3px 8px;border-radius:4px;background:rgba(28,23,41,.8);border-left:3px solid var(--c);font-size:.95rem}
.chip .s{color:var(--c)}
.joker{padding:3px 8px;border-radius:4px;background:rgba(28,23,41,.8);border:1px solid var(--rc,#b3a78f);font-size:.85rem}
.joker.r1{--rc:#5fa8e8}.joker.r2{--rc:#b46be0}.joker.r3{--rc:#f2b544}
.vazio{width:26px;height:22px;border:1px dashed var(--linha);border-radius:4px}
.sep{width:8px}
.syn{padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--c) 22%,rgba(28,23,41,.85));color:var(--osso);font-size:.85rem;border:1px solid var(--c)}
#bossbar{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:min(460px,70vw);text-align:center;font-family:var(--titulo);font-size:1.2rem}
#bossbar div{height:10px;background:rgba(0,0,0,.55);border:1px solid var(--sangue);margin-top:2px}
#bossbar i{display:block;height:100%;background:var(--sangue);transform-origin:left}
#furia{position:absolute;top:62px;right:14px;font-family:var(--titulo);font-size:1.5rem;color:var(--vela);text-shadow:0 0 10px var(--vela)}
#banner{position:fixed;top:28%;left:0;right:0;text-align:center;font-family:var(--titulo);font-size:clamp(2rem,6vw,3.6rem);pointer-events:none;opacity:0;transition:opacity .4s;z-index:6;text-shadow:0 2px 14px #000;padding:0 1rem}
#banner.on{opacity:1}
#joy{position:fixed;width:112px;height:112px;border-radius:50%;border:2px solid rgba(236,223,198,.28);pointer-events:none;z-index:4;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(236,223,198,.3)}
@media (max-width:680px){
  #hpbar{width:112px}
  #timer{font-size:1.9rem;top:62px}
  .cont{font-size:.9rem;padding:3px 6px}
  #bossbar{top:96px}
  #furia{top:62px}
  #build{bottom:8px}
  .chip,.joker,.syn{font-size:.78rem}
}

/* painéis */
.painel{width:min(760px,100%)}
.painel h3{font-family:var(--titulo);font-weight:400;font-size:1.9rem;margin:1.2rem 0 .2rem}
.linha{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid #372d48}
.linha .nome{font-weight:700;font-size:1.1rem}
.linha .desc{color:var(--osso2);font-size:.98rem}
.pips{display:flex;gap:4px;margin-top:5px}
.pip{width:16px;height:6px;border-radius:2px;background:#3a3050}
.pip.on{background:var(--vela)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:min(620px,100%);margin:.4rem 0}
.stats div{background:var(--tinta);border-radius:8px;padding:10px 12px}
.stats dt{font-size:.9rem;color:var(--osso2)}
.stats dd{margin:0;font-family:var(--titulo);font-size:2rem;line-height:1.1}
.ganho{font-size:1.3rem}
.ganho b{color:var(--vela)}
.lista-build{width:min(620px,100%);display:grid;gap:6px}
.lista-build div{background:var(--tinta);border-radius:6px;padding:8px 12px;line-height:1.35}
.lista-build b{font-weight:700}
.dica{color:var(--osso2);font-size:.95rem;text-align:center}
</style>
<style>
/* ---- v2 ---- */
.card.evo{--rc:#f2b544;background:#2b2030;box-shadow:inset 0 0 0 5px #2b2030,inset 0 0 0 6px rgba(242,181,68,.6),0 0 36px rgba(242,181,68,.5)}
.menu-acoes{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
#curseSel{display:flex;align-items:center;gap:.6rem;margin-top:.4rem}
#curseSel button{background:var(--tinta);border:1px solid var(--linha);border-radius:6px;width:36px;height:36px;font-size:1.3rem;padding:0}
#curseSel button:disabled{opacity:.35}
#curseTxt{min-width:15rem;text-align:center;color:var(--osso2)}
#curseTxt b{color:var(--sangue);font-weight:700}
.marcas{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.marca{font-size:.78rem;padding:1px 7px;border-radius:4px;background:rgba(28,23,41,.8);border:1px solid var(--sangue);color:#f0a0b0}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#2a2238;border:1px solid var(--vela);border-radius:8px;padding:.55rem 1rem;z-index:20;opacity:0;transition:opacity .35s;pointer-events:none;max-width:92vw;text-align:center}
#toast.on{opacity:1}
#toast b{color:var(--vela)}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin:.8rem 0 .4rem}
.abas button{background:transparent;border:1px solid var(--linha);border-radius:6px;padding:.4em 1em}
.abas button[aria-pressed="true"]{background:var(--vela);color:var(--noite);border-color:var(--vela);font-weight:700}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:.6rem}
.verbete{background:var(--tinta);border-radius:8px;padding:10px 12px;border-left:3px solid var(--c,#4a3d5e);line-height:1.35}
.verbete .nome{font-weight:700}
.verbete .desc{color:var(--osso2);font-size:.95rem}
.verbete .evo{margin-top:6px;font-size:.9rem;color:var(--vela)}
.verbete.oculto{opacity:.55}
.missao{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #372d48}
.missao .ok{width:22px;height:22px;border-radius:50%;border:2px solid var(--linha);display:grid;place-items:center;font-size:.8rem}
.missao.feita .ok{background:var(--vela);border-color:var(--vela);color:var(--noite)}
.missao.feita .nome{color:var(--osso2);text-decoration:line-through}
.missao .rec{color:var(--vela);white-space:nowrap}
table.rank{width:100%;border-collapse:collapse;margin-top:.6rem;font-size:.98rem}
table.rank th{text-align:left;color:var(--osso2);font-weight:400;padding:6px 4px;border-bottom:1px solid var(--linha)}
table.rank td{padding:7px 4px;border-bottom:1px solid #372d48}
.tabela-wrap{overflow-x:auto}
#win h2{color:var(--vela)}
#btnDash{position:absolute;right:16px;bottom:84px;width:78px;height:78px;border-radius:50%;pointer-events:auto;background:rgba(42,34,56,.85);border:2px solid var(--osso);color:var(--osso);font-size:.95rem;font-weight:700;touch-action:none}
#btnDash.carregando{opacity:.35;border-color:var(--linha)}
@media (hover:hover) and (pointer:fine){#btnDash{display:none}}
#bossbar{top:80px}
#rodada{position:absolute;left:50%;top:54px;transform:translateX(-50%);font-size:.95rem;color:var(--osso2);white-space:nowrap;text-shadow:0 1px 4px #000}
#tarots{position:absolute;right:16px;bottom:84px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tarot{pointer-events:auto;background:rgba(42,34,56,.92);border:1.5px solid #b46be0;border-radius:8px;padding:5px 10px;font-size:.92rem;display:flex;gap:6px;align-items:center}
.tarot:disabled{border-color:var(--linha);opacity:.45;cursor:default}
.tarot .ti{color:#d7b4ff;font-size:1.1rem}
.tarot kbd{font-family:var(--texto);font-size:.72rem;color:var(--osso2);border:1px solid var(--linha);border-radius:3px;padding:0 4px}
.loja{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:.5rem}
.item{--rc:#b3a78f;background:#241d31;border:1.5px solid var(--rc);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.item.r1{--rc:#5fa8e8}.item.r2{--rc:#b46be0}.item.r3{--rc:#f2b544}.item.tar{--rc:#9a6ac0}
.item .topo{display:flex;justify-content:space-between;font-size:.82rem;color:var(--osso2)}
.item .rar{color:var(--rc)}
.item .nome{font-family:var(--titulo);font-size:1.45rem;line-height:1.05}
.item p{margin:0;font-size:.95rem;line-height:1.3;flex:1}
.item .tag{font-size:.85rem}
.item .btn{margin-top:6px;min-width:0;width:100%}
.item.vendido{opacity:.4;display:grid;place-items:center;min-height:120px;border-style:dashed}
.resumo{background:var(--tinta);border-left:3px solid var(--vela);border-radius:6px;padding:10px 14px;margin:.6rem 0;line-height:1.45}
.acoes.rodape{position:sticky;bottom:-1.5rem;margin:1.2rem -1rem 0;padding:.9rem 1rem 1.6rem;background:linear-gradient(to top, #1a1526 70%, rgba(26,21,38,0))}
#trialOps{display:flex;gap:1.1rem;flex-wrap:wrap;justify-content:center;perspective:1000px;margin:.4rem 0 .6rem}
@media (max-width:680px){
  #rodada{top:96px;font-size:.82rem}
  #bossbar{top:118px}
  #tarots{bottom:174px}
  .tarot kbd{display:none}
  #trialOps{flex-direction:column;align-items:center;gap:.7rem}
}
</style>
<style>
/* ---- v7: sprites, ícones, monetização ---- */
.px{--s:48px;display:inline-block;width:var(--s);height:var(--s);background-image:var(--items);background-repeat:no-repeat;
  background-size:calc(var(--s)*11) calc(var(--s)*26);background-position:calc(var(--c)*var(--s)*-1) calc(var(--r)*var(--s)*-1);
  image-rendering:pixelated;vertical-align:middle}
.pxr{--s:48px;display:inline-block;flex:none;width:var(--s);height:var(--s);background-image:var(--rogues);background-repeat:no-repeat;
  background-size:calc(var(--s)*7) calc(var(--s)*7);background-position:calc(var(--c)*var(--s)*-1) calc(var(--r)*var(--s)*-1);
  image-rendering:pixelated}
.card .sigilo .px{--s:72px;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--tc) 55%,transparent))}
.card .sigilo .px.brilha{filter:drop-shadow(0 0 14px #f2b544) drop-shadow(0 0 4px #fff3c9)}
.card .sigilo{margin:14px 0 6px}
@media (max-width:680px){ .card .sigilo .px{--s:48px} }
#trialOps .card .sigilo{margin:22px 0 12px}
.item-ico{height:40px;margin:2px 0}
.item-ico .px{--s:40px}
.pacote-ico{display:grid;place-items:center;height:84px}
.pacote-ico .px{--s:80px;filter:drop-shadow(0 0 12px rgba(242,181,68,.45))}
.item.pacote{text-align:center}
.item .topo{min-height:1.2em}
.item.pacote .btn.primario{background:var(--vela);color:var(--noite)}
.skin-info{display:flex;gap:12px;align-items:center}
.tag-apoio{color:var(--vela)}
.flag{width:22px;height:22px;image-rendering:pixelated;vertical-align:middle;margin-right:6px}
.menu-extra{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:.2rem}
.btn.anuncio::before{content:'▶ ';color:var(--vela)}
.btn.tesouro{border-color:var(--vela);color:var(--vela)}
.apoiador{margin:-.4rem 0 0;color:var(--vela);font-weight:700;letter-spacing:.04em}
.restaurar{display:flex;gap:8px;flex-wrap:wrap;margin:.4rem 0}
.restaurar input{flex:1;min-width:180px;background:var(--tinta);border:1px solid var(--linha);border-radius:6px;color:var(--osso);padding:.5em .8em;font:inherit}
#lojaMsg{min-height:1.4em;color:var(--vela)}
.creditos{margin-top:1rem;color:var(--osso2);font-size:.92rem;line-height:1.5}
.creditos h3{font-size:1.4rem;margin:.6rem 0 .2rem;color:var(--osso)}
.creditos a{color:var(--vela)}
/* ---- v8: habilidade de classe, controle ---- */
#btnSkill{position:absolute;right:16px;bottom:168px;pointer-events:auto;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 6px;border-radius:10px;
  border:1.5px solid var(--linha);color:var(--osso);font-size:.95rem;
  background:linear-gradient(to top, rgba(8,5,14,.82) calc(var(--cd,0)*100%), rgba(42,34,56,.92) calc(var(--cd,0)*100%))}
#btnSkill .px{--s:36px}
#btnSkill.pronto{border-color:var(--vela);box-shadow:0 0 14px rgba(242,181,68,.45)}
#btnSkill kbd{font-family:var(--texto);font-size:.72rem;color:var(--osso2);border:1px solid var(--linha);border-radius:3px;padding:0 4px}

function resize(){
  const cap = (typeof DPR_CAP === 'number') ? DPR_CAP : 2;
  DPR = Math.min(cap, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';

  vignette.addColorStop(0,'rgba(10,6,18,0)');

}

  if(typeof v !== 'number') return v;
  if(v < 1e4) return String(v);

  if(v < 1e9) return dec(v/1e6, v<1e8?1:0)+'M';
  return dec(v/1e9, 1)+'B';
}
function hash(x,y,s){
  let h = (Math.imul(x|0,374761393) + Math.imul(y|0,668265263) + Math.imul(s|0,2246822519))|0;
  h = Math.imul(h ^ (h>>>13), 1274126177);
  return (h ^ (h>>>16))>>>0;
}
function fmtTime(t){ t=Math.floor(t); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
function pickWeighted(list){
  let s=0; for(const o of list) s+=o.w;
  let r=Math.random()*s;
  for(const o of list){ r-=o.w; if(r<=0) return o; }
  return list[list.length-1];
}

function tr(k, p){
  let s = (STR[LANG] && STR[LANG][k] !== undefined) ? STR[LANG][k] : STR.pt[k];
  if(s === undefined) return k;
  if(p) s = s.replace(/\{(\w+)\}/g, (m,n) => p[n] !== undefined ? p[n] : m);
  return s;
}

function loadLangFont(l){

/* troca os campos de texto das tabelas por leitores que respeitam o idioma atual */
function localize(table, group, fields, keyOf){
  for(const k in table){
    const o = table[k];
    const id = keyOf ? keyOf(o, k) : k;
    for(const f of fields){
      if(!(f in o)) continue;
      const dsc = Object.getOwnPropertyDescriptor(o, f);
      if(dsc && dsc.get) continue;
      const pt = o[f];
      Object.defineProperty(o, f, {configurable:true, enumerable:true, get(){
        if(LANG === 'pt') return pt;
        const g = TD[LANG] && TD[LANG][group], e = g && g[id];
        return (e && e[f] !== undefined) ? e[f] : pt;
      }});
    }
  }
}
function localizeAll(){
  localize(TAGS, 'tags', ['nome']);
  localize(RAR, 'rar', ['n']);
  localize(WEAPONS, 'weapons', ['nome','desc']);
  for(const id in WEAPONS) localize({[id]:WEAPONS[id].evo}, 'evos', ['nome','desc']);
  localize(CHARS, 'chars', ['nome','desc']);
  localize(META, 'meta', ['nome','desc'], o=>o.id);
  localize(BLESS, 'bless', ['nome','d'], o=>o.id);
  localize(JOKERS, 'jokers', ['nome','d']);

  localize(AFFIX, 'affix', ['nome']);
  localize(TRIALS, 'trials', ['nome','d','rw']);
  localize(TAROTS, 'tarots', ['nome','d']);
  localize(BIOMES, 'biomes', ['nome']);
  localize(ALTARS, 'altars', ['nome']);

/* ---------- áudio ---------- */
let AC = null, muted = false;
const AU = {master:null, sfx:null, music:null, rev:null, noise:null, duck:1, nextNote:0, step:0, timer:null, intensity:0};
function audioOn(){
  if(!AC){
    try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.connect(AC.destination);
    AU.master = AC.createGain(); AU.master.connect(comp);
    AU.sfx = AC.createGain(); AU.sfx.connect(AU.master);
    AU.music = AC.createGain(); AU.music.connect(AU.master);
    // reverb com resposta ao impulso gerada na hora
    const len = AC.sampleRate*2.4, ir = AC.createBuffer(2, len, AC.sampleRate);
    for(let c=0;c<2;c++){ const d = ir.getChannelData(c); for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 2.6); }
    AU.rev = AC.createConvolver(); AU.rev.buffer = ir;
    const wet = AC.createGain(); wet.gain.value = 0.32; AU.rev.connect(wet); wet.connect(AU.master);
    const nb = AC.createBuffer(1, AC.sampleRate, AC.sampleRate), nd = nb.getChannelData(0);
    for(let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
    AU.noise = nb;
    applyVolumes();
    AU.nextNote = AC.currentTime + 0.1;
    AU.timer = setInterval(musicTick, 60);
  }
  if(AC.state==='suspended') AC.resume();
}
function applyVolumes(){
  if(!AC) return;
  const t = AC.currentTime;
  AU.master.gain.setTargetAtTime(muted ? 0 : 1, t, 0.05);
  AU.sfx.gain.setTargetAtTime(SAVE.opt.sfx, t, 0.05);
  AU.music.gain.setTargetAtTime(SAVE.opt.music * 0.55 * AU.duck, t, 0.4);
}
function out(send){
  // conecta um nó ao bus de efeitos, com um pouco de reverb opcional
  const g = AC.createGain(); g.connect(AU.sfx);
  if(send){ const s = AC.createGain(); s.gain.value = send; g.connect(s); s.connect(AU.rev); }
  return g;
}
function tone(freq, dur, type, vol, slide, send, dest){
  if(!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'square';
  o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide), t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.03, t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest || out(send||0.15));
  o.start(t); o.stop(t+dur+0.02);
}
function noise(dur, vol, ftype, freq, q, freqEnd, send){
  if(!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = AU.noise; s.loop = true;
  f.type = ftype; f.frequency.setValueAtTime(freq, t); f.Q.value = q||1;
  if(freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  s.connect(f); f.connect(g); g.connect(out(send||0.1));
  s.start(t, Math.random()*0.5); s.stop(t+dur+0.02);
}

/* música procedural: ré menor, intensidade segue a partida */
const MTOF = m => 440*Math.pow(2,(m-69)/12);
const PROG = [[50,53,57],[46,50,53],[43,46,50],[45,49,52]];
const BPM = 84, STEP = 60/BPM/2;
function musicTick(){
  if(!AC || muted || SAVE.opt.music <= 0.001) { if(AC) AU.nextNote = AC.currentTime + 0.1; return; }
  while(AU.nextNote < AC.currentTime + 0.25){ playStep(AU.step, AU.nextNote); AU.nextNote += STEP; AU.step++; }
}
function mVoice(type, freq, t, dur, vol, cutoff, att){
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = type; o.frequency.value = freq;
  f.type = 'lowpass'; f.frequency.value = cutoff||2000;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + (att||0.01));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(AU.music);
  const s = AC.createGain(); s.gain.value = 0.35; g.connect(s); s.connect(AU.rev);
  o.start(t); o.stop(t + dur + 0.05);
}
function mNoise(t, dur, vol, type, freq){
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = AU.noise; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  s.connect(f); f.connect(g); g.connect(AU.music);
  s.start(t, Math.random()*0.5); s.stop(t+dur+0.02);
}
function playStep(step, t){
  const bar = Math.floor(step/8), beat = step % 8;
  const chord = PROG[Math.floor(bar/2) % PROG.length];
  const I = AU.intensity;
  if(step % 16 === 0){
    for(const n of chord){
      mVoice('sawtooth', MTOF(n), t, STEP*17, 0.018, 700 + I*250, 1.2);
      mVoice('sawtooth', MTOF(n)*1.006, t, STEP*17, 0.014, 700 + I*250, 1.2);
    }
  }
  const arp = [0,1,2,1,0,2,1,2];
  if(I >= 1 || beat % 2 === 0){
    const n = chord[arp[beat]] + 12 + (beat>=4 && I>=2 ? 12 : 0);
    mVoice('triangle', MTOF(n), t, 0.6, 0.02, 3000, 0.005);
  }
  if(I >= 1 && beat % 2 === 0) mVoice('triangle', MTOF(chord[0]-12), t, STEP*1.8, 0.05, 500);
  if(I >= 2){
    if(beat === 0 || beat === 4){
      const o = AC.createOscillator(), g = AC.createGain();
      o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t+0.2);
      g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.3);
      o.connect(g); g.connect(AU.music); o.start(t); o.stop(t+0.32);
    }
    mNoise(t, 0.05, 0.02, 'highpass', 7000);
  }
  if(I >= 3 && (beat === 2 || beat === 6)) mNoise(t, 0.16, 0.07, 'bandpass', 1800);
}
function updateMusic(){
  let I = 0, duck = 1;
  if(G && G.mode !== 'menu'){
    I = 1;
    if(G.heat > 3 || G.evt) I = 2;
    if(G.enemies.some(e=>e.boss)) I = 3;
    if(G.mode !== 'play') duck = 0.45;
  }
  AU.intensity = I;
  if(duck !== AU.duck){ AU.duck = duck; applyVolumes(); }
}

/* ---------- adaptador de portal ---------- */
// Pontos únicos para ligar o SDK de um portal. Sem SDK na página, tudo funciona localmente (recompensas são entregues direto).
// Confira a documentação atual do portal antes de publicar: nomes de métodos podem mudar entre versões do SDK.
const Portal = {
  kind: 'local',
  init(){
    try{
      if(window.CrazyGames && window.CrazyGames.SDK){ this.kind = 'crazygames'; return; }
      if(window.PokiSDK){
        // só usa a Poki depois que o SDK confirmar que iniciou; se travar ou falhar, o jogo segue sozinho
        let pronto = false;
        const ok = ()=>{ if(pronto) return; pronto = true; this.kind = 'poki'; try{ window.PokiSDK.gameLoadingFinished(); }catch(e){} };
        const falhou = ()=>{ if(pronto) return; pronto = true; this.kind = 'local'; };
        window.PokiSDK.init().then(ok).catch(falhou);
        setTimeout(falhou, 6000);
      }
      else {
        let teste = false;
        try{ teste = new URLSearchParams(location.search).get('anuncios') === 'teste'; }catch(e){}
        if(teste) this.kind = 'teste';
        else if(initAdsense()) this.kind = 'adsense';
      }
    }catch(e){ this.kind = 'local'; }
  },
  gameplayStart(){
    try{
      if(this.kind==='crazygames') window.CrazyGames.SDK.game.gameplayStart();
      else if(this.kind==='poki') window.PokiSDK.gameplayStart();
    }catch(e){}
  },
  gameplayStop(){
    try{
      if(this.kind==='crazygames') window.CrazyGames.SDK.game.gameplayStop();
      else if(this.kind==='poki') window.PokiSDK.gameplayStop();
    }catch(e){}
  },
  happy(){ try{ if(this.kind==='crazygames') window.CrazyGames.SDK.game.happytime(); }catch(e){} },
  adStart(){
    if(adPlaying) return;
    adPlaying = true; mutedBeforeAd = muted;
    for(const k in keys) keys[k] = false;
    joyEnd();
    muted = true; applyVolumes();
  },
  adEnd(){
    if(!adPlaying) return;
    adPlaying = false;
    muted = mutedBeforeAd; applyVolumes();
  },
  // executa uma chamada de anúncio com proteção: se o anúncio não começar nem terminar em alguns segundos, segue o jogo
  guarded(run, onDone, onFail){
    let fim = false, comecou = false, atrasado = false;
    const terminar = cb => {
      if(fim){ if(atrasado){ atrasado = false; this.adEnd(); } return; }
      fim = true; clearTimeout(vigia); this.adEnd(); cb();
    };
    const vigia = setTimeout(()=>{ if(!comecou) terminar(onFail); }, 6000);
    const inicio = ()=>{
      comecou = true;
      // o anúncio começou depois que o jogo já tinha seguido: pausa tudo até ele acabar
      if(fim && !atrasado){ atrasado = true; if(G && G.mode==='play') pause(); this.adStart(); }
    };
    this.adStart();
    try{
      run(inicio, ()=>terminar(onDone), ()=>terminar(onFail));
    }catch(e){ terminar(onFail); }
  },
  commercial(next, tipo, nome){
    if(adPlaying) return;
    syncPortal();
    if(SAVE.premium){ next(); return; }
    if(this.kind==='adsense'){
      this.guarded((start, done)=>{
        window.adBreak({type: tipo || 'next', name: nome || 'intervalo', beforeAd: start, afterAd: ()=>{}, adBreakDone: done});
      }, next, next);
      return;
    }
    if(this.kind==='poki'){
      this.guarded((start, done, fail)=>{
        window.PokiSDK.commercialBreak(start).then(done).catch(done);
      }, next, next);
      return;
    }
    if(this.kind==='crazygames'){
      this.guarded((start, done, fail)=>{
        window.CrazyGames.SDK.ad.requestAd('midgame', {adStarted:start, adFinished:done, adError:done});
      }, next, next);
      return;
    }
    next();
  },
  rewarded(ok, fail, nome){
    if(adPlaying) return;
    syncPortal();
    const falha = ()=>{ fail && fail(); };
    if(this.kind==='teste'){ ok(); return; }
    if(this.kind==='adsense'){
      let ganhou = false;
      this.guarded((start, done)=>{
        window.adBreak({type:'reward', name: nome || 'recompensa', beforeAd: start, afterAd: ()=>{},
          beforeReward: show => show(), adViewed: ()=>{ ganhou = true; }, adDismissed: ()=>{}, adBreakDone: done});
      }, ()=> ganhou ? ok() : falha(), falha);
      return;
    }
    if(this.kind==='poki'){
      let ganhou = false;
      this.guarded((start, done, bad)=>{
        window.PokiSDK.rewardedBreak(start).then(s=>{ ganhou = !!s; done(); }).catch(bad);
      }, ()=> ganhou ? ok() : falha(), falha);
      return;
    }
    if(this.kind==='crazygames'){
      this.guarded((start, done, bad)=>{
        window.CrazyGames.SDK.ad.requestAd('rewarded', {adStarted:start, adFinished:done, adError:bad});
      }, ok, falha);
      return;
    }
    ok();
  },
};
let adPlaying = false, mutedBeforeAd = false;

let portalPlaying = false;
function syncPortal(){
  const playing = !!(G && G.mode==='play' && !adPlaying);
  if(playing !== portalPlaying){ portalPlaying = playing; playing ? Portal.gameplayStart() : Portal.gameplayStop(); }
}

const QUALITY = {
  alta:{parts:1, glow:true, dpr:2, fog:true, motes:40},
  media:{parts:0.6, glow:true, dpr:1.5, fog:true, motes:16},
  baixa:{parts:0.3, glow:false, dpr:1, fog:false, motes:0},
};
let Q = QUALITY.alta, qualityName = 'alta';
const fps = {acc:0, frames:0, low:0, checked:0};
function applyQuality(){
  qualityName = SAVE.opt.quality === 'auto' ? (SAVE.opt.autoQ || 'alta') : SAVE.opt.quality;
  Q = QUALITY[qualityName] || QUALITY.alta;
  DPR_CAP = Q.dpr;
  resize();
}
function trackFps(dt){
  if(SAVE.opt.quality !== 'auto' || !G || G.mode !== 'play') return;
  fps.acc += dt; fps.frames++;
  if(fps.acc >= 3){
    const avg = fps.frames / fps.acc;
    fps.acc = 0; fps.frames = 0;
    if(avg < 42 && qualityName !== 'baixa'){
      fps.low++;
      if(fps.low >= 2){
        fps.low = 0;
        SAVE.opt.autoQ = qualityName === 'alta' ? 'media' : 'baixa';
        persist(); applyQuality();
        toast(tr('q_changed', {q: tr('q_'+qualityName).toLowerCase()}));
      }
    } else fps.low = 0;
  }
}

/* ---------- dicas de primeira vez ---------- */
const tipQueue = [];
let tipBusy = false, tipAtual = null;
function tipContexto(){
  // esconde a dica se a tela mudou e ela não faz mais sentido
  if(!tipAtual) return;
  const modo = G ? G.mode : 'menu';
  const ok = (tipAtual==='shop' && modo==='shop') || (tipAtual==='trial' && modo==='trial') || (tipAtual==='evo' && modo==='level') || modo==='play';
  if(!ok) $('#dica').classList.remove('on');
}
function tip(key){
  if(!SAVE.tips || SAVE.tips[key]) return;
  SAVE.tips[key] = true; persist();
  tipQueue.push(key);
  if(!tipBusy) nextTip();
}
function nextTip(){
  if(!tipQueue.length){ tipBusy = false; return; }
  tipBusy = true;
  const modo = G ? G.mode : 'menu';
  const menu = ['arsenal','arvore','reli'];
  const cabe = k => menu.includes(k) || (k==='shop' && modo==='shop') || (k==='trial' && modo==='trial') || (k==='evo' && modo==='level') || modo==='play';
  const i = tipQueue.findIndex(cabe);
  if(i < 0){ setTimeout(nextTip, 600); return; }
  const k = tipQueue.splice(i,1)[0];
  tipAtual = k;
  const el = $('#dica');
  el.innerHTML = tr('tip_'+k);
  el.classList.add('on');
  setTimeout(()=>{ el.classList.remove('on'); setTimeout(nextTip, 450); }, 6500);
}

/* ---------- tutorial ---------- */
const TUT_STEPS = 6;
const touchUI = matchMedia('(hover:none)').matches;
function tutText(i){
  const k = ['tut_1','tut_2','tut_3','tut_4','tut_5','tut_6'][i];
  if(GP.ativo && (k==='tut_1' || k==='tut_4')) return tr(k==='tut_1' ? 'tut_1g' : 'tut_4g');
  if(touchUI && (k==='tut_1' || k==='tut_4')) return tr(k+'m');
  return tr(k);
}
function tutShow(){
  const T = G && G.tut;
  const box = $('#tut');
  const vis = !!(T && !T.done && (G.mode==='play' || (G.mode==='level' && T.step===2)));
  box.hidden = !vis;
  if(!vis) return;
  $('#tutPasso').textContent = tr('tut_step', {a:T.step+1, b:TUT_STEPS});
  $('#tutTexto').textContent = tutText(T.step);
}
function tutNext(){
  const T = G.tut; if(!T) return;
  T.step++; T.t = 0; T.flag = false;
  tone(880,0.12,'sine',0.03,1.5,0.3);
  if(T.step >= TUT_STEPS){ tutEnd(); return; }
  tutShow();
}
function tutEnd(){
  if(!G.tut) return;
  G.tut.done = true;
  SAVE.opt.tutorialDone = true; persist();
  tutShow();
}
function tutUpdate(dt){
  const T = G.tut; if(!T || T.done) return;
  T.t += dt;
  switch(T.step){
    case 0: T.dist = (T.dist||0) + (G.moving ? P.speed*dt : 0); if(T.dist > 320) tutNext(); break;
    case 1: if(G.lvl >= 2 || T.t > 25) tutNext(); break;
    case 2: if(T.flag || T.t > 30) tutNext(); break;
    case 3: if(T.flag || T.t > 45) tutNext(); break;
    case 4:
      if(!T.fired){ T.fired = true; judgement(P.x + G.lastDx*40, P.y + G.lastDy*40, 70, 2.2, 0.05); }
      if(T.t > 3.2) tutNext();
      break;
    case 5: if(T.t > 7) tutEnd(); break;
  }
}

/* ---------- grade espacial ---------- */
const CELL = 48;
const grid = new Map();
const gkey = (cx,cy) => (cx+32768)*65536 + (cy+32768);
function buildGrid(){
  grid.clear();
  for(const e of G.enemies){
    if(e.dead) continue;
    const k = gkey(Math.floor(e.x/CELL), Math.floor(e.y/CELL));
    let a = grid.get(k); if(!a){ a=[]; grid.set(k,a); }
    a.push(e);
  }
}
function query(x,y,r,cb){
  const x0=Math.floor((x-r)/CELL), x1=Math.floor((x+r)/CELL), y0=Math.floor((y-r)/CELL), y1=Math.floor((y+r)/CELL);
  for(let cx=x0; cx<=x1; cx++) for(let cy=y0; cy<=y1; cy++){
    const a = grid.get(gkey(cx,cy));
    if(a) for(const e of a) if(!e.dead) cb(e);
  }
}
function nearestEnemy(x,y,maxD,exclude){
  maxD = Math.min(maxD, Math.hypot(limiteTela().hw, limiteTela().hh));
  let best=null, bd=maxD*maxD;
  for(const e of G.enemies){
    if(e.dead || (exclude && exclude.has(e))) continue;
    if(!naTela(e.x, e.y)) continue;
    const d=(e.x-x)**2+(e.y-y)**2;
    if(d<bd){ bd=d; best=e; }
  }
  return best;
}
// limite de mira: nada de matar o que o jogador não consegue ver.
// usa o retângulo visível, não um círculo, porque a tela do celular é estreita
function limiteTela(){
  const [hw, hh] = viewHalf();
  return {hw: Math.max(140, hw - 24), hh: Math.max(140, hh - 24)};
}
function naTela(x, y){
  const L = limiteTela();
  return Math.abs(x - P.x) < L.hw && Math.abs(y - P.y) < L.hh;
}
function alcanceVis(){ const L = limiteTela(); return Math.min(640, Math.min(L.hw, L.hh)); }
function randomEnemyNear(range){
  range = Math.min(range, alcanceVis());
  const L = limiteTela();
  const n = G.enemies.length; if(!n) return null;
  for(let i=0;i<14;i++){
    const e = G.enemies[(Math.random()*n)|0];
    if(!e.dead && Math.abs(e.x-P.x) < Math.min(range, L.hw) && Math.abs(e.y-P.y) < Math.min(range*0.7, L.hh)) return e;
  }
  return nearestEnemy(P.x,P.y,range);
}

function hpScale(t){
  let s = 1 + t/60*0.85;
  if(t>240) s *= 1 + Math.pow((t-240)/60, 1.5)*0.35;
  return s;
}
function viewR(){ const Z=zoom(); return Math.hypot(W/Z,H/Z)/2 + 40; }
function pickType(){
  const list=[];
  for(const id in ETYPES){ const T=ETYPES[id]; if(T.from<=G.time) list.push({id, w:T.w}); }
  return pickWeighted(list).id;
}

    const ks = Object.keys(AFFIX), n = G.time>600 ? 2 : 1;

    }

  if(opt.boss){
    e.boss=true;
    e.hp = T.hp*(hs/G.heat)*Math.sqrt(G.heat)*1.25*(1+G.bossKills*0.4);
    e.spd = T.spd*(1+Math.min(0.5,G.bossKills*0.06));
    e.atk = 3;
    G.bossRef = e;
  }
  e.maxHp = e.hp;
  SAVE.seen['m:'+typeId] = true;
  G.enemies.push(e);
  return e;
}
function proximaOnda(){
  G.wave++;
  banner(tr('wave', {n:G.wave}));
  const n = Math.min(40, 8 + Math.floor(G.time/12));
  const typ = pickType();
  for(let i=0;i<n && G.enemies.length<460;i++) spawnEnemy(typ, {ang: i/n*Math.PI*2 + Math.random()*0.2});
  if(G.round < 2) return;
  G.queue.push({t:1.2, fn:()=>{
    if(!G || G.mode==='dead') return;
    spawnEnemy(pickType(), {elite:true, mini:true});
    banner(tr('miniboss')); sfx.boss(); gpVibrar(260, 0.6);
  }});
}
function updateSpawns(dt){
  if(G.bonus) return;
  G.waveT -= dt;
  if(G.waveT <= 0 && !G.prologo && G.time > 20){ G.waveT = ONDA_LEN; proximaOnda(); }
  if(G.enemies.length < 440){
    const mare = G.evt==='mare' ? 2 : 1;
    G.spawnAcc += dt * (G.tut && !G.tut.done ? 0.5 : (G.prologo ? 2.6 : G.round===1 ? 0.8 : 1)) * Math.min(60, (1.3 + G.time/11) * Math.sqrt(G.heat)) * (1 + G.curse*0.1) * mare * (G.trial==='horda'?1.6:1);
    while(G.spawnAcc >= 1){ G.spawnAcc -= 1; spawnEnemy(pickType()); }
  } else G.spawnAcc = 0;
  // elites surgem por tempo, não por quantidade de inimigos
  G.eliteT -= dt;
  if(G.eliteT<=0){ G.eliteT = G.trial==='elites' ? 3 : Math.max(5, 9 - G.round*0.4); spawnEnemy(pickType(), {elite:true}); }
  if(G.time >= G.nextHorde){
    G.nextHorde += 60;
    const n = Math.min(60, Math.floor(10 + G.time/8)), typ = pickType();
    for(let i=0;i<n && G.enemies.length<460;i++) spawnEnemy(typ, {ang: i/n*Math.PI*2});
    banner(tr('horde'));
  }
}
function enemyShot(e, ang, spd){
  G.eproj.push({x:e.x, y:e.y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, r:6, dmg:e.dmg*0.7, life:5});
}
function bossAct(e, d, dx, dy){
  const a = Math.atan2(dy,dx);
  switch(e.type){
    case 'guardiao':
      e.atk = 5;
      for(let i=0;i<8;i++){ const q=i/8*Math.PI*2; spawnEnemy('zumbi', {x:e.x+Math.cos(q)*70, y:e.y+Math.sin(q)*70}); }
      break;
    case 'bruxa':
      e.atk = 2.8;
      for(let i=0;i<14;i++) enemyShot(e, a + i/14*Math.PI*2, 140);
      break;
    case 'colosso':
      e.atk = 4; e.dashT = 0.8; e.dx = dx/d; e.dy = dy/d;
      G.fx.push({kind:'ring', x:e.x, y:e.y, r:e.r+20, life:0.3, max:0.3, cor:'#c93b56'});
      break;
    case 'ceifador':
      e.phase = (e.phase||0) + 1;
      e.atk = 2.4;
      if(e.phase%3===0){ e.dashT = 0.7; e.dx = dx/d; e.dy = dy/d; }
      else if(e.phase%3===1){ for(let i=0;i<20;i++) enemyShot(e, a + i/20*Math.PI*2, 160); }
      else { for(let i=0;i<6;i++){ const q=i/6*Math.PI*2; spawnEnemy('espectro', {x:e.x+Math.cos(q)*80, y:e.y+Math.sin(q)*80}); } }
      break;
  }
}
function updateEnemies(dt){
  const R = viewR();
  const spdMul = (J.relogio ? 1.15 : 1) * (G.evt==='eclipse' ? 1.3 : 1) * (G.trial==='pressa' ? 1.25 : 1);
  let near = 0;
  const decay = Math.max(0, 1 - dt*7);
  for(const e of G.enemies){
    if(e.dead) continue;
    const T = ETYPES[e.type];
    const dx=P.x-e.x, dy=P.y-e.y, d=Math.hypot(dx,dy)||1;
    let sp = e.spd * (e.slow>0?0.5:1) * spdMul;
    if(e.frozen>0){ sp = 0; e.frozen -= dt; }
    let mx = dx/d, my = dy/d;
    if(T.ranged && !e.boss){
      if(d < 270) sp = d < 200 ? -sp*0.5 : 0;
      e.atk -= dt;
      if(e.atk<=0 && d < 420){ e.atk = 2.6; enemyShot(e, Math.atan2(dy,dx), 150); }
    }
    if(T.dash && !e.boss){
      e.atk -= dt;
      if(e.dashT<=0 && e.atk<=0 && d<380){ e.dashT = 0.55; e.atk = 3; e.dx = mx; e.dy = my; }
    }
    if(e.boss){ e.atk -= dt*1.2; if(e.atk<=0) bossAct(e, d, dx, dy); }
    if(e.dashT>0){ e.dashT -= dt; mx = e.dx; my = e.dy; if(e.frozen<=0) sp = e.spd*3.2; }
    if(T.fuse){
      if(e.fuse<0 && d<55) e.fuse = 0.7;
      if(e.fuse>=0){
        e.fuse -= dt; sp *= 0.3;
        if(e.fuse<0){
          if(Math.hypot(P.x-e.x,P.y-e.y) < 85) damagePlayer(e.dmg*1.2);
          G.fx.push({kind:'ring', x:e.x, y:e.y, r:85, life:0.35, max:0.35, cor:'#a8d63c'});
          e.hp = 0; kill(e, 'x', {});
          continue;
        }
      }
    }
    e.x += (mx*sp + e.kx)*dt;
    e.y += (my*sp + e.ky)*dt;
    e.kx *= decay; e.ky *= decay;
    e.slow -= dt; e.flash -= dt; e.orbCd -= dt;
    if(e.af){
      if(e.af.vampirico) e.hp = Math.min(e.maxHp, e.hp + e.maxHp*0.02*dt);
      if(e.af.invocador){ e.sumT -= dt; if(e.sumT<=0 && d<520){ e.sumT = 4; for(let k=0;k<3;k++) spawnEnemy('morcego',{x:e.x+rnd(-30,30), y:e.y+rnd(-30,30)}); } }
    }
    if(e.psnT>0){
      e.psnT -= dt; e.psnTick -= dt;
      if(e.psnTick<=0){ e.psnTick = 0.5; hit(e, e.psnD, 'veneno', {dot:true}); if(e.dead) continue; }
    }
    if(e.brnT>0){
      e.brnT -= dt; e.brnTick -= dt;
      if(e.brnTick<=0){ e.brnTick = 0.5; hit(e, e.brnD, e.brnTag, {dot:true}); if(e.dead) continue; }
    }
    e.frostCd -= dt;
    if(G.char==='bruxa' && !e.boss && e.frostCd<=0 && d < e.r + P.r + 4){ e.frozen = Math.max(e.frozen, J.zeroabsoluto ? 2 : 1); e.frostCd = 2.5; }
    let checked = 0;
    query(e.x,e.y,e.r+20, o=>{
      if(o===e || checked>6) return;
      const ox=e.x-o.x, oy=e.y-o.y, rr_=e.r+o.r;
      const dd=ox*ox+oy*oy;
      if(dd<rr_*rr_ && dd>0.01){
        checked++;
        const dist=Math.sqrt(dd), push=(rr_-dist)*0.5;
        const wE = e.boss?0.1:1;
        e.x += ox/dist*push*wE; e.y += oy/dist*push*wE;
      }
    });
    if(d < e.r + P.r && damagePlayer(e.dmg) && e.af && e.af.vampirico) e.hp = Math.min(e.maxHp, e.hp + e.maxHp*0.05);
    if(d < R*0.8) near++;
    if(d > R*1.7 && !e.boss){
      const a = Math.atan2(dy,dx) + rnd(-0.6,0.6);
      e.x = P.x + Math.cos(a)*R; e.y = P.y + Math.sin(a)*R;
    }
  }
  G.nearCount = near;
}
function updateEnemyProj(dt){
  for(const b of G.eproj){
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if(Math.hypot(b.x-P.x,b.y-P.y) < b.r+P.r-3){ b.life = 0; damagePlayer(b.dmg); }
  }
  G.eproj = G.eproj.filter(b=>b.life>0);
}

/* ---------- combate ---------- */
function hit(e, base, tag, o){
  if(e.dead) return;
  o = o||{};
  if(e.invul){ e.flash = 0.05; return; }
  let m = P.dmg * synMult(tag);
  if(J.vidro) m *= 2;
  if(J.colecionador) m *= 1 + Math.floor(G.kills/25)*0.01;
  if(J.avareza) m *= 1 + Math.floor(G.coins/5)*0.01;
  if(J.ampulheta) m *= 1 + Math.floor(G.time/60)*0.04;
  if(J.sede) m *= 1 + Math.min(0.6, G.streak*0.01);
  if(J.inverno && (e.slow>0 || e.frozen>0)) m *= 1.6;
  if(G.fury) m *= 3;
  if(J.chamaeterna && tag==='fogo') m *= 1.2;
  if(J.zeroabsoluto && e.frozen>0) m *= 1.4;
  if(o.volta) m *= 2;
  if(P.elem && P.elem[tag]) m *= 1 + P.elem[tag];
  if(G.buffs && G.buffs.furia) m *= 1.5;
  if(P.tree && P.tree.furia) m *= 1 + 0.1*G.bossKills;
  if(P.tree && P.tree.suspiro && P.hp < P.maxHp*0.3) m *= 1.3;
  const crit = Math.random() < effCrit();
  let dmg = base*m*rnd(0.9,1.1);
  if(crit) dmg *= P.critMult + (J.dado?1:0);
  if(e.af && e.af.blindado) dmg *= 0.5;
  e.hp -= dmg; e.flash = 0.08;
  if(tag==='gelo' || J.geada) e.slow = Math.max(e.slow, 1.5);
  if(o.freeze && !e.boss) e.frozen = Math.max(e.frozen, o.freeze * (J.zeroabsoluto ? 2 : 1));
  if(!o.dot){
    if(J.brasa && tag==='fogo'){ e.brnT = 3; e.brnD = Math.max(e.brnD, base*0.3); e.brnTag = 'fogo'; }
    if(J.hemorragia && crit){ e.brnT = 3; e.brnD = Math.max(e.brnD, base*0.5); e.brnTag = 'sangue'; }
    if(J.sobrecarga && tag==='raio' && !e.boss && Math.random()<0.2) e.frozen = Math.max(e.frozen, 0.5);
  }
  if(!o.dot && (tag==='veneno' || J.toxina)){
    e.psnT = 3; e.psnD = Math.max(e.psnD, base*(tag==='veneno'?0.6:0.3));
  }
  if(o.kb && !e.boss){ const a=Math.atan2(e.y-P.y,e.x-P.x); e.kx += Math.cos(a)*o.kb; e.ky += Math.sin(a)*o.kb; }
  if(crit && tag!=='raio' && P.uniq && P.uniq.has('corvo') && Math.random()<0.1){ const tgt = e; G.queue.push({t:0.05, fn:()=>{ if(!tgt.dead) strike(tgt, 12+G.lvl*1.5, 2); }}); }
  if(crit && G.impT<=0){ G.impT = 0.06; anim('impacto', e.x, e.y, 46); }
  if(!o.dot || crit || Math.random()<0.3) addText(e.x, e.y-e.r, dmg, crit, tag);
  if(crit && J.sanguessuga && G.leech < 6){ G.leech += 0.4; heal(0.4); }
  sfx.hit();
  if(J.condutor && tag!=='raio' && !o.dot && !o.zone && Math.random()<0.08){
    const tgt = e;
    G.queue.push({t:0.05, fn:()=>{ if(!tgt.dead) strike(tgt, 10+G.lvl*1.5, 1); }});
  }
  if(o.exec && !e.boss && e.hp < e.maxHp*0.12) e.hp = 0;
  if(G.char==='carrasco' && !e.boss && !e.elite && e.hp>0 && e.hp < e.maxHp*(J.guilhotina ? 0.15 : 0.08)){ e.hp = 0; if(J.guilhotina) heal(1); }
  if(e.hp<=0) kill(e, tag, o);
}
function kill(e, tag, o){
  if(e.dead) return;
  e.dead = true; G.kills++;
  SAVE.abates[e.type] = (SAVE.abates[e.type]||0) + 1;
  G.streak++; G.streakT = 4;
  dropXp(e.x, e.y, e.xp * (G.evt==='eclipse' ? 2 : 1) * classeXpBonus(e));
  const T = ETYPES[e.type];
  if(e.boss){
    G.bossKills++; G.shake=18;
    G.bossRef = G.enemies.find(x=>x.boss && !x.dead) || null;
    G.pick.push({kind:'chest', x:e.x, y:e.y});
    for(let i=0;i<15;i++) G.pick.push({kind:'coin', x:e.x+rnd(-50,50), y:e.y+rnd(-50,50)});
    if(!G.prologo) soltarItem(e.x-30, e.y+10, 2);
    if(e.type==='ceifador'){
      G.won = true;
      G.pick.push({kind:'chest', x:e.x+30, y:e.y});
      G.queue.push({t:1.2, fn:showWin});
    } else banner(tr('boss_down', {n:T.nome}));
  } else if(e.elite){
    for(let i=0;i<2+(P.uniq.has('avarento')?2:0);i++) G.pick.push({kind:'coin', x:e.x+rnd(-20,20), y:e.y+rnd(-20,20)});
    if(!G.prologo && Math.random() < 0.2*(P.tree.cacador ? 1.5 : 1)) soltarItem(e.x-12, e.y, 0);
    if(Math.random()<0.12) G.pick.push({kind:'tarot', x:e.x+12, y:e.y});
    if(e.af && e.af.explosivo){
      const x=e.x, y=e.y, dm=e.dmg*1.3;
      G.fx.push({kind:'warn2', x, y, r:90, life:0.7, max:0.7});
      G.queue.push({t:0.7, fn:()=>{ if(Math.hypot(P.x-x,P.y-y)<90) damagePlayer(dm); G.fx.push({kind:'ring', x, y, r:90, life:0.3, max:0.3, cor:'#f07a3a'}); sfx.boom(); }});
    }
    if(Math.random()<0.25) G.pick.push({kind:'chest', x:e.x, y:e.y});
  } else {
    const r = Math.random(), cc = (J.pecoelho ? 0.008 : 0.004) * (G.evt==='mare' ? 2 : 1);
    if(r<cc){ if(G.coinDrops++ < (J.pecoelho?24:12)) G.pick.push({kind:'coin', x:e.x, y:e.y}); }
    else if(r<cc+0.004) G.pick.push({kind:'heal', x:e.x, y:e.y});
    else if(r<cc+0.0052) G.pick.push({kind:'ima', x:e.x, y:e.y});
  }
  if(T.split && !e.small){
    for(let i=0;i<2;i++) spawnEnemy(e.type, {x:e.x+rnd(-12,12), y:e.y+rnd(-12,12), small:true});
  }
  if(J.vampiro) heal(0.5);
  if(J.pira && tag==='fogo' && !o.pira){
    const x=e.x, y=e.y;
    G.queue.push({t:0.08, fn:()=>explode(x, y, 48*P.area, 8+G.lvl*1.4, 'fogo', {pira:true})});
  }
  if(J.peste && e.psnT>0){
    const pd = e.psnD;
    query(e.x, e.y, 80, n=>{ if(n.psnT<=0){ n.psnT = 3; n.psnD = Math.max(n.psnD, pd); } });
    G.fx.push({kind:'ring', x:e.x, y:e.y, r:70, life:0.25, max:0.25, cor:'#a8d63c'});
  }
  if(J.lascas && (e.slow>0 || e.frozen>0)){
    for(let i=0;i<3;i++){
      const a = Math.random()*Math.PI*2;
      G.proj.push({kind:'faca', tag:'gelo', x:e.x, y:e.y, vx:Math.cos(a)*420, vy:Math.sin(a)*420, r:4, dmg:6+G.lvl, pierce:1, life:0.6, hit:new Set([e])});
    }
  }
  if(J.cometa){
    G.cometK++;
    if(G.cometK>=20){ G.cometK = 0; const t = randomEnemyNear(480); if(t) meteor(t.x, t.y, 30+G.lvl*3, 60*P.area); }
  }
  classeAoMatar(e, tag);
  burst(e.x, e.y, e.boss?40:e.elite?16:5, e.cor);
  if(e.areaBoss && !G.prologo){
    const idx = AREAS.indexOf(G.area);
    const frag = ['pacto','divida','coro','fundo'][idx] || 'fundo';
    if(!SAVE.diario[frag]) descobrirCarta();
    liberarLore(frag);
  }
  if(e.boss){ anim('morte', e.x, e.y, 180, {forte:true}); anim('moedas', e.x, e.y-20, 110, {forte:true}); }
  else if(e.elite) anim('caveira', e.x, e.y-10, 80);
  if(e.mini){
    for(let i=0;i<6;i++) G.pick.push({kind:'coin', x:e.x+rnd(-30,30), y:e.y+rnd(-30,30)});
    if(!G.prologo && Math.random() < 0.35*(P.tree.cacador ? 1.5 : 1)) soltarItem(e.x, e.y+12, 1);
    if(Math.random() < 0.25) G.pick.push({kind:'chest', x:e.x, y:e.y});
  }
  else if(Math.random() < 0.22*Q.parts) anim('sangue', e.x, e.y+6, 44, {fundo:true});
}
function dropXp(x,y,v){
  const n = G.pick.length;
  if(n > 420){
    for(let i=0;i<8;i++){
      const g = G.pick[(Math.random()*n)|0];
      if(g.kind==='xp'){ g.v += v; return; }
    }
  }
  G.pick.push({kind:'xp', x:x+rnd(-4,4), y:y+rnd(-4,4), v});
}
function heal(v){
  if(G.trial==='semcura') return;
  let f = 1;
  if(P.ferida > 0) f *= 0.3;
  if(G.torpor >= 2) f = 0;
  else if(G.torpor === 1) f *= 0.5;
  if(f <= 0) return;
  P.hp = Math.min(P.maxHp, P.hp + v*f);
}
function damagePlayer(d, verdadeiro){
  if(P.inv>0 || G.mode!=='play') return false;
  if(J.fantasma && Math.random()<0.25){
    P.inv = 0.3;
    G.texts.push({x:P.x, y:P.y-24, v:tr('dodge'), crit:false, cor:'#b9d0e0', life:0.7});
    return false;
  }
  const arm = P.armor + (G.buffs && G.buffs.estandarte ? 5 : 0);
  d *= 1 + G.torpor*0.1;
  const red = verdadeiro ? 1 : 15/(15+Math.max(0,arm));
  const dmg = Math.max(1, d*(G.trial==='fragil'?1.5:1)*red);
  P.hp -= dmg; G.recentDmg += dmg; P.inv = 0.5; P.hurt = 0.25; G.shake = Math.max(G.shake, 6);
  sfx.hurt();
  if(P.uniq.has('eclipse') && G.eclipseCd<=0){ G.eclipseCd = 5; query(P.x, P.y, 150, e=>{ if(!e.boss) e.frozen = Math.max(e.frozen, 1.5); }); anim('brilho', 0, 0, 200, {segue:true, forte:true}); }
  gpVibrar(90, 0.4);
  if(P.hp<=0) die();
  return true;
}
function explode(x,y,rad,dmg,tag,o){
  if(J.chamaeterna && tag==='fogo') rad *= 1.3;
  query(x,y,rad+45, e=>{
    if(Math.hypot(e.x-x,e.y-y) < rad+e.r) hit(e,dmg,tag,Object.assign({kb:120},o));
  });
  G.fx.push({kind:'ring', x, y, r:rad, life:0.3, max:0.3, cor:TAGS[tag].cor});
  if(G.parts.length < 450) for(let i=0;i<8;i++) G.parts.push({x,y,vx:rnd(-160,160),vy:rnd(-160,160),life:0.4,max:0.4,cor:'#f2b544',s:rnd(2,4)});
  anim(tag==='fogo' ? 'fogo' : tag==='veneno' ? 'veneno' : 'roxo', x, y, Math.max(60, rad*2.4));
  sfx.boom();
}
function meteor(x,y,dmg,rad,par){
  if(J.constelacao && !par) meteor(x+rnd(-70,70), y+rnd(-70,70), dmg, rad, true);
  G.fx.push({kind:'warn', x, y, r:rad, life:0.8, max:0.8});
  G.queue.push({t:0.8, fn:()=>{ explode(x,y,rad,dmg,'fogo',{kb:200}); G.shake = Math.max(G.shake,7); }});
}
function strike(target, dmg, chains){
  chains += J.sobrecarga ? 2 : 0;
  const pts = [{x:target.x+rnd(-30,30), y:target.y-260}];
  const done = new Set();
  let cur = target;
  const range = 150*P.area;
  for(let i=0;i<=chains && cur;i++){
    pts.push({x:cur.x, y:cur.y});
    done.add(cur);
    hit(cur, dmg, 'raio');
    cur = nearestEnemy(cur.x, cur.y, range, done);
  }
  G.fx.push({kind:'bolt', pts, life:0.22, max:0.22});
  anim('raio', target.x, target.y - 36, 96);
  for(let i=2;i<pts.length;i++) if(i%2===0) anim('faisca', pts[i].x, pts[i].y, 40);
  sfx.zap();
}
function addZone(x,y,r,dur,dmg,tag){
  r = Math.min(r, 170);
  if(G.zones.length > 40) G.zones.shift();
  G.zones.push({x,y,r,life:dur,max:dur,tick:0,dmg,tag});
  if(tag==='veneno') anim('veneno', x, y, r*1.8, {fundo:true});
}

/* ---------- armas ---------- */
function fireWeapon(w){
  const st = wstat(w.id, w.lvl, w.evo);
  switch(w.id){
    case 'faca':{
      const t = nearestEnemy(P.x,P.y,620);
      if(!t) return false;
      if(w.evo){
        const n = st.n + P.extraN*2 + (J.eco?4:0), off = Math.random()*Math.PI;
        for(let i=0;i<n;i++){

function updateWeapons(dt){

  }

      });

function updateProj(dt){
  for(const p of G.proj){
    if(p.dead) continue;
    p.life -= dt;
    if(p.life<=0){ p.dead=true; continue; }
    if(p.kind==='faca'){
      p.x += p.vx*dt; p.y += p.vy*dt;
      query(p.x,p.y,p.r+45, e=>{
        if(p.dead || p.hit.has(e)) return;
        if(Math.hypot(e.x-p.x,e.y-p.y) < e.r+p.r){
          p.hit.add(e);
          hit(e, p.dmg, p.tag, {kb:40});
          if(p.pierce-- <= 0) p.dead = true;
        }
      });
    } else if(p.kind==='chakram'){
      const step = p.spd*dt;
      if(p.out){
        p.x += Math.cos(p.a)*step; p.y += Math.sin(p.a)*step; p.dist += step;
        if(p.dist >= p.range){ p.out = false; p.hit.clear(); }
      } else {
        const dx=P.x-p.x, dy=P.y-p.y, d=Math.hypot(dx,dy)||1;
        if(d < 20){ p.dead = true; continue; }
        p.x += dx/d*step*1.15; p.y += dy/d*step*1.15;
      }
      query(p.x,p.y,p.r+45, e=>{
        if(p.hit.has(e)) return;
        if(Math.hypot(e.x-p.x,e.y-p.y) < e.r+p.r){ p.hit.add(e); hit(e, p.dmg, 'lamina', {kb:70, volta: !p.out && J.retorno}); }
      });
    } else if(p.kind==='fogo'){
      const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy);
      const step = p.spd*dt;
      let boom = d <= step;
      if(!boom){
        p.x += dx/d*step; p.y += dy/d*step;
        query(p.x,p.y,p.r+45, e=>{ if(!boom && Math.hypot(e.x-p.x,e.y-p.y) < e.r+p.r) boom = true; });
      } else { p.x = p.tx; p.y = p.ty; }
      if(Math.random()<0.6*Q.parts && G.parts.length<500*Q.parts) G.parts.push({x:p.x,y:p.y,vx:rnd(-20,20),vy:rnd(-20,20),life:0.3,max:0.3,cor:'#f07a3a',s:rnd(2,4)});
      if(boom){
        p.dead = true;
        explode(p.x,p.y,p.rad,p.dmg,'fogo');
        if(p.evo) addZone(p.x, p.y, p.rad*0.7, 2.2, p.dmg*0.18, 'fogo');
      }
    }
  }
}
function updateZones(dt){

}

/* ---------- diretor de ameaça e eventos ---------- */
function updateDirector(dt){
  G.recentDmg *= Math.exp(-dt/20);
  if(G.time < 75) return;
  const ratio = G.recentDmg / Math.max(1, P.maxHp);
  // a dificuldade tem um piso que sempre sobe: tomar dano alivia, mas nunca volta atrás
  const piso = 1 + Math.max(0, G.time-120)/240 + Math.max(0, G.round-1)*0.15;
  const cap = Math.max(piso, 1 + Math.pow(G.time/60, 1.4));
  if(ratio > 0.8 || P.hp < P.maxHp*0.2) G.heat *= 1 - 0.02*dt;
  else if(ratio < 0.12) G.heat *= 1 + 0.028*dt;
  else if(ratio < 0.35) G.heat *= 1 + 0.012*dt;
  G.heat = Math.min(cap, Math.max(piso, G.heat));
  G.maxHeat = Math.max(G.maxHeat, G.heat);
  G.heatT -= dt; if(G.heatT<=0){ G.heatT = 1; G.dirty = true; }
}

/* ---------- julgamento: perigos que miram o jogador ---------- */
function updateTorpor(dt){
  P.ferida -= dt;
  G.torporT -= dt;
  if(G.torporT > 0) return;
  G.torporT = 3;
  const andou = Math.hypot(P.x - G.refX, P.y - G.refY);
  G.refX = P.x; G.refY = P.y;
  if(G.time < 20) return;
  // só acumula quem fica de fato na mesma área por dois períodos seguidos
  if(andou < 150){
    G.torporCarga = (G.torporCarga||0) + 1;
    if(G.torporCarga >= 2){
      G.torpor = Math.min(6, G.torpor + 1);
      if(G.torpor === 1 && !G.torporAviso){ G.torporAviso = true; toast(tr('torpor_aviso')); }
    }
  } else { G.torporCarga = 0; G.torpor = Math.max(0, G.torpor - 2); }
  G.dirty = true;
}
function updateHazards(dt){
  if(G.bonus) return;
  updateTorpor(dt);
  if(G.moving) G.stillT = 0; else G.stillT += dt;
  if(G.round < 2) return;
  const parado = G.stillT > 2.5 || G.torpor > 0;
  G.hazT -= dt * (parado ? 2.5 + G.torpor*0.35 : 1);
  if(G.hazT > 0) return;
  const pressao = Math.max(1, G.heat) * (1 + G.time/400) * (1 + G.curse*0.15);
  G.hazT = clamp(8 / Math.sqrt(pressao), 0.9, 8);
  const n = Math.min(6, 1 + Math.floor(Math.log2(pressao)));
  const delay = Math.max(0.75, 1.2 - G.time/3000);
  for(let i=0;i<n;i++){
    let x = P.x, y = P.y;
    if(i===1){ x += G.lastDx*P.speed*0.9; y += G.lastDy*P.speed*0.9; }
    else if(i>1){ const a = Math.random()*Math.PI*2, r = rnd(60,170); x += Math.cos(a)*r; y += Math.sin(a)*r; }
    judgement(x, y, 70, delay + i*0.12);
  }
  if(parado && !G.warnedStill){ G.warnedStill = true; toast(tr('still_warn')); }
}
function judgement(x,y,r,delay,frac){
  G.fx.push({kind:'julg', x, y, r, life:delay, max:delay});
  sfx.warn();
  const f = frac !== undefined ? frac : (0.16 + G.torpor*0.03)*(1+G.curse*0.08);
  G.queue.push({t:delay, fn:()=>{
    if(Math.hypot(P.x-x, P.y-y) < r + P.r*0.6){ damagePlayer(P.maxHp*f, true); P.ferida = 4; }
    G.fx.push({kind:'pilar', x, y, r, life:0.35, max:0.35});
    anim('roxo', x, y, r*2.4, {forte:true});
    sfx.boom();
  }});
}
function meaningfulChoice(){
  if(G.weapons.length < 6 || G.jokers.length < maxJokers()) return true;
  for(const w of G.weapons){
    if(w.lvl < WMAX) return true;

/* ---------- rodadas, mercador e provações ---------- */
function startRound(n){
  G.round = n; G.roundStart = G.time;
  entrarArea(n); G.roundEnd = G.time + ROUND_LEN; G.dirty = true; G.coinDrops = 0; G.adReroll = false; G.wave = 0; G.waveT = ONDA_LEN;
  if(G.char==='errante' && n>1) P.freeRerolls += 1;
  if(P.uniq && P.uniq.has('olhosina') && n>1) P.freeRerolls += 1;
  if(G.mapaCompra) G.mapaCompra = false; else G.mapaRevelado = false;
  if(J.cartomante && n>1) addTarot(randTarot());
  let boss = null;
  if(!G.won && n === FINAL_ROUND) boss = 'ceifador';
  else if((!G.won && n < FINAL_ROUND && n % 3 === 0) || (G.won && n % 2 === 0)) boss = BOSS_CYCLE[G.bossesSpawned++ % BOSS_CYCLE.length];
  if(boss){
    const e = spawnEnemy(boss, {boss:true});
    e.areaBoss = true; e.hp *= 1.5; e.maxHp = e.hp;

    banner(boss==='ceifador' ? tr('reaper_arrives') : tr('boss_wakes', {n:ETYPES[boss].nome}));
    sfx.boss(); gpVibrar(400, 0.8); G.shake = boss==='ceifador' ? 20 : 14;
    tip('boss');

}
function endRound(quit, pularBonus){
  if(!pularBonus && !G.prologo && [3,6,9].includes(G.round) && G.bonusFeito !== G.round){ G.bonusFeito = G.round; iniciarBonus(); return; }
  const base = G.char==='errante' ? 9 : 6;
  const rate = J.juros ? 5 : 10, cap = J.juros ? 10 : 5;
  const intr = Math.min(cap, Math.floor(G.coins/rate));
  const linhas = [tr('round_done', {n:G.round, b:base})];
  G.coins += Math.round(base * (P.uniq.has('avarento') ? 1.25 : 1));
  if(intr){ G.coins += intr; linhas.push(tr('interest', {v:intr})); }
  if(J.pecoelho){ G.coins += 3; linhas.push(`${JOKERS.pecoelho.nome}: +3`); }
  if(G.trial){
    const T = TRIALS[G.trial];
    T.give(); G.trialsDone++;
    linhas.push(tr('trial_done', {n:T.nome, r:lowerFirst(T.rw)}));
  }
  G.trial = null;
  G.eproj = [];
  G.rerollCost = 2; G.shopRerollCost = 2;
  G.shop = genShop();
  G.shopMsg = linhas.join('. ') + '.';
  G.mode = 'shop';
  checkMissions();
  renderShop(); showOnly('shop'); sfx.altar();
  tip('shop');
}
function lowerFirst(x){ return x.charAt(0).toLowerCase()+x.slice(1); }
function genShop(){
  const pool = Object.keys(JOKERS).filter(id=>!J[id] && cartaLiberada(id) && (!JOKERS[id].classe || JOKERS[id].classe===G.char)).map(id=>({id, w:[1,0.8,0.5,0.25][JOKERS[id].rar]}));
  const jokers = [];
  while(jokers.length<3 && pool.length){ const o = pickWeighted(pool); pool.splice(pool.indexOf(o),1); jokers.push(o.id); SAVE.seen['j:'+o.id] = true; }
  const t1 = randTarot(); let t2 = randTarot(); while(t2===t1) t2 = randTarot();
  return {jokers, tarots:[t1, t2], potion:true};
}

function offJoker(id){
  if(id==='vidro'){ P.maxHp *= 2; }
  if(id==='coracao'){ P.maxHp = Math.max(10, P.maxHp-40); P.hp = Math.min(P.hp, P.maxHp); P.armor -= 2; }
  if(id==='trevo'){ P.luck -= 25; }
  if(id==='imanegro') P.magnet /= 1.5;
  if(id==='tambor'){ P.cdr = Math.max(0, P.cdr-0.1); P.area -= 0.1; }
}
$('#shop').addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b || b.disabled || !G || G.mode!=='shop') return;
  const S = G.shop, d = b.dataset;
  if(d.buyj!==undefined){
    const id = S.jokers[+d.buyj], pr = JOKER_PRICE[JOKERS[id].rar];
    if(!id || G.coins<pr || G.jokers.length>=maxJokers()) return;
    G.coins -= pr; G.jokers.push(id); J[id] = true; onJoker(id); S.jokers[+d.buyj] = null; G.bought++; recalcSyn(); sfx.card();
  } else if(d.buyt!==undefined){
    const id = S.tarots[+d.buyt];
    if(!id || G.coins<TAROT_PRICE || !addTarot(id)) return;
    G.coins -= TAROT_PRICE; S.tarots[+d.buyt] = null; G.bought++; sfx.card();
  } else if(d.potion){
    if(!S.potion || G.coins<POTION_PRICE) return;
    G.coins -= POTION_PRICE; P.hp = P.maxHp; S.potion = false; G.bought++; tone(520,0.2,'sine',0.05,1.5);
  } else if(d.forge){
    const w = G.weapons.find(x=>x.id===d.forge);
    if(!w || w.lvl>=FORGE_MAX || G.coins<forgePrice(w)) return;
    G.coins -= forgePrice(w); w.lvl++; G.bought++; G.dirty = true; tone(220,0.3,'square',0.04,2);
  } else if(d.mapa){
    if(G.coins < MAPA_PRECO || G.mapaRevelado) return;
    G.coins -= MAPA_PRECO; G.mapaRevelado = true; G.mapaCompra = true; G.bought++; sfx.card();
  } else if(d.adcoins){
    if(S.adCoins) return;
    Portal.rewarded(()=>{ S.adCoins = true; G.coins += 15; sfx.coin(); renderShop(); }, ()=>toast(tr('ad_fail')), 'bolsa_mercador');
    return;
  } else if(d.sell){
    const id = d.sell, k = G.jokers.indexOf(id);
    if(k<0) return;
    G.jokers.splice(k,1); J[id] = false; offJoker(id); G.coins += Math.floor(JOKER_PRICE[JOKERS[id].rar]/2); recalcSyn(); sfx.coin();
  } else return;
  checkMissions();
  renderShop();
});

/* ---------- loop principal ---------- */
function update(dt){
  G.time += dt;
  G.skillCd -= dt; G.pressaT -= dt; G.eclipseCd -= dt;
  atualizarArea(dt); atualizarBonus(dt);
  G.sfxHit -= dt; G.sfxPick -= dt; G.sfxBoom -= dt; G.sfxZap -= dt; G.sfxWarn -= dt; G.sfxShoot -= dt;
  G.comboT -= dt; if(G.comboT<=0) G.combo = 0;
  G.streakT -= dt; if(G.streakT<=0) G.streak = 0;
  G.leech = Math.max(0, G.leech - dt*6);

  let mx=0, my=0;
  if(keys.ArrowLeft||keys.KeyA) mx-=1;
  if(keys.ArrowRight||keys.KeyD) mx+=1;
  if(keys.ArrowUp||keys.KeyW) my-=1;
  if(keys.ArrowDown||keys.KeyS) my+=1;
  if(joy.active){ mx=joy.dx; my=joy.dy; }
  if(GP.mx || GP.my){ mx = GP.mx; my = GP.my; }
  const m = Math.hypot(mx,my); if(m>1){ mx/=m; my/=m; }
  G.dashCd -= dt;
  if(G.dashT>0){
    G.dashT -= dt;
    P.x += G.dashX*P.speed*3.6*dt; P.y += G.dashY*P.speed*3.6*dt;
    if(G.parts.length<500) G.parts.push({x:P.x+rnd(-6,6),y:P.y+rnd(-8,10),vx:0,vy:0,life:0.3,max:0.3,cor:'#ecdfc6',s:rnd(2,4)});
  } else {
    const regra = regraArea();
    const vel = P.speed * (regra==='lama' ? 0.85 : 1);
    if(regra === 'gelo'){
      // no gelo o personagem desliza: a direção muda aos poucos
      G.velX += (mx*vel - G.velX) * Math.min(1, dt*2.6);
      G.velY += (my*vel - G.velY) * Math.min(1, dt*2.6);
    } else { G.velX = mx*vel; G.velY = my*vel; }
    P.x += G.velX*dt; P.y += G.velY*dt;
  }
  if(Math.hypot(mx,my)>0.1){ G.lastDx = mx; G.lastDy = my; }
  G.moving = Math.hypot(mx,my) > 0.2 || G.dashT > 0 || Math.hypot(G.velX||0, G.velY||0) > 40;
  if(Math.abs(mx)>0.1) P.face = Math.sign(mx);
  P.inv -= dt; P.hurt -= dt;
  if(P.regen) heal(P.regen*dt);

  G.furyT -= dt;
  if(J.metronomo) G.metro += dt;
  G.fury = G.furyT > 0 || (J.metronomo && (G.metro % 13) > 10);

  updateSpawns(dt);
  updateAltars(dt);
  updateDirector(dt);
  updateHazards(dt);
  updateEvents(dt);
  buildGrid();
  updateEnemies(dt);
  if(G.mode!=='play') return;
  updateEnemyProj(dt);
  if(G.mode!=='play') return;
  updateWeapons(dt);
  updateProj(dt);
  updateZones(dt);
  updatePickups(dt);

  const q = G.queue; G.queue = [];
  for(const it of q){ it.t -= dt; if(it.t<=0) it.fn(); else G.queue.push(it); }

  for(const p of G.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; p.life-=dt; }
  for(const t of G.texts){ t.y -= 34*dt; t.life -= dt; }
  for(const f of G.fx) f.life -= dt;
  updateAnims(dt);
  G.impT -= dt;
  G.shake = Math.max(0, G.shake - dt*40);

  G.enemies = G.enemies.filter(e=>!e.dead);
  G.proj = G.proj.filter(p=>!p.dead);
  G.pick = G.pick.filter(p=>!p.dead);
  G.parts = G.parts.filter(p=>p.life>0);
  G.texts = G.texts.filter(t=>t.life>0);
  G.fx = G.fx.filter(f=>f.life>0);

  G.missT -= dt;
  if(G.missT<=0){ G.missT = 1; checkMissions(); }

  if(G.mode==='play'){
    if(G.chestQ.length){ openLevel(G.chestQ.shift(), true); }
    else if(G.pending>0 && !G.rapido){ G.pending--; if(meaningfulChoice()) openLevel(0,false); else autoBless(); }
    else if(!G.bonus && G.time >= G.roundEnd && !G.enemies.some(e=>e.boss) && (!G.won || G.winShown)) endRound();
  }
  updateHud(dt);
}

})();

// silhuetas coloridas (dano/congelado) geradas sob demanda
const tintCache = new Map();
function tinted(sheet, c, r, cor){
  const k = sheet+c+'_'+r+cor;
  let cv2 = tintCache.get(k);
  if(!cv2){
    cv2 = document.createElement('canvas'); cv2.width = cv2.height = 32;
    const g = cv2.getContext('2d');
    g.drawImage(IMG[sheet], c*32, r*32, 32, 32, 0, 0, 32, 32);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = cor; g.fillRect(0,0,32,32);
    tintCache.set(k, cv2);
  }
  return cv2;
}
function spr(sheet, c, r, x, y, size, flip, rot){
  ctx.save();
  ctx.translate(x, y);
  if(rot) ctx.rotate(rot);
  if(flip) ctx.scale(-1, 1);
  ctx.drawImage(IMG[sheet], c*32, r*32, 32, 32, -size/2, -size/2, size, size);
  ctx.restore();
}
function sprTint(sheet, c, r, x, y, size, flip, cor, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if(flip) ctx.scale(-1, 1);
  ctx.drawImage(tinted(sheet,c,r,cor), -size/2, -size/2, size, size);
  ctx.restore();
}

/* ---------- chão em blocos pré-desenhados ---------- */
const FLOOR = [
  {base:[0,6], det:[[1,6],[2,6],[3,6],[1,7],[2,7],[3,7],[1,10],[2,10],[3,10]],
   dec:[[3,23],[4,23],[5,23],[0,23],[1,23],[0,21],[1,21],[0,18],[1,18],[0,25],[1,25],[2,25],[15,16]]},
  {base:[0,13], det:[[1,13],[2,13],[3,13],[1,14],[2,14],[3,14]],
   dec:[[0,19],[1,19],[2,19],[3,19],[4,19],[5,19],[6,19],[0,20],[1,20],[2,22],[3,22],[0,25],[1,25],[2,25],[0,18]]},
  {base:[0,11], det:[[1,11],[2,11],[3,11]],
   dec:[[0,22],[1,22],[2,17],[3,17],[4,17],[0,23],[2,23],[0,21],[15,16],[16,16],[5,17]]},
  {base:[0,12], det:[[1,12],[2,12],[3,12],[1,9],[2,9],[3,9]],
   dec:[[14,16],[0,18],[1,18],[0,21],[1,21],[16,16],[0,22],[6,23]]},
];
const TILE = 64, CHUNK = 8;
const chunkCache = new Map();
function floorChunk(b, cx, cy){
  const k = b+':'+cx+':'+cy;
  let cv2 = chunkCache.get(k);
  if(cv2) return cv2;
  cv2 = document.createElement('canvas');
  cv2.width = cv2.height = TILE*CHUNK;
  const g = cv2.getContext('2d');
  g.imageSmoothingEnabled = false;
  const F = FLOOR[b], T = IMG.tiles;
  for(let i=0;i<CHUNK;i++) for(let j=0;j<CHUNK;j++){
    const tx = cx*CHUNK+i, ty = cy*CHUNK+j, h = hash(tx,ty,5+b);
    const cel = (h%100) < 22 ? F.det[h % F.det.length] : F.base;
    g.drawImage(T, cel[0]*32, cel[1]*32, 32, 32, i*TILE, j*TILE, TILE, TILE);
  }
  for(let i=0;i<CHUNK;i++) for(let j=0;j<CHUNK;j++){
    const tx = cx*CHUNK+i, ty = cy*CHUNK+j, h = hash(tx,ty,31+b);
    if(h%100 >= 9) continue;
    const cel = F.dec[(h>>>7) % F.dec.length];
    const ox = ((h>>>12)%24)-12, oy = ((h>>>17)%24)-12;
    g.drawImage(T, cel[0]*32, cel[1]*32, 32, 32, i*TILE+ox, j*TILE+oy, TILE, TILE);
  }
  if(chunkCache.size > 60) chunkCache.delete(chunkCache.keys().next().value);
  chunkCache.set(k, cv2);
  return cv2;
}
function drawGround(b, x0, y0, w, h, now){
  if(!artReady) return;
  ctx.imageSmoothingEnabled = false;
  const S = TILE*CHUNK;
  for(let cx=Math.floor(x0/S); cx<=Math.floor((x0+w)/S); cx++)
    for(let cy=Math.floor(y0/S); cy<=Math.floor((y0+h)/S); cy++)
      ctx.drawImage(floorChunk(b,cx,cy), cx*S, cy*S);
  // velas e cogumelos com brilho vivo por cima do chão
  if(Q.glow){
    const T2 = 128;
    for(let tx=Math.floor(x0/T2); tx<=Math.floor((x0+w)/T2); tx++)
      for(let ty=Math.floor(y0/T2); ty<=Math.floor((y0+h)/T2); ty++){
        const hh = hash(tx,ty,77+b);
        if(hh%100 >= 6) continue;
        const px = tx*T2 + (hh>>>8)%T2, py = ty*T2 + (hh>>>16)%T2;
        const cor = b===1 ? '#a8d63c' : b===3 ? '#b46be0' : '#f2b544';
        glow(px, py, 40 + Math.sin(now*6+hh)*4, 0.09, cor);
      }
  }
}

/* ---------- personagens ---------- */
function playerCell(){
  if(SAVE.skin && SKINS[SAVE.skin]) return SKINS[SAVE.skin].c;
  return SPR_CHAR[G.char] || SPR_CHAR.andarilho;
}
function drawPlayer(t){
  ctx.save();
  if(P.inv>0 && Math.floor(t*20)%2) ctx.globalAlpha = 0.45;
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(P.x,P.y+16,14,4.5,0,0,Math.PI*2); ctx.fill();
  if(G.dashCd>0){ ctx.strokeStyle='rgba(236,223,198,.45)'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(P.x,P.y+16,18,6,0,-Math.PI/2,-Math.PI/2+(1-G.dashCd/2.2)*Math.PI*2); ctx.stroke(); }
  const andando = G.moving;
  const bob = andando ? Math.abs(Math.sin(t*12))*-3 : Math.sin(t*3)*0.8;
  const inc = andando ? Math.sin(t*12)*0.06 : 0;
  const [c, r] = playerCell();

function drawFog(b, x0, y0, w, h, now){
  if(!Q.fog) return;

  for(let cx=Math.floor((x0-drift)/S)-1; cx<=Math.floor((x0+w-drift)/S)+1; cx++){

function drawPointers(Z, VW, VH, camX, camY){

  if((P.tree && P.tree.sentido) || G.mapaRevelado) for(const r of G.reliq) targets.push({x:r.x, y:r.y, cor:RELIQ[r.tipo].cor});
  const m = 34;
  for(const t of targets){
    const sx = (t.x - camX)*Z + W/2, sy = (t.y - camY)*Z + H/2;
    if(sx>0 && sx<W && sy>0 && sy<H) continue;
    const a = Math.atan2(sy-H/2, sx-W/2);
    const kx = (W/2-m)/Math.abs(Math.cos(a)||1e-6), ky = (H/2-m-40)/Math.abs(Math.sin(a)||1e-6);

    ctx.restore();
  }
}

  ctx.setTransform(DPR,0,0,DPR,0,0);

  ctx.fillStyle = vignette; ctx.fillRect(0,0,W,H);
  if(inGame){
    if(G.trial==='escuro' || regraArea()==='escuro'){
      const m = Math.min(W,H), g = ctx.createRadialGradient(W/2,H/2,m*0.14,W/2,H/2,m*0.45);
      g.addColorStop(0,'rgba(5,3,10,0)'); g.addColorStop(1,'rgba(5,3,10,.97)');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    }
    drawPointers(Z, VW, VH, camX, camY);
    if(G.fury){ ctx.fillStyle='rgba(242,181,68,.08)'; ctx.fillRect(0,0,W,H); }
    if(G.evt==='eclipse'){ ctx.fillStyle='rgba(12,0,20,.35)'; ctx.fillRect(0,0,W,H); }
    if(G.evt==='mare'){ ctx.fillStyle='rgba(130,10,35,.14)'; ctx.fillRect(0,0,W,H); }
    if(P.hurt>0){ ctx.fillStyle=`rgba(201,59,86,${P.hurt*0.8})`; ctx.fillRect(0,0,W,H); }
  }
}

let last = 0;
function loop(ts){
  const now = ts/1000;
  const dt = Math.min(0.05, last ? now-last : 0.016);
  last = now;
  pollGamepad(dt);
  if(G && G.mode==='play' && !adPlaying){ update(dt * (G.rapido ? 0.35 : 1)); tutUpdate(dt); prologoUpdate(dt); trackFps(dt); }
  updateMusic();
  syncPortal();
  render(dt);
  requestAnimationFrame(loop);
}

/* ---------- cartas ---------- */
function rollRarity(min){
  const L = effLuck(), r = G ? G.round : 1;
  const w = [Math.max(18, 60 - r*3), 26 + L*0.3 + r*1.6, 10 + L*0.2 + r*1.4, 3 + L*0.1 + r*0.7];
  for(let i=0;i<min;i++) w[i]=0;
  const s = w.reduce((a,b)=>a+b,0);
  let x = Math.random()*s;
  for(let i=0;i<4;i++){ x-=w[i]; if(x<=0) return i; }
  return 3;
}
function makeCard(kind, id, minRar){
  if(kind==='evo'){
    const w = G.weapons.find(x=>x.id===id), W_ = WEAPONS[id];
    tip('evo');
    return {kind, id, rar:3, tag:W_.tag, label:tr('lbl_evo'), title:W_.evo.nome, desc:`${W_.nome} + ${JOKERS[W_.evo.joker].nome}. ${W_.evo.desc}`,
      apply:()=>{ w.evo = true; SAVE.seen['e:'+id] = true; persist(); banner(W_.evo.nome); sfx.evo(); G.shake = 10; Portal.happy(); }};
  }
  if(kind==='up'){
    const w = G.weapons.find(x=>x.id===id), W_ = WEAPONS[id];
    const rar = rollRarity(minRar), to = Math.min(WMAX, w.lvl + (rar>=2?2:1));
    return {kind, id, rar, tag:W_.tag, label:tr('lbl_up'), title:tr('up_title', {n:W_.nome, l:to}), desc:diffText(id,w.lvl,to), apply:()=>{ w.lvl = to; }};
  }
  if(kind==='new'){
    const W_ = WEAPONS[id], rar = rollRarity(minRar), l = rar>=2?2:1;
    return {kind, id, rar, tag:W_.tag, label:tr('lbl_new'), title:W_.nome, desc:W_.desc + (l>1?tr('new_lvl2'):''), apply:()=>{ G.weapons.push({id, lvl:l, t:0.2, evo:false}); }};
  }
  if(kind==='joker'){
    const j = JOKERS[id];
    return {kind, id, rar:j.rar, tag:j.tag, label:tr(j.classe ? 'class_card' : 'lbl_joker'), title:j.nome, desc:j.d, apply:()=>{ G.jokers.push(id); J[id]=true; onJoker(id); }};
  }
  const b = BLESS.find(x=>x.id===id);
  const rar = rollRarity(Math.max(minRar, b.min||0)), m = RAR[rar].m;
  return {kind:'bless', id, rar, tag:null, label:tr('lbl_bless'), title:b.nome, desc:b.d(m), apply:()=>b.f(P,m)};
}
function onJoker(id){
  if(id==='vidro'){ P.maxHp = Math.max(10, Math.floor(P.maxHp/2)); P.hp = Math.min(P.hp, P.maxHp); }
  if(id==='coracao'){ P.maxHp += 40; P.hp += 40; P.armor += 2; }
  if(id==='trevo'){ P.luck += 25; P.freeRerolls += 1; }
  if(id==='imanegro') P.magnet *= 1.5;
  if(id==='tambor'){ P.cdr = Math.min(0.6, P.cdr+0.1); P.area += 0.1; }
}
function genCards(minRar){
  const pool = [];
  const luckBoost = 1 + effLuck()/60;
  for(const w of G.weapons){
    const W_ = WEAPONS[w.id];
    if(w.lvl < WMAX) pool.push({kind:'up', id:w.id, w:2.6});
    else if(!w.evo && J[W_.evo.joker] && G.round >= 4) pool.push({kind:'evo', id:w.id, w:8});
  }
  if(G.weapons.length < 6)
    for(const id in WEAPONS) if(!G.weapons.some(w=>w.id===id)) pool.push({kind:'new', id, w:1.1});
  if(G.jokers.length < maxJokers())
    for(const id in JOKERS){
      if(J[id]) continue;
      if(JOKERS[id].classe && JOKERS[id].classe !== G.char) continue;
      if(!cartaLiberada(id)) continue;
      const r = JOKERS[id].rar;
      if(r < minRar-1) continue;
      let wt = [1.0, 0.75 + G.round*0.03, 0.42 + G.round*0.04, 0.18 + G.round*0.03][r]*(r>=2?luckBoost:1);
      // coringas que evoluem uma arma que você já tem aparecem mais
      if(G.weapons.some(w=>WEAPONS[w.id].evo.joker===id && !w.evo)) wt *= 1.8;
      if(JOKERS[id].classe) wt *= 1.6;
      pool.push({kind:'joker', id, w:wt});
    }
  for(const b of BLESS){
    if(b.id==='multi' && P.extraN>=3) continue;
    if(b.id==='cura' && P.hp >= P.maxHp*0.9) continue;
    pool.push({kind:'bless', id:b.id, w: b.id==='multi' ? 0.25 : 0.4});
  }
  const out = [];
  const n = cardCount();
  // evolução disponível sempre aparece
  const evo = pool.find(o=>o.kind==='evo');
  if(evo){ pool.splice(pool.indexOf(evo),1); out.push(makeCard('evo', evo.id, minRar)); }
  while(out.length<n && pool.length){
    const o = pickWeighted(pool);
    pool.splice(pool.indexOf(o),1);
    out.push(makeCard(o.kind, o.id, minRar));
  }
  for(const c of out){
    if(c.kind==='new' || c.kind==='up') SAVE.seen['w:'+c.id] = true;
    if(c.kind==='joker') SAVE.seen['j:'+c.id] = true;
  }
  return out;
}
function openLevel(minRar, chest){
  // escolha rápida: mostra as cartas numa barra e segue jogando em câmera lenta
  if(SAVE.opt.rapido && !chest && !(G.tut && !G.tut.done) && G.mode === 'play'){
    G.offerMin = minRar; G.offerChest = false;
    if(J.trevo) P.freeRerolls += 1;
    if(G.char==='astrologa' && G.lvl % 3 === 0) G.cartaExtra = 1;
    G.offer = genCards(minRar);
    G.rapido = true;
    renderRapido();
    sfx.level();
    return;
  }
  G.mode = 'level';
  G.offerMin = minRar; G.offerChest = chest;
  if(!chest){
    if(J.trevo) P.freeRerolls += 1;
  }
  if(!chest && G.char==='astrologa' && G.lvl % 3 === 0) G.cartaExtra = 1;
  G.offer = genCards(minRar);
  G.levelAt = performance.now();
  $('#levelTitulo').textContent = chest ? tr(minRar>=3 ? 'leg_title' : 'chest_title') : tr('lvl_title', {n:G.lvl - G.pending});
  renderCards();
  showOnly('level');
  if(chest) sfx.card(); else sfx.level();
}

      <kbd>${i+1}</kbd>`;
    b.addEventListener('click', ()=>{ if(performance.now() - G.levelAt >= 350) chooseCard(i); });

  const rb = $('#btnReroll');

function escolherRapido(i){

function chooseCard(i){
  if(G.mode!=='level' || !G.offer[i]) return;

function reroll(){
  if(G.mode!=='level') return;

/* ---------- morte, vitória e fim ---------- */
function die(){
  if(G.prologo){ P.hp = P.maxHp*0.5; return; }
  if(P.uniq.has('fenixanel') && !G.fenixUsada){ G.fenixUsada = true; P.hp = P.maxHp*0.3; P.inv = 2; anim('cura', 0, 0, 160, {segue:true, forte:true}); banner(loc(UNICO_TXT.fenixanel)[0]); return; }
  if(P.revives>0){ P.revives--; revive(); banner(tr('phoenix')); return; }
  endRun(false);
}
function revive(){
  P.hp = Math.round(P.maxHp*0.6); P.inv = 2.5;
  for(const e of G.enemies) if(!e.boss && Math.hypot(e.x-P.x,e.y-P.y) < 340){ e.dead = true; burst(e.x,e.y,3,e.cor); }
  G.eproj = [];
  G.fx.push({kind:'ring', x:P.x, y:P.y, r:340, life:0.5, max:0.5, cor:'#f2b544'});
  G.shake = 16;
  anim('cura', 0, 0, 160, {segue:true, forte:true});
  tone(260,0.6,'triangle',0.06,3);
}
function soulsFor(){ return Math.floor((G.kills/400 + G.time/6 + G.bossKills*30 + (G.won?150:0) + (G.almasBonus||0)) * P.soulMult * (1 + G.curse*0.3) * (1 + Math.min(0.5, (G.maxHeat-1)*0.03))); }
function showWin(){
  if(G.mode==='dead') return;
  G.mode = 'win'; G.winShown = true;
  const novo = Math.min(5, G.curse+1);
  const liberou = novo > SAVE.maxCurse;
  SAVE.maxCurse = Math.max(SAVE.maxCurse, novo);
  persist();
  checkMissions();
  Portal.happy();
  $('#winTxt').textContent = (G.curse ? tr('win_txt_c', {t:fmtTime(G.time), c:G.curse}) : tr('win_txt', {t:fmtTime(G.time)})) +
    (liberou ? tr('win_unlock', {n:novo}) : '') + tr('win_inf');
  showOnly('win');
  sfx.evo();
}
function endRun(quit){
  if(G.prologo){ fimPrologo(); return; }
  checkMissions();
  G.mode = 'dead'; G.quit = quit;
  const s = soulsFor();
  SAVE.almas += s; G.soulsGiven = s;
  const novoRecorde = G.time > SAVE.best.time;
  if(novoRecorde) SAVE.best.time = G.time;
  if(G.kills > SAVE.best.kills) SAVE.best.kills = G.kills;
  if(!G.recorded){
    G.recorded = true;
    SAVE.runs.push({t:Math.floor(G.time), k:G.kills, l:G.lvl, c:G.char, m:G.curse, w:G.won?1:0, d:Date.now()});
    SAVE.runs.sort((a,b)=>b.t-a.t || b.k-a.k);
    SAVE.runs = SAVE.runs.slice(0,10);
  }
  if(G.tut && !G.tut.done) tutEnd();
  const achados = guardarLoot();
  G.lootMostrado = (G.lootMostrado || []).concat(achados);
  $('#deadLoot').innerHTML = G.lootMostrado.length ? `<p class="desc">${tr('loot_title')}</p><div class="eq-grade pequena">${G.lootMostrado.map(it=>`<span class="eq-item" title="${nomeItem(it)}">${iconeItem(it)}</span>`).join('')}</div>` : '';
  persist();
  if(CONTA.user) agendarEnvio();
  $('#deadTitulo').textContent = tr(G.won ? 'dead_title_win' : 'dead_title');
  $('#deadStats').innerHTML = `
    <div><dt>${tr('th_time')}</dt><dd>${fmtTime(G.time)}</dd></div>
    <div><dt>${tr('th_lvl')}</dt><dd>${G.lvl}</dd></div>
    <div><dt>${tr('th_kills')}</dt><dd>${fmtN(G.kills)}</dd></div>
    <div><dt>${tr('th_bosses')}</dt><dd>${G.bossKills}</dd></div>`;
  G.recordFlag = novoRecorde && G.time>30;
  updateGanho();
  // botões de anúncio só aparecem quando há um SDK de anúncios ativo (Poki ou CrazyGames)
  const semAnuncio = !adsOn();
  $('#btnReviver').hidden = semAnuncio || quit || G.adUsed || G.won;
  $('#btnDobrar').hidden = semAnuncio || G.doubled || s < 5;
  showOnly('dead');
  tone(200,0.8,'sawtooth',0.05,0.3,0.4);
}
function updateGanho(){
  $('#deadGanho').innerHTML = tr('gain', {n:G.soulsGiven}) + (G.recordFlag && !G.doubled ? tr('new_record') : '');
}
function reviveWithAd(){
  if(G.adUsed || G.quit || G.doubled) return;
  Portal.rewarded(()=>{
    G.adUsed = true;
    SAVE.almas = Math.max(0, SAVE.almas - G.soulsGiven); G.soulsGiven = 0;
    SAVE.runs = SAVE.runs.filter(r=>!(r.t===Math.floor(G.time) && r.k===G.kills));
    G.recorded = false;
    persist();
    revive();
    resumePlay();

}

function renderCurse(){
  $('#curseSel').hidden = SAVE.maxCurse < 1;

addEventListener('keydown', ev=>{
  if(adPlaying){ ev.preventDefault(); return; }
  keys[ev.code] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(ev.code)) ev.preventDefault();
  if(!G) return;
  if(ev.code==='Escape' || ev.code==='KeyP'){ if(G.mode==='play') pause(); else if(G.mode==='pause') unpause(); }
  if(ev.code==='KeyM') toggleMute();
  if(['Space','ShiftLeft','ShiftRight','KeyK'].includes(ev.code)) dash();
  if(ev.code==='KeyQ') useTarot(0);
  if(ev.code==='KeyF') usarHabilidade();
  if(ev.code==='KeyE') useTarot(1);
  if(G.mode==='trial'){
    if(ev.repeat) return;
    if(ev.code==='Digit1'||ev.code==='Numpad1') chooseTrial(G.trialOffer[0]);
