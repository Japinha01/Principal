<style>
:root{
  --ink:#27304a; --ink2:#5b6480; --paper:#fffdf7; --line:#e8e1d2;
  --yellow:#ffd23f; --red:#ff5a4e; --blue:#4d8dff; --green:#3ccf7a; --purple:#8a7dff; --orange:#ff9f1a;
  --shadow:0 5px 0 rgba(39,48,74,.18), 0 12px 24px rgba(39,48,74,.18);
  --font:'Fredoka', ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#7fcaf5 0%,#bfe9ff 55%,#d9f4ff 100%);font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
[hidden]{display:none!important}
.panel{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);border:2px solid #fff}

/* ---------- topo ---------- */
#top{position:fixed;left:12px;right:12px;top:calc(10px + var(--safeT));display:flex;gap:10px;align-items:stretch;pointer-events:none;z-index:5}
#top > *{pointer-events:auto}
.chip{display:flex;align-items:center;gap:8px;padding:8px 14px;min-height:50px}
.brand{font-weight:700;font-size:18px;letter-spacing:.04em}
.brand b{color:var(--red)}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,#ffc400 55%,#e0a100);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);flex-shrink:0}
#coins{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--ink2);font-weight:600}
#power{min-width:170px;flex-direction:column;align-items:stretch;justify-content:center;gap:3px}
#power .row{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink2)}
.pbar{height:10px;border-radius:99px;background:#e9eef5;overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#3ccf7a,#9be15d);transition:width .3s}
.pbar.low i{background:linear-gradient(90deg,#ff5a4e,#ff9f1a)}
.spacer{flex:1}
.tbtn{border:0;background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:0 16px;min-height:50px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;transition:transform .1s}
.tbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(39,48,74,.18)}
.tbtn.glow{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:var(--shadow),0 0 0 0 rgba(255,210,63,.9)}50%{box-shadow:var(--shadow),0 0 0 8px rgba(255,210,63,0)}}

/* ---------- objetivo ---------- */
#goal{position:fixed;right:12px;top:calc(72px + var(--safeT));width:300px;padding:14px 16px 14px;z-index:4}
#goal .eh{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
#goal h3{margin:4px 0 10px;font-size:20px;line-height:1.15}
.need{display:grid;grid-template-columns:36px 1fr auto;gap:2px 8px;align-items:center;margin-bottom:8px}
.need img{width:36px;height:36px;grid-row:span 2}
.need .nm{font-weight:600;font-size:15px}
.need .ct{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.need .bar{grid-column:2 / span 2;height:9px;border-radius:99px;background:#eef1f6;overflow:hidden}
.need .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#7ab0ff);border-radius:99px;transition:width .25s}
.need.done .bar i{background:linear-gradient(90deg,var(--green),#9be15d)}
.reward{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--ink2);padding-top:8px;border-top:2px dashed var(--line)}
.reward .pill{display:inline-flex;align-items:center;gap:4px;background:#fff4c9;border-radius:99px;padding:2px 9px 2px 3px;color:var(--ink)}
.reward .pill img{width:22px;height:22px}
.hint{margin-top:10px;background:#eaf3ff;border-radius:12px;padding:9px 11px;font-size:14px;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
.hint b{font-size:16px}
.hint button{margin-left:auto;border:0;background:var(--blue);color:#fff;border-radius:10px;padding:5px 10px;font-weight:700;font-size:13px;flex-shrink:0}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:#dfe3ea}
.dots i.on{background:var(--green)}
.dots i.cur{background:var(--yellow);box-shadow:0 0 0 2px #fff2b3}
#goalToggle{display:none}

/* ---------- barra de construção ---------- */
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safeB));display:flex;gap:6px;padding:8px;max-width:calc(100vw - 24px);overflow-x:auto;z-index:5;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.sep{width:2px;background:var(--line);border-radius:2px;margin:6px 2px;flex-shrink:0}
.bb{position:relative;flex-shrink:0;width:68px;height:78px;border:0;border-radius:14px;background:#f3efe6;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 5px;transition:transform .1s, background .15s}
.bb img{width:56px;height:56px;position:absolute;top:2px;left:6px;pointer-events:none;transition:transform .15s}
.bb:hover img{transform:translateY(-3px) scale(1.06)}
.bb .cost{font-size:12px;font-weight:700;color:#8a6d00;background:#fff3c2;border-radius:99px;padding:0 7px;position:relative}
.bb .key{position:absolute;top:3px;left:4px;font-size:10px;font-weight:700;color:var(--ink2);background:#fff;border-radius:6px;padding:0 4px;line-height:15px}
.bb.sel{background:var(--yellow);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.bb.poor .cost{color:#b8322a;background:#ffe0dc}
.bb.locked{background:#eceff3;cursor:default}
.bb.locked img{filter:grayscale(1) brightness(.35) opacity(.35)}
.bb.locked .cost{background:#dfe3ea;color:var(--ink2)}
.bb.new::after{content:'NOVO';position:absolute;top:-6px;right:-4px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px}
.bb.hinted{animation:pulse 1.1s infinite}
.bb.tool{background:#e9f0ff}
.bb.tool .ico{font-size:26px;position:absolute;top:12px}
.bb.tool.sel{background:var(--red);color:#fff}
#tip{position:fixed;z-index:9;pointer-events:none;width:260px;padding:12px 14px;font-size:14px;line-height:1.35}
#tip h4{margin:0 0 3px;font-size:17px}
#tip .rc{display:flex;align-items:center;gap:3px;margin-top:6px;font-weight:600;font-size:13px;flex-wrap:wrap}
#tip .rc img{width:26px;height:26px}
#tip .muted{color:var(--ink2)}

/* ---------- ferramentas rápidas ---------- */
#quick{position:fixed;left:12px;bottom:calc(112px + var(--safeB));display:flex;flex-direction:column;gap:8px;z-index:5}
#quick .tbtn{width:50px;justify-content:center;padding:0;font-size:22px}
#cursorTip{position:fixed;z-index:8;pointer-events:none;background:rgba(39,48,74,.9);color:#fff;font-size:13px;font-weight:600;padding:5px 10px;border-radius:10px;transform:translate(14px,14px);white-space:nowrap}

/* ---------- inspeção ---------- */
#inspect{position:fixed;left:12px;top:calc(72px + var(--safeT));width:290px;padding:14px;z-index:4}
#inspect .h{display:flex;gap:10px;align-items:center}
#inspect .h img{width:54px;height:54px}
#inspect h3{margin:0;font-size:19px}
.st{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:#dff7e8;color:#1c7a45}
.st.bad{background:#ffe3d6;color:#b8322a}
.st.meh{background:#eef1f6;color:var(--ink2)}
.rcps{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.rcp{display:flex;align-items:center;gap:3px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:5px 8px;font-weight:600;font-size:13px;text-align:left}
.rcp img{width:28px;height:28px}
.rcp.on{border-color:var(--blue);background:#eaf3ff}
.rcp .t{margin-left:auto;color:var(--ink2);font-size:12px}
.bufs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:13px;font-weight:700}
.bufs span{display:inline-flex;align-items:center;gap:2px;background:#f3efe6;border-radius:99px;padding:2px 9px 2px 2px}
.bufs img{width:24px;height:24px}
.acts{display:flex;gap:6px;margin-top:12px}
.acts button{flex:1;border:0;border-radius:12px;padding:9px 6px;font-weight:700;background:#eef1f6;white-space:nowrap;font-size:14px}
.acts .x{flex:0 0 42px}
.acts .del{background:#ffe0dc;color:#b8322a}

/* ---------- avisos e textos flutuantes ---------- */
#toasts{position:fixed;left:50%;top:calc(76px + var(--safeT));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:8;pointer-events:none}
.toast{padding:9px 16px;font-weight:600;font-size:15px;animation:tin .25s ease-out}
.toast.err{background:#fff0ee;color:#b8322a}
@keyframes tin{from{transform:translateY(-10px) scale(.95);opacity:0}}
#banner{position:fixed;left:50%;top:calc(76px + var(--safeT));transform:translateX(-50%);z-index:9;padding:14px 22px;text-align:center;min-width:260px;animation:bin .5s cubic-bezier(.2,1.6,.4,1)}
#banner h2{margin:0;font-size:24px;color:var(--green)}
#banner .row{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:6px;font-weight:700}
#banner img{width:40px;height:40px}
@keyframes bin{from{transform:translateX(-50%) translateY(-40px) scale(.6);opacity:0}}
#floats{position:fixed;inset:0;pointer-events:none;z-index:3}
.fl{position:absolute;font-weight:700;font-size:18px;color:#fff;text-shadow:0 2px 0 #c79a00,0 0 6px rgba(0,0,0,.25);animation:flt 1.1s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes flt{to{transform:translate(-50%,-150%);opacity:0}}

/* ---------- janelas ---------- */
#modal{position:fixed;inset:0;background:rgba(39,48,74,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;backdrop-filter:blur(3px)}
#modal .card{width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;text-align:center;animation:bin2 .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes bin2{from{transform:scale(.7);opacity:0}}
#modal h2{margin:0 0 4px;font-size:28px}
#modal .kick{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
#modal p{color:var(--ink2);line-height:1.45;margin:8px 0}
.unl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.unl div{width:96px;background:#f7f3ea;border-radius:14px;padding:6px 4px 8px;font-weight:600;font-size:13px}
.unl img{width:72px;height:72px;display:block;margin:0 auto}
.big{border:0;border-radius:16px;background:var(--yellow);font-weight:700;font-size:18px;padding:13px 28px;box-shadow:0 5px 0 #d9a800;margin-top:8px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #d9a800}
.big.sec{background:#eef1f6;box-shadow:0 5px 0 #c9d0db}
.menu{display:flex;flex-direction:column;gap:8px;text-align:left}
.menu .line{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.seg{display:flex;background:#eef1f6;border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 12px;font-weight:700}
.seg button.on{background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.menu .wide{border:0;border-radius:12px;background:#eef1f6;padding:11px;font-weight:700;text-align:center}
.menu .wide.del{background:#ffe0dc;color:#b8322a}
.menu small{color:var(--ink2);line-height:1.4}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;text-align:left}
.up{background:#f7f3ea;border-radius:14px;padding:12px}
.up h4{margin:0;font-size:16px}
.up p{margin:3px 0 8px!important;font-size:13px}
.pips{display:flex;gap:4px;margin-bottom:8px}
.pips i{flex:1;height:7px;border-radius:99px;background:#e1dccf}
.pips i.on{background:var(--green)}
.up button{width:100%;border:0;border-radius:10px;padding:8px;font-weight:700;background:var(--yellow)}
.up button:disabled{background:#e1dccf;color:var(--ink2);cursor:default}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.stats div{background:#f7f3ea;border-radius:12px;padding:10px 4px;font-size:12px;color:var(--ink2);font-weight:600}
.stats b{display:block;font-size:20px;color:var(--ink)}

/* ---------- título ---------- */
#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;background:radial-gradient(ellipse at center,rgba(255,255,255,.25),rgba(127,202,245,.1) 60%);text-align:center}
.logo{font-size:clamp(46px,11vw,104px);font-weight:700;line-height:.95;color:#fff;letter-spacing:.02em;text-shadow:0 4px 0 #ff9f1a,0 8px 0 #ff5a4e,0 14px 24px rgba(39,48,74,.35);transform:rotate(-3deg)}
.logo b{color:var(--yellow);text-shadow:0 4px 0 #ff5a4e,0 8px 0 #b8322a,0 14px 24px rgba(39,48,74,.35)}
.tag{font-size:18px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.85);padding:6px 16px;border-radius:99px;margin:14px 0 8px}
#title .btns{display:flex;flex-direction:column;gap:12px;align-items:center}
#title .ctl{font-size:13px;color:var(--ink2);max-width:520px;background:rgba(255,255,255,.7);padding:8px 14px;border-radius:12px;margin-top:10px}

/* ---------- celular ---------- */
@media (max-width: 760px){
  .brand,#top .sub.rev{display:none}
  #top{left:8px;right:8px;gap:6px}
  .chip{padding:6px 10px;min-height:44px}
  #coins{font-size:18px}
  #power{min-width:0;flex:1}
  .tbtn{min-height:44px;padding:0 12px}
  .tbtn .lbl{display:none}
  #goal{left:8px;right:8px;width:auto;top:calc(58px + var(--safeT));padding:8px 12px 9px;border-radius:14px}
  #goal .eh{font-size:10.5px}
  #goal h3{font-size:15px;margin:1px 0 4px}
  #goal.min .body{display:none}
  #goalToggle{display:block;border:0;background:none;font-weight:700;color:var(--blue);padding:0 4px;font-size:15px}
  .need{grid-template-columns:24px 1fr auto;gap:1px 6px;margin-bottom:4px}
  .need img{width:24px;height:24px}
  .need .nm{font-size:13px}
  .need .ct{font-size:12px}
  .need .bar{height:6px}
  .reward{font-size:11px;padding-top:5px;gap:4px}
  .reward .pill{padding:0 7px 0 2px}
  .reward .pill img{width:18px;height:18px}
  .hint{font-size:12.5px;padding:6px 9px;margin-top:6px;border-radius:10px}
  .hint b{font-size:13px}
  .hint button{padding:4px 8px;font-size:12px}
  #inspect{left:8px;right:8px;width:auto;top:auto;bottom:calc(98px + var(--safeB));padding:10px 12px}
  #inspect .desc{display:none}
  #inspect .h img{width:42px;height:42px}
  #inspect h3{font-size:17px}
  .rcps{margin-top:6px;gap:4px}
  .rcp{padding:3px 8px}
  .acts{margin-top:8px}
  body.insp #quick{display:none}
  #bar{left:8px;right:8px;transform:none;bottom:calc(8px + var(--safeB))}
  .bb{width:60px;height:70px}
  .bb img{width:48px;height:48px;left:6px}
  .bb .key{display:none}
  #quick{bottom:calc(96px + var(--safeB));left:8px;flex-direction:row}
  #quick .tbtn{width:44px;min-height:44px;font-size:20px;border-radius:14px}
}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="floats"></div>

<div id="top" hidden>
  <div class="panel chip brand">FUNDIÇÃO <b>7</b></div>
  <div class="panel chip"><i class="coin"></i><span id="coins">$0</span><span class="sub rev" id="rev"></span></div>
  <div class="panel chip" id="power" hidden><div class="row"><span>⚡ <span data-t="power"></span></span><span id="ptext"></span></div><div class="pbar" id="pbar"><i></i></div></div>
  <div class="spacer"></div>
  <button class="tbtn" id="btnUp">⬆<span class="lbl" data-t="upgrades"></span></button>
  <button class="tbtn" id="btnMenu">☰</button>
</div>

<aside id="goal" class="panel" hidden></aside>
<div id="inspect" class="panel" hidden></div>
<nav id="bar" class="panel" hidden></nav>
<div id="quick" hidden>
  <button class="tbtn" id="qRot" title="R">↻</button>
  <button class="tbtn" id="qCamL" title="Q">⟲</button>
  <button class="tbtn" id="qCamR" title="E">⟳</button>
</div>
<div id="tip" class="panel" hidden></div>
<div id="cursorTip" hidden></div>
<div id="toasts"></div>
<div id="banner" class="panel" hidden></div>
<div id="modal" hidden><div class="card panel" id="modalCard"></div></div>

<div id="title">
  <div class="logo">FUNDIÇÃO <b>7</b></div>
  <div class="tag" id="tTag"></div>
  <div class="btns">
    <button class="big" id="tContinue" hidden></button>
    <button class="big" id="tNew"></button>
    <div class="seg" id="tLang"><button data-l="pt">PT</button><button data-l="en">EN</button></div>
  </div>
  <div class="ctl" id="tCtl"></div>
</div>

<script type="module" src="./src/main.js"></script>
<script>if('serviceWorker' in navigator && location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body>
